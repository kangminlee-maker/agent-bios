name: Windows script release
# Publishes the script distribution (signed PowerShell bootstrap + wrappers over an
# approved or provisioned CPython 3.13, no custom EXE) as an immutable GitHub
# release. The release page carries the one-line command for that exact tag.
#
#   preview  unsigned prerelease; the bootstrap runs only with -AcceptUnsignedPreview.
#            Tag shape: windows-script-v<package version>-preview.<n>
#   stable   signed with the release identity from the WINDOWS_CODESIGN_* secrets and
#            timestamped; resolved by the documented releases/latest command.
#            Tag shape: windows-script-v<package version>
#
# Every run re-qualifies the exact assets it publishes (PowerShell 5.1 and 7), then
# downloads them anonymously and runs the published one-line command end to end.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'preview (unsigned prerelease) or stable (signed; needs the code-signing secrets)'
        type: choice
        options: [preview, stable]
        default: preview
      tag:
        description: 'New release tag, e.g. windows-script-v0.19.2-preview.1 or windows-script-v0.19.2'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: windows-script-release
  cancel-in-progress: false
env:
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_TAG: ${{ inputs.tag }}
  TIMESTAMP_SERVER: http://timestamp.digicert.com
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Validate the tag against the channel and the package version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $escaped = [regex]::Escape($version)
          $shape = if ($env:RELEASE_CHANNEL -eq 'preview') { "^windows-script-v$escaped-preview\.\d+$" } else { "^windows-script-v$escaped$" }
          if ($env:RELEASE_TAG -notmatch $shape) { throw "Tag '$env:RELEASE_TAG' does not fit channel $env:RELEASE_CHANNEL for version $version (expected $shape)." }
          $tags = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG")
          if ($LASTEXITCODE -ne 0) { throw 'Tag lookup failed.' }
          if ($tags.Count -gt 0) { throw "Tag $env:RELEASE_TAG already exists; releases are immutable." }
          $releases = @(gh release list --limit 200 --json tagName | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Release listing failed.' }
          if ($releases.tagName -contains $env:RELEASE_TAG) { throw "Release $env:RELEASE_TAG already exists." }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_BASE_URL=https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Import the release signing identity
        if: inputs.channel == 'stable'
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          CHAIN_BASE64: ${{ secrets.WINDOWS_CODESIGN_CHAIN_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:PFX_BASE64 -or -not $env:PFX_PASSWORD) {
            throw 'A stable release needs the WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PFX_PASSWORD secrets (a code-signing certificate with its private key). Publish a preview instead until they exist.'
          }
          if ($env:CHAIN_BASE64) {
            # Optional: an issuing chain the hosted runner does not trust (an internal CA).
            $chain = Join-Path $env:RUNNER_TEMP 'release-signing-chain.p7b'
            [IO.File]::WriteAllBytes($chain, [Convert]::FromBase64String($env:CHAIN_BASE64))
            Import-Certificate -FilePath $chain -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            Remove-Item -LiteralPath $chain -Force
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'release-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $password = ConvertTo-SecureString -String $env:PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $pfx -Force
          if (-not $cert.HasPrivateKey) { throw 'The imported certificate carries no private key.' }
          if ($cert.Subject -match 'TEST ONLY') { throw 'A test identity cannot sign a stable release.' }
          if (-not ($cert.EnhancedKeyUsageList.ObjectId -contains '1.3.6.1.5.5.7.3.3')) { throw 'The certificate is not enabled for code signing.' }
          "AGENT_BIOS_RELEASE_SIGNER=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Create the runner-only test signing identity for qualification
        shell: powershell
        run: |
          & .\packages\windows\test-signing.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the test-signed qualification bundle
        shell: pwsh
        run: |
          python packages/windows/build-script-bundle.py --signer-thumbprint $env:AGENT_BIOS_TEST_SIGNER --output dist/windows-script-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the release bundle pinned to this tag
        shell: pwsh
        run: |
          if ($env:RELEASE_CHANNEL -eq 'preview') {
            python packages/windows/build-script-bundle.py --channel preview --output dist/windows-script-release --public-base-url $env:RELEASE_BASE_URL
          } else {
            python packages/windows/build-script-bundle.py --channel stable --signer-thumbprint $env:AGENT_BIOS_RELEASE_SIGNER --timestamp-server $env:TIMESTAMP_SERVER --output dist/windows-script-release --public-base-url $env:RELEASE_BASE_URL
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify the exact release assets in PowerShell 5.1 and 7
        shell: pwsh
        run: |
          if ($env:RELEASE_CHANNEL -eq 'preview') {
            python packages/windows/script-smoke.py --assets dist/windows-script-test --preview-assets dist/windows-script-release
          } else {
            python packages/windows/script-smoke.py --assets dist/windows-script-release
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the immutable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $arguments = @('release', 'create', $env:RELEASE_TAG, '--target', $env:GITHUB_SHA,
                         '--title', "agent-bios $env:RELEASE_VERSION for Windows ($env:RELEASE_CHANNEL script distribution)",
                         '--notes-file', 'dist/windows-script-release/release-notes.md')
          if ($env:RELEASE_CHANNEL -eq 'preview') { $arguments += '--prerelease' } else { $arguments += '--latest' }
          $arguments += @('dist/windows-script-release/install.ps1', 'dist/windows-script-release/release.json',
                          'dist/windows-script-release/checksums.json', 'dist/windows-script-release/application.zip',
                          'dist/windows-script-release/runtime.zip')
          gh @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify anonymous downloads against the built digests
        shell: pwsh
        run: |
          $expected = Get-Content dist/windows-script-release/checksums.json | ConvertFrom-Json
          $target = Join-Path $env:RUNNER_TEMP 'anonymous-download'
          New-Item -ItemType Directory -Path $target | Out-Null
          foreach ($name in @('install.ps1', 'release.json', 'application.zip', 'runtime.zip')) {
            $path = Join-Path $target $name
            $attempt = 0
            do {
              $attempt++
              curl.exe -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o $path ($env:RELEASE_BASE_URL + $name)
              $downloaded = ($LASTEXITCODE -eq 0)
              if (-not $downloaded) { Start-Sleep -Seconds 15 }
            } while (-not $downloaded -and $attempt -lt 8)
            if (-not $downloaded) { throw "Anonymous download of $name failed after $attempt attempts." }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected.$name) { throw "$name differs after publication: $actual." }
          }
          Write-Host "Published assets match their built digests at $env:RELEASE_BASE_URL"
      - name: Run the published one-line command in Windows PowerShell 5.1
        # The most restrictive supported shell, started directly so it keeps its own
        # module path. -NoLaunch and -InstallRoot are appended: the runner has no model
        # host to log into and its account is ephemeral.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Get-Content -LiteralPath 'dist/windows-script-release/release-notes.md' -Encoding UTF8
          $fence = [array]::IndexOf($notes, '```powershell')
          if ($fence -lt 0) { throw 'The release notes carry no PowerShell command block.' }
          $command = $notes[$fence + 1]
          if ($command -notmatch [regex]::Escape($env:RELEASE_BASE_URL + 'install.ps1')) { throw "The published command does not name this release: $command" }
          $root = Join-Path $env:RUNNER_TEMP 'one-line install'
          Write-Host "Running: $command"
          Invoke-Expression ($command + " -NoLaunch -InstallRoot '" + $root.Replace("'", "''") + "'")
          if ($LASTEXITCODE -ne 0) { throw "The published command failed (exit $LASTEXITCODE)." }
          $resolved = Get-Command agent-bios -ErrorAction Stop
          if ($resolved.Source -ine (Join-Path $root 'bin\agent-bios.ps1')) { throw "agent-bios resolved to $($resolved.Source)" }
          # -NoLaunch leaves configuration pending; the private install record comes from install.
          $ErrorActionPreference = 'Continue'
          $configured = & $resolved.Source install --non-interactive
          if ($LASTEXITCODE -ne 0) { throw "agent-bios install failed (exit $LASTEXITCODE): $configured" }
          $verify = & $resolved.Source verify
          if ($LASTEXITCODE -ne 0) { throw "agent-bios verify failed (exit $LASTEXITCODE): $verify" }
          & $resolved.Source uninstall
          if ($LASTEXITCODE -ne 0) { throw "agent-bios uninstall failed (exit $LASTEXITCODE)." }
          Write-Host 'The published one-line command installed, configured, verified and uninstalled.'
      - name: Verify the documented stable command resolves to this release
        if: inputs.channel == 'stable'
        shell: pwsh
        run: |
          $documented = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1"
          $path = Join-Path $env:RUNNER_TEMP 'latest-install.ps1'
          curl.exe -fsSL --proto '=https' --proto-redir '=https' --retry 3 -o $path $documented
          if ($LASTEXITCODE -ne 0) { throw "The documented latest-release command cannot download $documented." }
          $expected = (Get-Content dist/windows-script-release/checksums.json | ConvertFrom-Json).'install.ps1'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'The latest-release bootstrap is not the one this run published.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-bios-windows-x64-script-${{ inputs.channel }}-${{ inputs.tag }}
          path: |
            dist/windows-script-release/install.ps1
            dist/windows-script-release/release.json
            dist/windows-script-release/checksums.json
            dist/windows-script-release/release-notes.md
            dist/windows-script-test/script-smoke-result.json
            dist/windows-script-release/script-smoke-result.json
