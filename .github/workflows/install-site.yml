name: Installation address
on:
  workflow_dispatch:
  push:
    branches: [main, feat/windows-native]
    paths:
      - '.github/workflows/install-site.yml'
      - 'packages/windows/build-install-site.py'
      - 'packages/windows/install-site.json'
      - 'packages/posix/install.sh'
permissions:
  contents: read
concurrency:
  group: github-pages-install-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the pinned public bootstrap and build the distribution site
        run: python packages/windows/build-install-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/install-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the fixed installation address
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = (Get-Content package.json | ConvertFrom-Json).repository.url -replace '^git\+', '' -replace '\.git$', ''
          $parts = ([uri]$repository).AbsolutePath.Trim('/').Split('/')
          $url = "https://$($parts[0].ToLowerInvariant()).github.io/$($parts[1])/install.ps1"
          $expected = (Get-Content packages/windows/install-site.json | ConvertFrom-Json).bootstrap_sha256
          $path = Join-Path $env:RUNNER_TEMP 'published-install.ps1'
          $matched = $false
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            try {
              Invoke-WebRequest $url -UseBasicParsing -OutFile $path -ErrorAction Stop
              $matched = ((Get-FileHash $path -Algorithm SHA256).Hash -ieq $expected)
            } catch { Write-Host "Waiting for the public deployment: $($_.Exception.Message)" }
            if ($matched) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $matched) { throw 'Public bootstrap differs from the promoted release.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Host "Anonymous download and PowerShell 5.1 parsing passed: $url"
      - name: Run the published command the way a user pastes it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Parsing the downloaded script cannot see this failure, and neither can
          # any check on the command string: pasted into PowerShell, the published
          # command sits inside THAT shell's quotes and is expanded before the child
          # starts. A reported install died here with `= Join-Path C:\...` after the
          # pasting shell consumed a $p the command meant for the child. The only
          # check that sees it is running the command from a PowerShell prompt.
          $command = python packages/windows/publish-install-command.py
          if ($LASTEXITCODE -ne 0) { throw 'could not derive the published command' }
          Write-Host $command
          $root = Join-Path $env:RUNNER_TEMP 'pasted-install'
          # -NoLaunch keeps the installed CLI from opening its interactive chooser on
          # a runner with no terminal; everything before it is the published command.
          Invoke-Expression ($command + " -NoLaunch -InstallRoot '$root'")
          if (-not (Test-Path -LiteralPath (Join-Path $root 'bin/agent-bios.cmd'))) {
            throw 'the pasted command did not install the commands'
          }
          Write-Host 'The published command runs from a PowerShell prompt.'
  verify-posix:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the public macOS and Linux script
        run: |
          set -euo pipefail
          # The expected bytes are derived from this checkout, so a published script
          # that drifted from the promoted pin fails rather than being described.
          python - <<'PY' > expected.env
          import hashlib, json, importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("site", "packages/windows/build-install-site.py")
          site = importlib.util.module_from_spec(spec); spec.loader.exec_module(site)
          repository = json.loads(pathlib.Path("package.json").read_text())["repository"]["url"]
          owner, name = repository.removeprefix("git+").removesuffix(".git").split("/")[-2:]
          print("URL=https://%s.github.io/%s/install.sh" % (owner.lower(), name))
          print("DIGEST=" + hashlib.sha256(site.posix_bootstrap()).hexdigest())
          PY
          . ./expected.env
          for attempt in $(seq 1 12); do
            if curl -fsSL --proto '=https' --proto-redir '=https' -o published.sh "$URL"; then
              if [ "$(sha256sum published.sh | cut -d' ' -f1)" = "$DIGEST" ]; then matched=1; break; fi
            fi
            echo "Waiting for the public deployment (attempt $attempt)"
            sleep 10
          done
          [ "${matched:-0}" = 1 ] || { echo 'Public POSIX bootstrap differs from this checkout.' >&2; exit 1; }
          bash -n published.sh
          # A refusal path must refuse. The probe PATH carries what the script needs
          # to reach its npm check and nothing more; emptying PATH outright would
          # hide npm behind a missing uname and refuse for the wrong reason.
          probe=$(mktemp -d)
          ln -s "$(command -v uname)" "$probe/uname"
          ln -s "$(command -v python3)" "$probe/python3"
          set +e
          out=$(PATH="$probe" /bin/bash published.sh 2>&1); code=$?
          set -e
          [ "$code" -ne 0 ] || { echo 'The bootstrap continued without npm.' >&2; exit 1; }
          case "$out" in *npm*) ;; *) echo "Unexpected refusal: $out" >&2; exit 1 ;; esac
          echo "Anonymous download, syntax and refusal path passed: $URL"
