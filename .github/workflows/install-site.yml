name: Windows installation address
on:
  workflow_dispatch:
  push:
    branches: [main, feat/windows-native]
    paths:
      - '.github/workflows/install-site.yml'
      - 'packages/windows/build-install-site.py'
      - 'packages/windows/install-site.json'
permissions:
  contents: read
concurrency:
  group: github-pages-install-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the pinned public bootstrap and build the distribution site
        run: python packages/windows/build-install-site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/install-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the fixed installation address
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify the public script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $repository = (Get-Content package.json | ConvertFrom-Json).repository.url -replace '^git\+', '' -replace '\.git$', ''
          $parts = ([uri]$repository).AbsolutePath.Trim('/').Split('/')
          $url = "https://$($parts[0].ToLowerInvariant()).github.io/$($parts[1])/install.ps1"
          $expected = (Get-Content packages/windows/install-site.json | ConvertFrom-Json).bootstrap_sha256
          $path = Join-Path $env:RUNNER_TEMP 'published-install.ps1'
          $matched = $false
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            try {
              Invoke-WebRequest $url -UseBasicParsing -OutFile $path -ErrorAction Stop
              $matched = ((Get-FileHash $path -Algorithm SHA256).Hash -ieq $expected)
            } catch { Write-Host "Waiting for the public deployment: $($_.Exception.Message)" }
            if ($matched) { break }
            Start-Sleep -Seconds 10
          }
          if (-not $matched) { throw 'Public bootstrap differs from the promoted release.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          Write-Host "Anonymous download and PowerShell 5.1 parsing passed: $url"
