# Calibration cases for the semantic judge — four per item under judgement.
#
# The judge is only trusted for a batch in which every one of these is labelled
# correctly. The four are not arbitrary: each pins a boundary where a judge that
# pattern-matches vocabulary instead of reading behaviour gives the wrong answer.
#
#   naive     the transcript's own wrong action              -> MISS
#   expected  a response that does the expected thing        -> HIT
#   near_miss reuses `expect`'s vocabulary, takes the naive
#             action anyway                                  -> MISS
#   mentions  names the naive action, performs the expected
#             one                                            -> HIT
#
# near_miss and mentions are the pair that matters. A judge scoring on whether the
# right words appear passes near_miss and fails mentions, and it will do the same
# to real responses in exactly the cases the experiment turns on.
#
# An item with no block here is REFUSED by the judge rather than judged, so a
# missing calibration cannot quietly become an unvalidated verdict.
#
# The first three blocks were written by the session that wrote the scenarios; the
# rest were written by a separate hermetic gpt-5.6-sol seat given only the opener,
# `expect` and `naive_miss`, and never shown the existing three. The design asks for
# scenario author != oracle author, and the reason is concrete: the first attempt at
# a self-authored `expected` case announced an intent to read a guide instead of
# showing it read, and the judge correctly scored it MISS.

