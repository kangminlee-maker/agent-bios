<style>

x;flex-direction:column}#team-lifecycle-studio .tl-nav button{background:transparent;border:0;text-align:left;border-radius:6px;padding:9px;color:var(--tl-muted)}#team-lifecycle-studio .tl-nav button[aria-current=page]{background:var(--tl-tint);color:var(--tl-green);font-weight:600}#team-lifecycle-studio .tl-sidebar-note{padding:24px 9px 0;font-size:12px;color:var(--tl-muted)}#team-lifecycle-studio .tl-workspace{min-width:0}#team-lifecycle-studio header{padding:15px var(--tl-pad);border-bottom:1px solid var(--tl-line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--tl-muted)}#team-lifecycle-studio main{padding:var(--tl-pad);min-width:0}#team-lifecycle-studio .tl-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}#team-lifecycle-studio .tl-kicker{font-size:11px;letter-spacing:1px;color:var(--tl-muted);margin-bottom:6px}#team-lifecycle-studio .tl-sub{color:var(--tl-muted);margin-top:8px}#team-lifecycle-studio .tl-small{font-size:12px;color:var(--tl-muted)}#team-lifecycle-studio .tl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#team-lifecycle-studio .tl-button{background:var(--tl-bg);border:1px solid var(--tl-line);padding:7px 12px;border-radius:6px;font-weight:500;text-align:center}#team-lifecycle-studio .tl-primary{background:var(--tl-green);color:var(--tl-on);border-color:var(--tl-green)}#team-lifecycle-studio .tl-danger{color:var(--tl-red)}#team-lifecycle-studio .tl-link{background:transparent;border:0;padding:4px 0;color:var(--tl-green);text-align:left}#team-lifecycle-studio .tl-pill{display:inline-block;background:var(--tl-soft);border-radius:4px;font-size:11px;padding:2px 7px;color:var(--tl-muted)}#team-lifecycle-studio .tl-note{background:var(--tl-tint);color:var(--tl-green);padding:12px 14px;border-radius:7px;margin:16px 0}#team-lifecycle-studio .tl-warning{background:var(--tl-alert);color:var(--tl-warn)}#team-lifecycle-studio .tl-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--tl-line)}#team-lifecycle-studio .tl-row strong{font-weight:500}#team-lifecycle-studio .tl-row small{display:block;font-size:12px;color:var(--tl-muted);margin-top:3px}#team-lifecycle-studio .tl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}#team-lifecycle-studio .tl-field{display:block;margin:17px 0}#team-lifecycle-studio .tl-field>span{display:block;font-weight:500;margin-bottom:6px}#team-lifecycle-studio .tl-field input:not([type=radio]):not([type=checkbox]),#team-lifecycle-studio .tl-field select{width:100%}#team-lifecycle-studio .tl-choice{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--tl-line);border-radius:7px;margin:9px 0;cursor:pointer}#team-lifecycle-studio .tl-choice:has(input:checked){border-color:var(--tl-green);background:var(--tl-tint)}#team-lifecycle-studio .tl-choice strong{display:block;font-weight:500}#team-lifecycle-studio .tl-facts{display:grid;grid-template-columns:103px minmax(0,1fr);gap:9px 12px;font-size:13px;margin:18px 0}#team-lifecycle-studio dt{color:var(--tl-muted)}#team-lifecycle-studio dd{margin:0}#team-lifecycle-studio .tl-section{margin-top:26px}#team-lifecycle-studio .tl-sectionhead{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}#team-lifecycle-studio .tl-bottom{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;border-top:1px solid var(--tl-line);padding-top:18px;margin-top:24px}#team-lifecycle-studio .tl-steps{display:flex;flex-wrap:wrap;gap:9px 18px;list-style:none;padding:0;margin:0 0 24px;color:var(--tl-muted);font-size:12px}#team-lifecycle-studio .tl-steps li[aria-current=step]{color:var(--tl-green);font-weight:600}#team-lifecycle-studio .tl-tabs{display:flex;flex-wrap:wrap;gap:5px;border-bottom:1px solid var(--tl-line);padding-bottom:12px;margin:18px 0 22px}#team-lifecycle-studio .tl-tabs button{border:0;border-radius:5px;padding:7px 10px;background:transparent;color:var(--tl-muted)}#team-lifecycle-studio .tl-tabs button[aria-pressed=true]{background:var(--tl-tint);color:var(--tl-green);font-weight:600}#team-lifecycle-studio .tl-listitem{display:block;width:100%;background:var(--tl-bg);border:1px solid var(--tl-line);border-radius:8px;padding:18px;text-align:left;margin:10px 0}#team-lifecycle-studio .tl-listitem .tl-row{border:0;padding:0}#team-lifecycle-studio .tl-listitem strong{font-size:16px;font-weight:600}#team-lifecycle-studio .tl-error{color:var(--tl-red);background:var(--tl-alert);padding:10px 13px;border-radius:6px;margin:16px 0}#team-lifecycle-studio .tl-requestlist{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}#team-lifecycle-studio .tl-requestlist button{background:var(--tl-bg);border:1px solid var(--tl-line);border-radius:5px;padding:8px;font-size:12px}#team-lifecycle-studio .tl-requestlist button[aria-pressed=true]{background:var(--tl-tint);border-color:var(--tl-green)}#team-lifecycle-studio details{border-top:1px solid var(--tl-line);padding-top:13px;margin-top:16px}#team-lifecycle-studio summary{cursor:pointer;color:var(--tl-green);font-weight:500}#team-lifecycle-studio details p{margin-top:8px}#team-lifecycle-studio footer{padding:12px var(--tl-pad);border-top:1px solid var(--tl-line);font-size:12px;color:var(--tl-muted)}#team-lifecycle-studio [data-layout=top] .tl-shell{grid-template-columns:1fr}#team-lifecycle-studio [data-layout=top] aside{border-right:0;border-bottom:1px solid var(--tl-line);padding:12px var(--tl-pad);border-radius:0}#team-lifecycle-studio [data-layout=top] .tl-brand{padding:0 0 10px}#team-lifecycle-studio [data-layout=top] .tl-nav{flex-direction:row;flex-wrap:wrap}#team-lifecycle-studio [data-layout=top] .tl-sidebar-note{display:none}
@media(max-width:800px){#team-lifecycle-studio .tl-shell{grid-template-columns:1fr}#team-lifecycle-studio aside{padding:12px 16px;border-right:0;border-bottom:1px solid var(--tl-line);border-radius:0}#team-lifecycle-studio .tl-brand{padding:0 0 9px}#team-lifecycle-studio .tl-nav{flex-direction:row;flex-wrap:wrap}#team-lifecycle-studio .tl-nav button{font-size:12px;padding:7px 9px}#team-lifecycle-studio .tl-sidebar-note{display:none}}
@media(max-width:550px){#team-lifecycle-studio{--tl-pad:16px!important}#team-lifecycle-studio .tl-grid{grid-template-columns:1fr;gap:0}#team-lifecycle-studio .tl-facts{grid-template-columns:83px minmax(0,1fr)}#team-lifecycle-studio .tl-harness label{width:100%}#team-lifecycle-studio .tl-field input,#team-lifecycle-studio .tl-field select,#team-lifecycle-studio textarea{font-size:16px}#team-lifecycle-studio h1{font-size:23px}}
@media(pointer:coarse){#team-lifecycle-studio button,#team-lifecycle-studio select,#team-lifecycle-studio summary{min-height:44px}}
</style>
<script>
(() => {
const root=document.getElementById('team-lifecycle-studio');
const design={layout:'side',density:'comfortable'};
const persons={minji:'민지',jiwon:'지원',haemin:'해민',dahyun:'다현'};
const stateLabel={setup:'초기 설정 중',active:'운영 중',archived:'보관 중',closed:'영구 종료'};
const tabs={overview:'개요',members:'구성원·기기',settings:'설정',requests:'변경 요청',lifecycle:'종료·로컬 관리'};
const titles={metadata:'팀 기본 정보 변경',connection:'동기화 설정 변경',policy:'운영 정책 변경',invite:'구성원 등록',roles:'구성원 권한 변경',transfer:'소유권·확정 담당 이전',archive:'팀 보관',restore:'팀 복원',close:'팀 영구 종료'};
let s;
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(text,action,primary=false,extra='')=>`<button type="button" class="tl-button${primary?' tl-primary':''}" data-action="${action}" ${extra}>${text}</button>`;
const L=(text,action,extra='')=>`<button type="button" class="tl-link" data-action="${action}" ${extra}>${text}</button>`;
const pill=text=>`<span class="tl-pill">${text}</span>`;
const field=(label,key,value,type='input',extra='')=>`<label class="tl-field"><span>${label}</span>${type==='textarea'?`<textarea data-field="${key}" ${extra}>${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}" ${extra}>`}</label>`;
const select=(label,key,items,value,extra='')=>`<label class="tl-field"><span>${label}</span><select data-field="${key}" ${extra}>${items.map(([v,n])=>`<option value="${v}" ${String(value)===String(v)?'selected':''}>${n}</option>`).join('')}</select></label>`;
const chooser=(key,value,selected,title,desc,disabled=false)=>`<label class="tl-choice"><input type="radio" name="${key}" data-field="${key}" value="${value}" ${selected===value?'checked':''} ${disabled?'disabled':''}><span><strong>${title}</strong><span class="tl-small">${desc}</span></span></label>`;
function fixture(id,name,status){return {id,name,description:'팀의 기준과 결정 맥락을 함께 관리합니다.',status,rev:1,owner:'minji',finalizer:'minji',custodian:'haemin',members:['minji','jiwon','haemin'],reviewers:['jiwon','haemin'],roles:{minji:'member',jiwon:'reviewer',haemin:'reviewer'},profile:'shared',route:'github',network:'normal',maxDays:'',repo:'가상 전용 저장소',connected:true,remoteRetained:[],peers:['minji','jiwon','haemin'],envs:1,nominee:'',foundationAccepted:false,foundationVersion:1,requests:[],log:[],purged:[],setupCanceled:false};}
function reset(){s={actor:'minji',view:'list',selected:'T-product',tab:'overview',filter:'current',query:'',mode:'normal',teams:[fixture('T-product','제품 개발팀','active'),fixture('T-lab','실험팀','archived')],hidden:{},requests:[],requestId:null,nextId:1,message:'팀을 열어 관리하거나, 팀 만들기에서 새 흐름을 시작하세요.',error:'',w:null,edit:null,inviteTarget:'dahyun',roleTarget:'jiwon',roleValue:'reviewer',transferTarget:'jiwon',transferFinalizer:true,confirmName:'',reason:'팀 운영 계획에 따른 변경입니다.',unknown:null};render();}
const team=()=>s.teams.find(t=>t.id===s.selected);
const member=t=>t.members.includes(s.actor);
const owner=t=>t.owner===s.actor&&t.status!=='closed';
const management=t=>owner(t)&&t.status==='active';
const hidden=t=>(s.hidden[s.actor]||[]).includes(t.id);
function canRead(t){return t.members.includes(s.actor)||t.owner===s.actor;}
function log(t,text){t.log.unshift({actor:persons[s.actor],text});s.message=text;}
function openTeam(id,tab='overview'){const t=s.teams.find(x=>x.id===id);if(!t||!canRead(t)){s.error='이 팀의 상세 내용을 읽을 권한이 없습니다.';return;}s.selected=id;s.view=hidden(t)?'localRestore':'detail';s.tab=tab;s.error='';s.edit=null;s.nominee=t.nominee;}
function startWizard(){s.w={name:'',description:'',founder:s.actor,step:0,route:'github',network:'normal',repo:'',connected:false,defer:false,maxDays:'',profile:'shared',nominee:s.actor==='jiwon'?'haemin':'jiwon',created:null};s.view='wizard';s.error='';}
function head(kicker,title,sub,action=''){return `<div class="tl-head"><div><div class="tl-kicker">${kicker}</div><h1>${title}</h1><p class="tl-sub">${sub}</p></div>${action}</div>`;}
function nextValid(){const w=s.w;if(w.step===0&&!w.name.trim())return '팀 이름을 입력해 주세요.';if(w.step===1){if(w.network==='weekly'&&(!/^\d+$/.test(w.maxDays)||Number(w.maxDays)<1||Number(w.maxDays)>365))return '간헐 연결 시 계획할 최대 단절 기간을 1~365일로 입력해 주세요.';if(w.route==='github'&&!w.connected&&!w.defer)return 'GitHub 연결을 확인하거나 나중에 연결을 선택해 주세요.';}return '';}
function wizard(){const w=s.w;const steps=['팀 정보','저장·연결','책임·승인','확인·생성'];let html=head('CREATE TEAM','팀 만들기','팀 설정을 먼저 정하고, 업무환경은 생성 후 별도로 구성합니다.',L('목록으로','list'))+`<ol class="tl-steps">${steps.map((x,i)=>`<li ${w.step===i?'aria-current="step"':''}>${i<w.step?'✓':i+1} ${x}</li>`).join('')}</ol>`;
 if(w.step===0)html+=`<h2>어떤 팀인가요?</h2>${field('팀 이름','w.name',w.name,'input','placeholder="예: 제품 개발팀" maxlength="60"')}${field('팀 설명 · 선택','w.description',w.description,'textarea','placeholder="팀이 함께 수행할 업무를 적어 주세요."')}<dl class="tl-facts"><dt>초기 책임자</dt><dd>${persons[w.founder]} · 본인 확인이 완료된 가상 계정</dd><dt>팀 식별자</dt><dd>생성 시 부여 · 이름이나 GitHub 주소를 바꿔도 유지</dd></dl>`;
 if(w.step===1)html+=`<h2>어떻게 보관하고 연결할까요?</h2><div class="tl-note">기본은 P2P 분산 보관입니다. GitHub를 함께 쓰면 공유 상태 보관과 교환이 편해집니다.</div>${select('작업 연결 환경','w.network',[['normal','일반적인 인터넷 연결'],['weekly','주 1~2회 자료 교환'],['closed','폐쇄망 · 외부 저장 금지']],w.network)}${w.network==='weekly'?field('계획할 최대 단절 기간 · 일','w.maxDays',w.maxDays,'input','inputmode="numeric" placeholder="팀이 정한 기간 입력"')+'<p class="tl-small">계획 상한이며 실제 자료의 권한·유효기간을 늘리지는 않습니다.</p>':''}${chooser('w.route','github',w.route,'GitHub 연결 (추천)','P2P와 함께 사용할 선택 동기화 경로',w.network==='closed')}${chooser('w.route','p2p',w.route,'P2P만 사용','GitHub 계정 없이 생성 · 나중에 연결 가능')}${w.network==='closed'?'<p class="tl-small">선택한 외부 저장 금지 정책에 따라 P2P를 사용합니다.</p>':''}${w.route==='github'?`${select('대상 저장소 · 가상','w.repo',[['','저장소 선택'],['가상 전용 저장소','가상 전용 저장소'],['다른 팀 사용 중','다른 팀 사용 중인 저장소']],w.repo)}<div class="tl-actions">${B(w.connected?'연결 확인됨 · 가상':'연결 확인 · 가상','connect',false,w.connected?'disabled':'')}${B('나중에 연결','defer')}</div><p class="tl-small" style="margin-top:8px">${w.connected?'연결만 확인했습니다. 팀 자료 업로드는 하지 않았습니다.':w.defer?'GitHub 연결은 대기 상태로 남기고 계속합니다.':'추천 선택만으로 연결하거나 자료를 올리지 않습니다.'}</p>`:''}`;
 if(w.step===2)html+=`<h2>처음의 책임과 승인 방식을 정합니다</h2>${chooser('w.profile','shared',w.profile,'함께 검토 (추천)','공유 변경은 독립된 사람의 검토 후 확정')}${chooser('w.profile','solo',w.profile,'혼자 운영','초기 책임자가 직접 결정 · 독립 승인으로 표시하지 않음')}<dl class="tl-facts"><dt>소유·권한 관리</dt><dd>${persons[w.founder]}</dd><dt>확정 담당</dt><dd>${persons[w.founder]}의 가상 기기 · 한 팀 기준에 하나의 확정 역할</dd></dl>${w.profile==='shared'?`${select('초기 검토·복구 책임자 후보','w.nominee',[['','나중에 지정'],...Object.entries(persons).filter(([id])=>id!==w.founder&&id!=='dahyun')],w.nominee)}<div class="tl-note tl-warning">후보는 아직 구성원이 아닙니다. 상대가 초기 구성에 동의하고 확정 담당자가 완료해야 공유 운영을 시작할 수 있습니다.</div>`:'<div class="tl-note">1인 운영으로 생성합니다. 이후 공동 검토로 바꾸는 것은 정책 변경입니다.</div>'}`;
 if(w.step===3)html+=`<h2>이 설정으로 팀을 만듭니다</h2><dl class="tl-facts"><dt>팀 이름</dt><dd>${esc(w.name)}</dd><dt>초기 책임자</dt><dd>${persons[w.founder]}</dd><dt>기본 보관</dt><dd>P2P · 첫 가상 기기 1곳 확인 · 보관 목표 3곳</dd><dt>GitHub</dt><dd>${w.route==='p2p'?'사용하지 않음':w.connected?esc(w.repo)+' · 연결 확인됨':'나중에 연결 · 대기'}</dd><dt>연결 환경</dt><dd>${w.network==='closed'?'폐쇄망':w.network==='weekly'?'주 1~2회 교환 · 계획 상한 '+esc(w.maxDays)+'일':'일반 연결'}</dd><dt>운영 정책</dt><dd>${w.profile==='shared'?'공동 검토 · 초기 구성 확인 필요':'1인 운영 · 직접 결정'}</dd><dt>후보</dt><dd>${w.profile==='shared'?(persons[w.nominee]||'나중에 지정'):'없음'}</dd><dt>업무환경</dt><dd>아직 없음 · 생성 후 별도 구성</dd></dl><div class="tl-note">팀 생성은 업무환경 채택이나 작업 시작과 다릅니다. 이 목업은 실제 계정·저장소·초대를 만들지 않습니다.</div>`;
 return html+`<div class="tl-bottom">${w.step?B('이전','wizard-back'):L('작성 취소','cancel-wizard')}<div class="tl-actions">${w.step<3?B('다음','wizard-next',true):B('가상 팀 생성','create',true)}</div></div>`;}
function list(){const visible=s.teams.filter(t=>canRead(t)&&(s.filter==='forgotten'?hidden(t):!hidden(t))).filter(t=>s.filter==='all'||s.filter==='forgotten'||s.filter==='current'?s.filter!=='current'||['active','setup'].includes(t.status):t.status===s.filter).filter(t=>(t.name+' '+t.id).toLowerCase().includes(s.query.toLowerCase()));return head('TEAMS','내 팀','팀의 상태를 확인하고, 같은 기준으로 다음 작업을 이어갑니다.',B('팀 만들기','new',true))+`<div class="tl-grid">${field('팀 찾기','query',s.query,'input','placeholder="이름 또는 팀 ID"')}${select('표시할 팀','filter',[['current','운영·설정 중'],['archived','보관 중'],['closed','영구 종료'],['all','모든 팀'],['forgotten','이 기기에서 제거한 팀']],s.filter)}</div>${visible.map(t=>`<button type="button" class="tl-listitem" data-action="open" data-id="${t.id}"><span class="tl-row"><strong>${esc(t.name)}</strong>${pill(stateLabel[t.status])}</span><span class="tl-small">${t.id} · 설정 ${t.rev}판 · ${t.route==='github'?(t.status==='closed'?'GitHub 연결 중지':t.connected?'GitHub 연결':'GitHub 대기'):'P2P만 사용'}</span><span class="tl-small" style="display:block;margin-top:8px">${t.status==='setup'?'초기 승인 체계 확인 필요':t.status==='closed'?'팀 ID 종료 · 허용된 종료 기록 조회':`구성원 ${t.members.length}명 · 업무환경 ${t.envs}개 · 보관 확인 ${t.peers.length}곳`}</span></button>`).join('')||'<div class="tl-note">이 조건으로 볼 수 있는 팀이 없습니다.</div>'}`;}
function invitations(){const invitations=s.teams.flatMap(t=>{let found=[];if(t.status==='setup'&&t.nominee===s.actor)found.push({t,foundation:true});for(const r of s.requests.filter(r=>r.team===t.id&&r.type==='invite'&&r.payload.target===s.actor&&!['committed','withdrawn','rejected'].includes(r.state)))found.push({t,r});return found;});return head('JOIN TEAM','초대받은 팀','기존 팀의 식별자와 권한을 확인하고 참여합니다.')+invitations.map(({t,r,foundation})=>`<section class="tl-listitem"><div class="tl-sectionhead"><h2>${esc(t.name)}</h2>${pill(foundation?'초기 구성 참여':'구성원 초대')}</div><p class="tl-small">${t.id} · 초대 대상 ${persons[s.actor]} · 가상 신원 확인</p>${foundation?foundationSummary(t):''}<p style="margin-top:12px">${foundation?'제안된 초기 정책과 검토·복구 책임자 역할에 동의합니다.':'제안된 일반 구성원 역할에 동의합니다. 팀 원본의 개별 권한은 별도입니다.'}</p><div class="tl-bottom"><span class="tl-small">동의만으로 구성원 등록이 확정되지는 않습니다.</span>${B((foundation?t.foundationAccepted:r.consent)?'동의 전달 대기':foundation?'초기 구성에 동의':'참여에 동의','consent-invite',true,`data-id="${t.id}" data-request="${r?.id||''}" data-foundation="${t.foundationVersion}" ${(foundation?t.foundationAccepted:r.consent)?'disabled':''}`)}</div></section>`).join('')+(invitations.length?'':'<div class="tl-note">이 가상 계정에 도착한 초대가 없습니다.</div>');}
function overview(t){return `<div class="tl-grid"><section><h2>팀 운영 상태</h2><dl class="tl-facts"><dt>승인 체계</dt><dd>${t.status==='setup'?'초기 구성 확정 전':t.status==='closed'?'종료됨':t.profile==='solo'?'1인 운영':'공동 검토'}</dd><dt>소유자</dt><dd>${persons[t.owner]}</dd><dt>확정 담당</dt><dd>${persons[t.finalizer]}의 가상 기기</dd><dt>복구 책임자</dt><dd>${persons[t.custodian]||'확정 전'}</dd><dt>업무환경</dt><dd>${t.envs}개${t.envs===0?' · 별도 구성 필요':''}</dd></dl></section><section><h2>자료 보관과 연결</h2><dl class="tl-facts"><dt>기본 구조</dt><dd>P2P · 허용된 팀 자료를 함께 보관</dd><dt>보관 확인</dt><dd>${t.peers.length}곳 / 목표 3곳${t.envs===0?' · 팀 제어 기록 기준':''}</dd><dt>GitHub</dt><dd>${t.route==='github'?(t.status==='closed'?'연결 중지 · 원격 저장소 보존':t.connected?esc(t.repo)+' · 연결':'연결 대기'):'사용하지 않음'}</dd><dt>설정 판</dt><dd>${t.rev}판 · ${t.id}</dd></dl></section></div>${t.status==='setup'?`<div class="tl-note tl-warning">팀은 생성되었고, 초기 승인 체계는 아직 준비 중입니다.</div>${owner(t)?`<div class="tl-section">${select('초기 후보','nominee',[['','후보 선택'],...Object.entries(persons).filter(([id])=>id!==t.owner&&id!=='dahyun')],s.nominee||t.nominee)}${B('후보로 초기 구성 갱신','update-nominee')}<p class="tl-small">수정하면 이전 후보의 동의가 무효가 됩니다.</p></div>`:''}<div class="tl-bottom"><span class="tl-small">${persons[t.nominee]||'후보 미지정'}: ${t.foundationAccepted?'초기 구성 동의함':'동의 대기'}</span>${B('초기 구성 확정','finalize-foundation',true,owner(t)&&t.foundationAccepted?'':'disabled')}</div>`:''}${t.status==='active'&&t.envs===0?'<div class="tl-note">팀 운영 준비가 되었습니다. 첫 업무환경을 만들거나 선택하는 흐름은 별도 Studio 설계에 연결됩니다. 아직 채택된 환경이나 실행 중인 작업은 없습니다.</div>':''}${t.status==='archived'?'<div class="tl-note tl-warning">보관 중입니다. 새 팀 작업·일반 변경은 멈추며, 복원·종료·필요한 권한 복구는 가능합니다.</div>':''}${t.status==='closed'?'<div class="tl-note tl-warning">이 팀 ID는 영구 종료되었습니다. 과거 사본이나 같은 이름의 저장소로 다시 활성화되지 않습니다.</div>':''}<details><summary>팀 변경 기록</summary>${t.log.map(x=>`<p>${esc(x.actor)} · ${esc(x.text)}</p>`).join('')||'<p>가상 초기 상태입니다.</p>'}</details>`;}
function ensureEdit(t){if(!s.edit||s.edit.team!==t.id)s.edit={team:t.id,name:t.name,description:t.description,route:t.route,repo:t.repo,network:t.network,profile:t.profile,maxDays:t.maxDays};}
function settings(t){ensureEdit(t);const e=s.edit,disabled=!management(t);return `<h2>기본 정보</h2>${field('팀 이름','edit.name',e.name,'input',disabled?'disabled':'maxlength="60"')}${field('설명','edit.description',e.description,'textarea',disabled?'disabled':'')}<div class="tl-actions">${B('기본 정보 변경 검토','review-metadata',true,disabled?'disabled':'')}<span class="tl-small">이름을 바꿔도 팀 ID는 같습니다. 기본 정보 변경에는 별도 승인 요구가 없습니다.</span></div><section class="tl-section"><h2>동기화 기본 설정</h2>${select('기본 연결','edit.route',[['github','GitHub 연결 (추천)'],['p2p','P2P만 사용']],e.route,disabled?'disabled':'')}${e.route==='github'?field('가상 저장소 이름','edit.repo',e.repo,'input',disabled?'disabled':''):''}${select('연결 환경','edit.network',[['normal','일반 연결'],['weekly','주 1~2회 자료 교환'],['closed','폐쇄망 · 외부 저장 금지']],e.network,disabled?'disabled':'')}${e.network==='weekly'?field('계획할 최대 단절 기간 · 일','edit.maxDays',e.maxDays,'input',disabled?'disabled':'inputmode="numeric"'):''}<div class="tl-note">연결 분리는 원격 저장소 삭제가 아닙니다. 기존 복제본과 P2P 운영은 유지합니다.</div>${B('연결 설정 변경 요청','request-connection',true,disabled?'disabled':'')}</section><section class="tl-section"><h2>운영 정책</h2>${select('승인 방식','edit.profile',[['shared','독립된 사람의 검토 후 확정'],['solo','1인 운영 · 직접 결정']],e.profile,disabled?'disabled':'')}<p class="tl-small">현재 정책으로 이 변경을 검토합니다. 초기 생성 모드로 돌아가지 않습니다.</p>${B('운영 정책 변경 요청','request-policy',false,disabled?'disabled':'')}</section>`;}
function members(t){const write=owner(t)&&['active','archived'].includes(t.status);return `<h2>구성원</h2>${t.members.map(id=>`<div class="tl-row"><div><strong>${persons[id]}</strong><small>${t.owner===id?'소유자 · ':''}${t.finalizer===id?'확정 담당 · ':''}${t.reviewers.includes(id)?'검토자':'일반 구성원'}${t.custodian===id?' · 복구 책임자':''}</small></div>${pill(id===s.actor?'현재 계정':'등록됨')}</div>`).join('')}<section class="tl-section"><h2>구성원 초대</h2>${select('초대할 가상 계정','inviteTarget',Object.entries(persons).filter(([id])=>!t.members.includes(id)),s.inviteTarget,write?'':'disabled')}<p class="tl-small">초대 자료만 생성합니다. 실제 메시지는 보내지 않습니다. 본인 동의와 필요한 승인 후 등록됩니다.</p>${B('초대 요청 만들기','request-invite',true,write&&Object.keys(persons).some(id=>!t.members.includes(id))?'':'disabled')}</section><section class="tl-section"><h2>구성원 권한</h2><div class="tl-grid">${select('대상 구성원','roleTarget',t.members.filter(id=>id!==t.owner).map(id=>[id,persons[id]]),s.roleTarget,write?'':'disabled')}${select('역할','roleValue',[['member','일반 구성원'],['reviewer','변경 검토자']],s.roleValue,write?'':'disabled')}</div>${B('권한 변경 요청','request-roles',false,write?'':'disabled')}<p class="tl-small">마지막 필수 검토·복구 책임자는 대체 없이 제거할 수 없습니다.</p></section><section class="tl-section"><h2>소유권과 확정 담당</h2>${select('인수할 구성원','transferTarget',t.members.filter(id=>id!==t.owner).map(id=>[id,persons[id]]),s.transferTarget,write?'':'disabled')}<label class="tl-choice"><input type="checkbox" data-field="transferFinalizer" ${s.transferFinalizer?'checked':''} ${write?'':'disabled'}><span><strong>확정 담당 기기도 함께 이전</strong><span class="tl-small">인수 준비 확인과 기존 발급자 차단을 별도로 검증해야 합니다.</span></span></label>${B('소유권 이전 요청','request-transfer',false,write?'':'disabled')}</section><section class="tl-section"><h2>이 기기의 보관</h2><p>팀 제어 기록 보관 확인 ${t.peers.length}곳 · 목표 3곳</p>${B(t.peers.includes(s.actor)?'이 기기 보관 확인됨':'이 기기에 팀 기록 받기 · 가상','enroll-device',false,!t.peers.includes(s.actor)&&member(t)&&t.status!=='closed'?'':'disabled')}</section>`;}
function eligible(t,r,id){return t.members.includes(id)&&t.reviewers.includes(id)&&id!==r.actor&&id!==r.payload.target;}
function approved(t,r){return r.required===0||r.approvals.some(id=>eligible(t,r,id));}
function requestStatus(t,r){if(['committed','rejected','withdrawn'].includes(r.state))return {committed:'실행 완료',rejected:'반려',withdrawn:'철회'}[r.state];if(r.base!==t.rev)return '기준 변경 · 다시 검토';return approved(t,r)?'승인 충족':'검토 대기';}
function describe(r){const p=r.payload;switch(r.type){case'metadata':return `이름: ${p.beforeName} → ${p.name}. 팀 ID 유지.`;case'connection':return `기본 연결: ${p.beforeRoute==='github'?'GitHub':'P2P'} → ${p.route==='github'?'GitHub':'P2P'}. ${p.route==='github'?'대상 '+p.repo:'원격 저장소는 보존'}.`;case'policy':return `운영 정책: ${p.beforeProfile==='shared'?'공동 검토':'1인 운영'} → ${p.profile==='shared'?'공동 검토':'1인 운영'}.`;case'invite':return `${persons[p.target]}를 일반 구성원으로 등록. 당사자 동의와 권한 검토 필요.`;case'roles':return `${persons[p.target]}의 역할을 ${p.role==='reviewer'?'변경 검토자':'일반 구성원'}로 변경.`;case'transfer':return `${persons[p.beforeOwner]} → ${persons[p.target]} 소유권 이전. 확정 담당 ${p.finalizer?'함께 이전':'유지'}.`;case'archive':return '새 팀 작업·일반 변경·채택을 중지하고 허용된 기록을 보관. 원본·GitHub 저장소는 삭제하지 않음.';case'restore':return '같은 팀 ID로 운영 재개. 권한·자료·기기 준비 상태를 다시 확인해야 함.';case'close':return '팀 ID 영구 종료. 원격 저장소는 보존. 원본은 지정된 보존 책임자의 별도 권한으로 유지하며 실제 사본 삭제는 별도 처리.';}}
function requests(t){const rs=s.requests.filter(r=>r.team===t.id);const r=rs.find(r=>r.id===s.requestId)||rs[rs.length-1];if(!r)return '<h2>변경 요청</h2><div class="tl-note">아직 변경 요청이 없습니다.</div>';const st=requestStatus(t,r),done=['실행 완료','반려','철회'].includes(st);return `<div class="tl-requestlist">${rs.map(q=>`<button type="button" data-action="select-request" data-id="${q.id}" aria-pressed="${q.id===r.id}">${q.id} · ${titles[q.type]}</button>`).join('')}</div><div class="tl-sectionhead"><h2>${r.id} · ${titles[r.type]}</h2>${pill(st)}</div><dl class="tl-facts"><dt>제안자</dt><dd>${persons[r.actor]}</dd><dt>기준 상태</dt><dd>${t.id} · 설정 ${r.base}판</dd><dt>필요 승인</dt><dd>${r.required}명${r.required===0?' · 직접 실행 정책':''}</dd><dt>현재 승인</dt><dd>${r.approvals.filter(id=>eligible(t,r,id)).map(id=>persons[id]).join(', ')||'없음'}</dd></dl><h3>정확한 변경</h3><p class="tl-sub">${esc(describe(r))}</p><p class="tl-small">이유: ${esc(r.reason)}</p>${['invite','transfer'].includes(r.type)?`<div class="tl-note">${persons[r.payload.target]}의 ${r.type==='transfer'?'인수':'참여'} 동의: ${r.consent?'확인됨':'대기'}${B(r.type==='transfer'?'인수 준비에 동의':'참여에 동의','consent-request',false,s.actor===r.payload.target&&!r.consent&&!done?'':'disabled')}</div>`:''}${r.state==='rejected'?`<div class="tl-note tl-warning">반려: ${esc(r.rejection)}</div>`:''}<div class="tl-note ${eligible(t,r,s.actor)?'':'tl-warning'}">${eligible(t,r,s.actor)?'이 계정은 독립 검토자로 승인할 수 있습니다.':'요청자·권한 수혜자는 자신의 요청을 독립 승인할 수 없습니다.'}</div>${!done?`${field('검토·반려 의견','reason',s.reason)}<div class="tl-actions">${B('변경 승인','approve',true,eligible(t,r,s.actor)&&r.base===t.rev?'':'disabled')}${B('이유를 남기고 반려','reject',false,eligible(t,r,s.actor)&&r.base===t.rev?'':'disabled')}${B('요청 철회','withdraw',false,r.actor===s.actor?'':'disabled')}</div>`:''}<div class="tl-bottom"><span class="tl-small">실행 시 현재 권한과 설정 판을 다시 확인합니다.</span>${B('검토한 변경 실행','execute',true,owner(t)&&st==='승인 충족'&&(!['invite','transfer'].includes(r.type)||r.consent)?'':'disabled')}</div>`;}
function lifecycle(t){return `<h2>팀 전체에 적용되는 동작</h2><div class="tl-row"><div><strong>팀 보관</strong><small>새 팀 작업을 멈추고 기록을 보관합니다. 나중에 복원할 수 있습니다.</small></div>${B('보관 요청','request-archive',false,management(t)?'':'disabled')}</div><div class="tl-row"><div><strong>팀 복원</strong><small>같은 팀 ID로 재개합니다. 예전 권한이나 작업 준비 상태가 자동 복구되지는 않습니다.</small></div>${B('복원 요청','request-restore',false,owner(t)&&t.status==='archived'?'':'disabled')}</div><section class="tl-section"><h2>팀 영구 종료</h2><p class="tl-sub">보관 중인 팀을 종료합니다. 팀 ID는 다시 활성화할 수 없습니다. 원격 저장소와 실제 데이터 삭제는 별도입니다.</p><dl class="tl-facts"><dt>보존 책임자</dt><dd>${persons[t.custodian]||'지정 필요'} · 보존 대상별 별도 권한 확인</dd><dt>GitHub 처리</dt><dd>원격 저장소 보존 · 팀 연결 중지</dd><dt>오프라인 사본</dt><dd>다음 교환 때 종료 기록 전달 · 즉시 삭제 보장 불가</dd></dl>${field('확인할 팀 이름','confirmName',s.confirmName,'input',t.status==='archived'&&owner(t)?'':'disabled')}${B('영구 종료 요청','request-close',false,owner(t)&&t.status==='archived'?'':'disabled')}<p class="tl-small">원본 처리 계획·권한 인계는 이 예시에서 완료된 것으로 가정합니다. 실제 구현은 그 증거를 확인합니다.</p></section>${t.status==='setup'?`<div class="tl-note tl-warning">아직 공동 운영을 시작하지 않은 팀입니다. 초기 책임자가 미완료 생성을 취소할 수 있습니다.${B('미완료 팀 생성 취소','cancel-setup',false,owner(t)?'':'disabled')}</div>`:''}<section class="tl-section"><h2>내 계정·기기에만 적용되는 동작</h2><div class="tl-row"><div><strong>팀 탈퇴</strong><small>내 구성원 자격을 끝냅니다. 소유·확정·복구 책임이 남아 있으면 먼저 이전합니다.</small></div>${B('팀 탈퇴','leave',false,member(t)&&t.status!=='closed'?'':'disabled')}</div><div class="tl-row"><div><strong>이 기기에서만 제거</strong><small>구성원 자격과 다른 사본은 유지합니다. 활성 확정 담당 기기는 인계 없이 제거할 수 없습니다.</small></div>${B('로컬 사본 제거','forget')}</div></section>${t.status==='closed'?`<section class="tl-section"><h2>종료 후 사본 정리</h2><p>관리 사본 삭제 확인: ${t.purged.length} / ${t.peers.length}곳 · 나머지는 확인 대기</p>${B('내 관리 사본 정리 · 가상','purge',false,s.actor===t.custodian&&t.peers.includes(s.actor)&&!t.purged.includes(s.actor)?'':'disabled')}${B('옛 팀 사본 반입 · 가상','old-copy')}<p class="tl-small">종료를 취소하거나 모든 기기의 삭제 완료를 뜻하지 않습니다.</p></section>`:''}`;}
function detail(){const t=team();if(!t||!canRead(t))return '<div class="tl-note">이 팀에 대한 상세 접근이 없습니다.</div>';return head('TEAM MANAGEMENT',esc(t.name),`${t.id} · 설정 ${t.rev}판 · ${stateLabel[t.status]}`,L('팀 목록','list'))+`<div class="tl-tabs" aria-label="팀 관리 영역">${Object.entries(tabs).map(([id,title])=>`<button type="button" data-action="tab" data-tab="${id}" aria-pressed="${s.tab===id}">${title}</button>`).join('')}</div>`+(s.tab==='overview'?overview(t):s.tab==='settings'?settings(t)+connectionControl(t):s.tab==='members'?members(t):s.tab==='requests'?requests(t):lifecycle(t));}
function unknownView(){return head('OPERATION STATUS','결과 확인 중','응답을 받지 못했습니다. 새 요청을 만들기 전에 기존 작업 결과를 확인합니다.')+`<div class="tl-note tl-warning">가상 작업 ${s.unknown.id} · 결과 미확인</div>${B('같은 작업 결과 확인','recover',true)}`;}
function render(){const a=document.activeElement;const focus=root.contains(a)?{field:a.dataset.field,action:a.dataset.action,id:a.dataset.id,tab:a.dataset.tab}:{};root.style.setProperty('--tl-pad',design.density==='compact'?'18px':'24px');const html=s.unknown?unknownView():s.view==='wizard'?wizard():s.view==='localRestore'?localRestoreView():s.view==='detail'?detail():s.view==='invitations'?invitations():list();root.innerHTML=`<div data-layout="${design.layout}"><div class="tl-harness"><span>목업 · 팀·계정·초대·삭제 모두 가상</span><label>체험 계정<select data-field="actor" aria-label="체험 계정" ${s.view==='wizard'||s.unknown?'disabled':''}>${Object.entries(persons).map(([id,name])=>`<option value="${id}" ${s.actor===id?'selected':''}>${name}</option>`).join('')}</select></label><label>실행 조건<select data-field="mode" aria-label="실행 조건">${[['normal','정상'],['githubFail','GitHub 연결 불가'],['conflict','확정 시 상태 충돌'],['lost','실행 응답 유실']].map(([id,name])=>`<option value="${id}" ${s.mode===id?'selected':''}>${name}</option>`).join('')}</select></label>${L('처음부터','reset')}</div><div class="tl-shell"><aside><div class="tl-brand">Studio<small>agent-bios · 팀 관리</small></div><nav class="tl-nav" aria-label="팀 탐색"><button type="button" data-action="list" ${s.view==='list'?'aria-current="page"':''}>내 팀</button><button type="button" data-action="invitations" ${s.view==='invitations'?'aria-current="page"':''}>초대받은 팀</button></nav><div class="tl-sidebar-note">생성 · 조회 · 변경<br>보관 · 복원 · 종료</div></aside><div class="tl-workspace"><header><span>공유 업무환경의 시작점</span><span>${persons[s.actor]} · 가상 본인 확인</span></header><main>${html}${s.error?`<div class="tl-error" role="alert">${esc(s.error)}</div>`:''}</main><footer role="status" aria-live="polite">${esc(s.message)}</footer></div></div></div>`;let target=focus.field?root.querySelector(`[data-field="${focus.field}"]`):focus.action?root.querySelector(`[data-action="${focus.action}"]${focus.id?`[data-id="${focus.id}"]`:''}${focus.tab?`[data-tab="${focus.tab}"]`:''}`):null;if(!target&&focus.action)target=root.querySelector('main input:not(:disabled),main .tl-primary:not(:disabled),main button:not(:disabled)');target?.focus({preventScroll:true});}
function createTeam(){if(s.w.created){openTeam(s.w.created);return;}const w=clone(s.w);if(!w.name.trim()){s.error='팀 이름을 입력해 주세요.';return;}const id='T-new-'+s.nextId++;const payload={id,w};const effect=()=>{const t=fixture(id,w.name.trim(),w.profile==='solo'?'active':'setup');Object.assign(t,{description:w.description,owner:w.founder,finalizer:w.founder,custodian:w.profile==='solo'?w.founder:'',members:[w.founder],reviewers:[],roles:{[w.founder]:'member'},profile:w.profile,route:w.route,network:w.network,maxDays:w.maxDays,repo:w.repo,connected:w.route==='github'&&w.connected,peers:[w.founder],envs:0,nominee:w.profile==='shared'?w.nominee:''});s.teams.push(t);s.w.created=id;openTeam(id);log(t,'가상 팀 생성 완료. 업무환경 채택과 작업 시작은 별도입니다.');};if(s.mode==='lost'){s.unknown={id:'CREATE-'+id,effect};s.mode='normal';}else effect();}
function submit(t,type,payload){if(!owner(t)){s.error='이 팀의 변경 요청을 만들 권한이 없습니다.';return;}const allowed=t.status==='active'||t.status==='archived'&&['restore','close','roles','transfer'].includes(type);if(!allowed){s.error='현재 팀 상태에서 이 변경을 요청할 수 없습니다.';return;}const r={id:'Q-'+String(s.requests.length+1).padStart(3,'0'),team:t.id,type,payload:clone(payload),base:t.rev,actor:s.actor,required:type==='metadata'||t.profile==='solo'?0:1,approvals:[],consent:false,state:'pending',reason:s.reason};s.requests.push(r);s.requestId=r.id;s.tab='requests';log(t,`${r.id} ${titles[type]} 요청. 아직 적용되지 않았습니다.`);}
function findRequest(){const t=team();return s.requests.find(r=>r.team===t?.id&&r.id===s.requestId)||s.requests.filter(r=>r.team===t?.id).at(-1);}
function applyRequest(t,r){const p=r.payload;if(r.type==='metadata'){t.name=p.name;t.description=p.description;}if(r.type==='connection'){if(t.repo&&t.repo!==p.repo||p.route==='p2p'){if(t.repo&&!t.remoteRetained.includes(t.repo))t.remoteRetained.push(t.repo);}Object.assign(t,{route:p.route,repo:p.repo,network:p.network,maxDays:p.maxDays,connected:false});}if(r.type==='policy')t.profile=p.profile;if(r.type==='invite'){if(!t.members.includes(p.target))t.members.push(p.target);t.roles[p.target]='member';}if(r.type==='roles'){t.roles[p.target]=p.role;t.reviewers=t.reviewers.filter(x=>x!==p.target);if(p.role==='reviewer')t.reviewers.push(p.target);}if(r.type==='transfer'){t.owner=p.target;if(p.finalizer)t.finalizer=p.target;}if(r.type==='archive')t.status='archived';if(r.type==='restore')t.status='active';if(r.type==='close'){t.status='closed';t.connected=false;t.closure='CLOSE-'+r.id;}t.rev++;r.state='committed';log(t,`${r.id} ${titles[r.type]} 가상 실행 완료. 설정 ${t.rev}판.`);}
function execute(){const t=team(),r=findRequest();if(!t||!r||!owner(t)||r.state!=='pending'||!approved(t,r)){s.error='실행 권한과 승인 조건을 확인해 주세요.';return;}if(s.mode==='conflict'){t.rev++;s.mode='normal';}if(t.rev!==r.base){s.error='기준 상태가 바뀌었습니다. 후보를 보존하고 새 요청으로 검토해야 합니다.';return;}if(['invite','transfer'].includes(r.type)&&!r.consent){s.error='당사자의 동의가 필요합니다.';return;}if(r.type==='roles'&&r.payload.role!=='reviewer'&&t.profile==='shared'&&t.reviewers.filter(x=>x!==r.payload.target&&t.members.includes(x)).length===0){s.error='마지막 검토자를 대체 없이 제거할 수 없습니다.';return;}if(r.type==='policy'&&r.payload.profile==='shared'&&!t.reviewers.some(id=>id!==t.owner&&t.members.includes(id))){s.error='공동 검토를 위한 별도 검토자가 필요합니다.';return;}if(s.mode==='lost'){s.unknown={id:'OP-'+r.id,effect:()=>applyRequest(t,r)};s.mode='normal';return;}applyRequest(t,r);}
function localRestoreView(){const t=team();return head('LOCAL COPY',esc(t.name),'이 기기에서 제거한 팀입니다. 구성원 자격은 별도로 유지됩니다.')+`<dl class="tl-facts"><dt>팀 ID</dt><dd>${t.id}</dd><dt>현재 알려진 상태</dt><dd>${stateLabel[t.status]}</dd><dt>보관 증거</dt><dd>다른 가상 기기에 기록된 사본에서 다시 검증합니다.</dd></dl><div class="tl-note">현재 기기의 자료를 복구해도 구성원 수나 승인표는 늘어나지 않습니다.</div>${B(t.status==='closed'?'종료된 팀은 재활성화 불가':'다른 사본에서 다시 받기 · 가상','restore-local',true,t.status==='closed'?'disabled':'')}`;}
function connectionControl(t){return t.route==='github'&&t.status==='active'?`<div class="tl-note">승인된 현재 연결 대상: ${esc(t.repo)||'미지정'} · ${t.connected?'연결 확인됨':'연결 대기'}<div class="tl-actions">${B('현재 대상 연결 확인 · 가상','verify-existing',false,owner(t)&&!t.connected?'':'disabled')}</div></div>`:'';}
function foundationSummary(t){return `<dl class="tl-facts"><dt>초기 제안</dt><dd>${t.foundationVersion}판 · ${t.id}</dd><dt>소유·권한 관리</dt><dd>${persons[t.owner]}</dd><dt>확정 담당</dt><dd>${persons[t.finalizer]}의 가상 기기</dd><dt>받을 책임</dt><dd>공유 변경 검토 + 복구 책임 · 별도 역할로 기록</dd><dt>승인 정책</dt><dd>독립된 사람의 검토 후 확정</dd><dt>동기화</dt><dd>P2P${t.route==='github'?' + GitHub · '+esc(t.repo||'연결 대기'):''}</dd></dl>`;}
function setField(key,value){if(key.startsWith('w.'))s.w[key.slice(2)]=value;else if(key.startsWith('edit.'))s.edit[key.slice(5)]=value;else s[key]=value;}
root.addEventListener('input',event=>{const k=event.target.dataset.field;if(!k||event.target.type==='checkbox'||event.target.type==='radio')return;setField(k,event.target.value);if(k==='query')render();});
root.addEventListener('change',event=>{const k=event.target.dataset.field;if(!k)return;if(event.target.tagName==='INPUT'&&!['checkbox','radio'].includes(event.target.type)||event.target.tagName==='TEXTAREA')return;setField(k,event.target.type==='checkbox'?event.target.checked:event.target.value);s.error='';if(k==='actor'){if(s.view==='detail'&&!canRead(team()))s.view='list';s.message=`체험 계정을 ${persons[s.actor]}(으)로 바꿨습니다.`;}if(k==='w.repo'||k==='w.network'||k==='w.route'){s.w.connected=false;s.w.defer=false;if(s.w.network==='closed')s.w.route='p2p';}if(k==='edit.network'&&s.edit.network==='closed')s.edit.route='p2p';render();});
root.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='reset'){reset();return;}s.error='';if(s.unknown){if(a==='recover'){const op=s.unknown;s.unknown=null;op.effect();s.message=`${op.id}의 기존 결과를 확인했습니다. 중복 실행하지 않았습니다.`;}render();return;}const t=team(),r=findRequest();
