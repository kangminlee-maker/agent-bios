<script>
(() => {
const root=document.getElementById('studio-zero-base');
const design={density:'comfortable',evidence:false};
const B=(text,action,primary=false,extra='')=>`<button type="button" class="zb-button${primary?' zb-primary':''}" data-action="${action}" ${extra}>${text}</button>`;
const L=(text,action,extra='')=>`<button type="button" class="zb-link" data-action="${action}" ${extra}>${text}</button>`;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cases=[['resume','기존 작업 이어가기'],['offline','GitHub 없이 작업하기'],['update','팀 기준이 달라짐'],['missing','필수 근거가 없음'],['reviewer','검토만 할 권한'],['founder','처음 팀부터 만들기']];
const requirements=[
['U01','역할에 맞는 환경 선택·공유·인수','업무 시작과 인계'],['U02','팀을 기본 단위로 사용','현재 팀·환경 표시'],['U03','세 자료의 의미 구분·Instructions 명칭','통합 요약 안의 출처 구분'],['U04','간결성·확장성·직관적 사용성','과업 비교와 사용자 검증'],['U05','안정된 원칙·변하는 지식','기간·조건·예외 함께 보기'],['U06','온톨로지·문항·8+1 렌즈·작성 도구','업무 지식 관리'],['U07','결정의 이유·대안·근거','현재 결정에서 이유 펼치기'],['U08','병행 작업과 결정의 흐름','업무 범위별 상태·인수'],['U09','효율적인 소비·필수 의미 보존','같은 읽기 기능으로 준비'],['U10','고급·운영 기능 전체 범위','자료·팀 관리의 직접 진입'],['U11','실제 작업·하위 작업·문맥 복구','수신자별 전달·복원'],['U12','권한·승인·실행의 구분','변경 검토와 정확한 결과'],['U13','팀 CRUD와 관련 수명주기','팀 관리'],['U14','정정·파생·보존·삭제','대상별 변경·정리'],['U15','P2P만으로 완결된 운영','로컬 사용·사본 교환'],['U16','GitHub 추천·선택 기능','팀 생성의 연결 선택'],['U17','폐쇄망·주 1~2회 교환','작업 가능 범위와 미공유 상태'],['U18','다른 기기를 통한 복구','사본 보관·복구']];
const dirs={
 instructions:{title:'작업 지침',question:'일하는 방식을 고치고 싶어요',actions:['시작할 때 읽는 지침','필요할 때 읽는 절차','원본 새 버전 제안','변경 전후 검토'],scope:'Instructions 원본의 소유자와 판을 확인합니다.'},
 knowledge:{title:'업무 지식',question:'판단 근거를 찾거나 보완하고 싶어요',actions:['원칙·현재 기준·적용 조건','원문과 근거 검색','온톨로지·검증 문항·8+1 렌즈','모델·도메인 양식 작성','새 버전 또는 허용된 파생본 제안'],scope:'검증 결과와 적용 가능성은 별개이며, 다른 소유자의 원본을 직접 수정하지 않습니다.'},
 memory:{title:'결정 기억',question:'왜 이렇게 정했는지 알고 싶어요',actions:['현재 결정과 열린 질문','이유·대안·관측 결과','여러 업무 흐름과 관련 정정','새 결정·정정·철회 기록'],scope:'정정·철회는 원기록을 지우지 않는 별도 사건입니다.'},
 transfers:{title:'가져오기·공유·복구',question:'자료를 옮기거나 되찾고 싶어요',actions:['허용된 원본·환경 파생','일괄 가져오기·내보내기','받고 보낼 자료·보관 확인','충돌·응답 유실·기기 복구','하위 작업에 필요한 본문 전달'],scope:'운반, 승인, 팀 채택, 수신자 전달은 각각 확인합니다.'},
 team:{title:'팀 관리',question:'팀 자체를 관리하고 싶어요',actions:['팀 만들기·참여·조회','이름·연결·운영 정책','구성원·권한·소유·확정 담당','기기·사본·보존 책임','탈퇴·로컬 제거·보관·복원·영구 종료','관리 사본의 별도 정리'],scope:'팀의 종료, 내 기기의 제거, 원본의 삭제는 다른 동작입니다.'}
};
let s;
function reset(scenario='resume',model='work'){s={scenario,model,view:scenario==='founder'?'create':scenario==='reviewer'?'review':model==='work'?'brief':'notebook',selectedTeam:'product',env:3,adopted:scenario==='update'?4:3,active:scenario==='founder'?0:3,activeTeam:scenario==='founder'?null:'제품 개발팀',restored:false,approved:false,started:false,proposal:false,proposalText:'적용 조건과 예외를 더 분명히 설명합니다.',returnView:null,directory:'knowledge',teamName:'',profile:'shared',github:true,teamCreated:false,govReady:false,foundationConsent:false,envCreated:false,envReviewed:false,envPublished:false,events:[],board:false,error:'',message:'A와 B는 같은 자료와 조건을 사용합니다. 화면 배치보다 시작 관점의 차이를 살펴보세요.'};render();}
function teamName(){return s.teamCreated?s.teamName:s.selectedTeam==='product'?'제품 개발팀':'고객 지원팀';}
function envName(){return s.selectedTeam==='product'?'개발 점검 기본':'문의 응대 기본';}
function taskName(){return s.selectedTeam==='product'?'중복 결제 점검':'결제 상태 문의 검토';}
function packet(){const prod=s.selectedTeam==='product',empty=s.teamCreated;return {team:teamName(),teamId:s.teamCreated?'T-new-context':s.selectedTeam==='product'?'T-product':'T-support',environment:envName(),edition:s.env,scope:taskName(),instruction:'이번 작업에 적용되는 팀 기준과 지식의 조건·예외를 확인하고, 확정된 결정과 열린 질문을 구분합니다.'+(s.env===4&&!s.teamCreated?' 점검 결과에 확인한 범위와 미확인 항목을 함께 남깁니다.':''),instructionVersion:s.env===4&&!s.teamCreated?6:5,principle:prod?'동일한 결제 요청이 중복 처리되었는지 확인합니다.':'확인된 거래 사실과 아직 조사 중인 내용을 구분해 안내합니다.',condition:prod?'같은 주문·요청 식별자에 대한 실제 거래를 비교합니다. 결과가 확인되지 않은 거래는 중복 확정으로 분류하지 않습니다.':'실제 거래 수와 상태가 확인된 경우에만 결과를 확정해서 안내합니다. 미확인 상태에서는 환불이나 중복 결제를 약속하지 않습니다.',decision:empty?'이 팀에 기록된 결정은 아직 없습니다.':prod?'확인된 중복과 미확정 거래를 구분해서 보고하기로 했습니다.':'거래 상태를 확인한 뒤 확정된 내용을 안내하기로 했습니다.',why:empty?'새 팀의 결정 조회는 정상적으로 끝났고, 결과가 비어 있습니다.':'추정을 확정 사실처럼 취급하면 후속 조치가 잘못될 수 있기 때문입니다.',open:empty?'작업 중 새 선택이 필요하면 이유와 함께 팀 결정으로 제안합니다.':'중간 안내의 주기는 아직 정하지 않았습니다. 이번 상태 점검 결과에도 미결정으로 남깁니다.',knowledgeVersion:7,frontier:empty?'빈 범위 확인':'M-42',blocked:s.scenario==='missing'&&!s.restored};}
function head(kicker,title,sub,action=''){return `<div class="zb-head"><div><div class="zb-kicker">${kicker}</div><h1>${title}</h1><p class="zb-sub">${sub}</p></div>${action}</div>`;}
function statusNote(){if(s.scenario==='offline')return '<div class="zb-note">9월 12일 확인한 로컬 기준으로 작업할 수 있습니다. GitHub 교환은 대기 중이며, 그 뒤의 새 변경은 아직 확인하지 못했습니다.</div>';if(s.scenario==='update'&&s.adopted===4&&s.env===3)return `<div class="zb-note">이전 작업은 3판을 사용했습니다. 팀이 채택한 4판이 있습니다. ${L('영향받는 변경 보기','update')}</div>`;return '';}
function answers(p){return `<section class="zb-answer"><h3>어떻게 일하나요? <span class="zb-pill">작업 지침</span></h3><p>${p.instruction}</p></section><section class="zb-answer"><h3>무엇을 근거로 판단하나요? <span class="zb-pill">업무 지식</span></h3>${p.blocked?`<div class="zb-note zb-warning">이 작업에 필요한 거래 확인 기준의 본문이 이 기기에 없습니다. 목록만으로 판단할 수 없습니다.</div>${B('다른 사본에서 받아 준비','repair',true)}`:`<p>${p.principle}</p><p><strong>조건·예외</strong> · ${p.condition}</p><p class="zb-small">예시 운영 원칙 7판 · 9월 1일부터 적용 · 9월 12일 확인한 가상 자료</p>`}</section><section class="zb-answer"><h3>무슨 결정을 이어받나요? <span class="zb-pill">결정 기억</span></h3><p>${p.decision}</p><p class="zb-small">${p.open}</p><details ${design.evidence?'open':''}><summary>왜 이렇게 정했나요?</summary><p>${p.why}</p><p class="zb-small">${s.teamCreated?'과거 팀의 결정을 복사해 채우지 않았습니다.':'D-018과 관련 정정 C-021을 함께 읽었습니다. 별도 업무 흐름의 정정도 반영합니다.'}</p></details></section>`;}
function brief(){const p=packet();return head('WORK CONTEXT',`${taskName()}을 위한 팀 기준`,'이전에 준비한 업무에서 필요한 기준과 미결정 사항을 모았습니다.',L('다른 팀·환경 선택','choose'))+statusNote()+`<div class="zb-grid"><div>${answers(p)}</div><aside class="zb-aside"><h3>이번에 사용할 환경</h3><p><strong>${esc(p.team)}</strong><br>${p.environment} · ${p.edition}판</p><p class="zb-small">사용할 곳: 새 작업 문맥 · 가상</p>${s.scenario==='update'?`<p class="zb-small">이전 작업 ${s.active}판 / 팀 채택 ${s.adopted}판</p>`:''}<div class="zb-section">${B('이 기준으로 작업 시작','start',true,p.blocked?'disabled':'')}</div><p class="zb-small">현재 확인한 범위의 필수 자료를 준비해 새 문맥으로 이어갑니다.</p>${L('전달될 내용 자세히','preview')}<details><summary>출처·확인 범위</summary><p>지침 ${p.instructionVersion}판 · 지식 ${p.knowledgeVersion}판<br>결정 ${p.frontier}<br>지금 확인한 필수 범위의 준비입니다. 전 세계의 최신 정보를 보장하지 않습니다.</p></details></aside></div><div class="zb-bottom"><span class="zb-small">작업 방법·지식·결정은 서로 다른 출처와 의미를 유지합니다.</span>${L('팀 환경 전체 살펴보기','notebook')}</div>`;}
function notebook(){return head('SHARED ENVIRONMENT',`${esc(teamName())}의 ${envName()}`,'팀이 함께 사용하는 작업 방식, 판단 근거와 결정 내역입니다.',L('다른 팀·환경 선택','choose'))+statusNote()+`<div class="zb-note">선택한 환경 ${s.env}판 · 소유자 ${s.teamCreated?'예시 공통 자료 + '+esc(teamName()):esc(teamName())}</div><div class="zb-grid"><div><section class="zb-answer"><h3>이 환경의 목적</h3><p>동료가 바뀌어도 같은 작업 방식과 판단 근거, 결정 맥락을 이어갑니다.</p></section><section class="zb-answer"><h3>작업 방식</h3><p>확인한 사실과 미결정 사항을 구분하고, 필요한 근거를 찾아 확인합니다.</p>${L('작업 지침 찾기·관리','directory','data-directory="instructions"')}</section><section class="zb-answer"><h3>업무 원칙과 현재 기준</h3><p>${packet().blocked?'현재 기준의 필수 본문이 이 기기에 없습니다. 작업별 준비에서 받을 수 있는 사본을 확인하세요.':packet().principle}</p>${packet().blocked?'':'<p>'+packet().condition+'</p>'}${packet().blocked?B('필수 본문 받을 곳 찾기','repair',true):''}${L('업무 지식 찾기·관리','directory','data-directory="knowledge"')}</section><section class="zb-answer"><h3>팀의 결정</h3><p>${packet().decision}</p><p class="zb-small">${packet().open}</p>${L('결정과 이유 찾아보기','directory','data-directory="memory"')}</section></div><aside class="zb-aside"><h3>이 환경으로 일하기</h3><p>알려진 작업: ${taskName()}</p>${B('이 환경으로 작업 시작','start',true,packet().blocked?'disabled':'')} ${L('이번 작업에 맞춰 준비','brief')}<p class="zb-small">필요한 범위와 조건을 모아 실제 전달 전에 확인합니다.</p>${L('이전 작업 맥락 열기','brief')}<details><summary>환경의 구성과 상태</summary><p>팀 채택 ${s.adopted}판 · 이전 작업 ${s.active}판<br>지침 ${packet().instructionVersion}판 · 지식 7판 · 결정 ${packet().frontier}</p></details></aside></div>`;}
function preview(){const p=packet();return head('DELIVERY PREVIEW','전달될 내용','작업에 사용할 동일한 읽기 결과입니다. 아직 전달하지 않았습니다.',L('준비 화면으로','brief'))+answers(p)+`<dl class="zb-facts"><dt>팀·환경</dt><dd>${esc(p.team)} · ${p.environment} ${p.edition}판</dd><dt>결정 범위</dt><dd>${p.frontier}</dd><dt>출력 범위</dt><dd>이 예시의 필수 본문과 조건 포함 · 원문은 추가 조회</dd></dl><div class="zb-bottom"><span class="zb-small">미리보기는 선택적으로 열 수 있으며 실제 사용과 구분됩니다.</span>${B('이 기준으로 작업 시작','start',true,p.blocked?'disabled':'')}</div>`;}

function choose(){return head('CHOOSE CONTEXT','어느 팀의 기준으로 일할까요?','표시 이름이 같아도 팀·환경의 권한과 실제 작업 문맥은 별개입니다.',L('돌아가기','brief'))+`<div class="zb-directory">${[['product','제품 개발팀','개발 점검 기본'],['support','고객 지원팀','문의 응대 기본']].map(([id,name,env])=>`<button type="button" data-action="choose-team" data-team="${id}" ${s.teamCreated?'disabled':''}><strong>${name}</strong><span class="zb-small">${env} · 허용된 가상 환경</span></button>`).join('')}</div>${s.teamCreated?'<div class="zb-note">이 시나리오는 방금 만든 팀의 첫 환경을 이어서 확인합니다.</div>':''}<p class="zb-small" style="margin-top:14px">팀을 바꾸면 준비 내용을 다시 구성합니다. 이전 문맥과 사적인 자료를 옮기지 않습니다.</p>`;}

function directory(){const d=dirs[s.directory];return head('FIND & MAINTAIN',d.question,d.scope,L('작업 준비로','brief'))+`<h2>${d.title}</h2>${d.actions.map(x=>`<div class="zb-row"><span>${x}</span></div>`).join('')}${s.directory==='knowledge'||s.directory==='instructions'?`<div class="zb-section"><h3>예시 원문 · 현재 7판</h3><p class="zb-sub">${packet().blocked?'이 원문의 본문이 없습니다. 다른 사본에서 받아 검증해야 합니다.':packet().principle+' '+packet().condition}</p><p class="zb-small">${s.teamCreated?'예시 공통 자료 · 원본은 읽기 전용, 허용된 별도 사본을 제안':esc(teamName())+' 소유 · 이 계정은 변경 제안 가능'}</p>${B(s.teamCreated?'별도 사본 제안':'새 버전 제안','propose',true)}</div>`:''}${s.directory==='team'?`<div class="zb-note">이 시안은 팀 관리의 발견 경로를 비교합니다. 생성은 아래에서 이어서 실행할 수 있으며, 전체 CRUD 세부 폼은 앞선 팀 관리 목업과 설계 계약에 유지됩니다.</div>${B('새 팀 구성 시작','start-founder',true)}`:''}<details><summary>이 비교 시안의 범위</summary><p>기능을 숨기거나 설계에서 제외한 것이 아닙니다. 이 패널은 관리 진입과 기능 분류의 이해를 확인합니다. 모든 고급 편집기와 CRUD를 다시 구현한 화면은 아닙니다.</p></details>`;}
function materials(){return head('ENVIRONMENTS & MATERIAL','무엇을 찾거나 바꾸고 싶나요?','작업을 새로 등록하지 않아도 자료와 환경을 직접 관리할 수 있습니다.',L('작업 준비로','brief'))+`<div class="zb-directory">${Object.entries(dirs).map(([id,d])=>`<button type="button" data-action="directory" data-directory="${id}"><strong>${d.question}</strong><span class="zb-small">${d.title}</span></button>`).join('')}</div>`;}
function proposal(){return head('PROPOSE A CHANGE',s.teamCreated?'별도 소유의 사본을 제안합니다':'원본의 새 버전을 제안합니다','제안 저장은 현재 팀 기준이나 진행 중인 작업을 바꾸지 않습니다.',L('자료로 돌아가기','directory','data-directory="knowledge"'))+`<label class="zb-field"><span>바꿀 내용과 이유</span><textarea data-field="proposalText">${esc(s.proposalText)}</textarea></label><dl class="zb-facts"><dt>기준 원본</dt><dd>업무 지식 7판</dd><dt>현재 팀 환경</dt><dd>${s.env}판 유지</dd></dl>${s.proposal?'<div class="zb-note">가상 제안을 저장했습니다. 원본·환경·작업은 바뀌지 않았고, 검토를 기다립니다.</div>':B('제안 저장','submit-proposal',true)}`;}
function create(){return head('NEW TEAM','함께 사용할 팀의 시작점을 정합니다','페이지 수를 먼저 정하지 않고, 생성 전에 필요한 선택과 결과를 한곳에서 확인합니다.')+`<label class="zb-field"><span>팀 이름</span><input data-field="teamName" value="${esc(s.teamName)}" placeholder="예: 운영 개선팀" maxlength="60"></label><div class="zb-directory"><section><h3>운영 방식</h3><label class="zb-choice"><input type="radio" name="profile" data-field="profile" value="shared" ${s.profile==='shared'?'checked':''}><span><strong>함께 검토</strong><span class="zb-small">초기 책임자 민지 · 검토·복구 후보 지원</span></span></label><label class="zb-choice"><input type="radio" name="profile" data-field="profile" value="solo" ${s.profile==='solo'?'checked':''}><span><strong>혼자 운영</strong><span class="zb-small">독립 승인으로 표시하지 않는 직접 결정</span></span></label></section><section><h3>보관·공유</h3><label class="zb-choice"><input type="checkbox" data-field="github" ${s.github?'checked':''}><span><strong>GitHub 연결 추천</strong><span class="zb-small">선호를 저장하고, 계정·저장소 연결은 별도로 진행</span></span></label><p class="zb-small">기본은 P2P입니다. 선택을 해제하면 P2P만 사용합니다.</p></section></div><details><summary>생성되는 것과 아직 남는 것</summary><p>팀 ID와 초기 제안, 이 기기의 팀 제어 기록 1곳이 생깁니다. 아직 업무환경은 없습니다. 공동 검토를 선택하면 지원의 동의와 초기 확정이 필요합니다.</p><p>이 시안의 네트워크·역할 정보는 가상입니다. 실제 설계에서는 폐쇄망/주간 교환 및 세부 권한을 같은 생성 작업에서 펼쳐 설정할 수 있습니다.</p></details><div class="zb-bottom"><span class="zb-small">이름을 입력해도 GitHub 인증이나 업로드가 일어나지 않습니다.</span>${B('가상 팀 생성','create-team',true)}</div>`;}
function firstEnvironment(){return head('FIRST ENVIRONMENT',`${esc(s.teamName)}의 첫 업무환경`,'방금 만든 같은 팀에서 이어갑니다. 기존 팀의 환경을 몰래 만들어 넣지 않습니다.')+`<dl class="zb-facts"><dt>팀 ID</dt><dd>T-new-context</dd><dt>팀 생성</dt><dd>완료</dd><dt>운영 체계</dt><dd>${s.govReady?'준비됨':'지원의 초기 동의·확정 대기'}</dd><dt>GitHub</dt><dd>${s.github?'연결 대기':'사용하지 않음'}</dd><dt>업무환경</dt><dd>${s.envPublished?'1개 · 1판 채택':s.envCreated?'1개 초안 · 아직 미발행':'0개'}</dd><dt>보관 확인</dt><dd>팀 제어 기록 1곳 · 다른 사본은 아직 확인 전</dd></dl>${!s.govReady?`<div class="zb-note zb-warning">팀은 만들어졌지만 공동 운영은 아직 준비 중입니다. 상단의 ‘동료 응답 받기’는 실제 동의가 도착하는 상황을 흉내 냅니다.</div>${B('초기 구성 확정','finalize-foundation',true,s.foundationConsent?'':'disabled')}`:!s.envCreated?`<h2>첫 환경에 사용할 자료</h2><div class="zb-row"><span>예시 공통 작업 지침 5판</span><span class="zb-small">포함 허용</span></div><div class="zb-row"><span>예시 공통 업무 원칙 7판</span><span class="zb-small">조건·예외 포함</span></div><div class="zb-row"><span>이 팀의 결정 범위</span><span class="zb-small">정상 조회 · 아직 기록 없음</span></div><div class="zb-bottom"><span class="zb-small">공통 원본의 소유자는 유지됩니다.</span>${B('이 구성으로 환경 초안 만들기','create-env',true)}</div>`:!s.envPublished?`<div class="zb-note">개발 점검 기본 1판 초안 · 지침 5판 / 지식 7판 / 새 팀의 빈 결정 범위</div><p class="zb-small">${s.profile==='shared'?(s.envReviewed?'지원이 발행과 이 팀의 채택이라는 두 효과를 각각 검토한 가상 응답이 있습니다.':'독립된 검토가 필요합니다. 상단에서 가상 동료 응답을 받은 뒤 진행합니다.'):'1인 운영 정책으로 직접 결정합니다.'}</p><div class="zb-bottom"><span class="zb-small">발행과 채택은 별도 결과로 남깁니다.</span>${B('환경 1판 발행 및 이 팀 채택','publish-adopt',true,s.profile==='shared'&&!s.envReviewed?'disabled':'')}</div>`:`<div class="zb-note">환경 발행 완료 · 이 팀의 1판 채택 완료 · 아직 실제 작업에 전달 전</div>${B('이 환경으로 작업 준비','brief',true)}`}`;}
function board(){return head('REQUIREMENTS REVIEW','전체 요구사항을 놓고 비교합니다','18개 요구사항 묶음은 유지합니다. 메뉴 수와 페이지 수, 기본 표시 방식은 검토 대상입니다.',L('시안으로 돌아가기','close-board'))+`<table class="zb-table"><thead><tr><th>ID</th><th>지켜야 할 결과</th><th>사용자 관점의 자리</th></tr></thead><tbody>${requirements.map(([id,title,place])=>`<tr><td>${id}</td><td>${title}</td><td>${place}</td></tr>`).join('')}</tbody></table><div class="zb-note">권한·정확한 대상·필수 의미·오프라인 한계는 유지합니다. 7개 메뉴, 4단계 생성, 매번 3번 누르는 준비 절차는 고정 요구사항이 아닙니다.</div>`;}
function render(){const a=document.activeElement;const focus=root.contains(a)?{field:a.dataset.field,action:a.dataset.action,directory:a.dataset.directory,team:a.dataset.team}:{};root.style.setProperty('--zb-pad',design.density==='compact'?'20px':'28px');if(s.scenario==='founder'&&!s.envPublished&&['brief','notebook','preview','choose'].includes(s.view))s.view=s.teamCreated?'first':'create';let content=s.board?board():s.view==='create'?create():s.view==='first'?firstEnvironment():s.view==='notebook'?notebook():s.view==='brief'?brief():s.view==='preview'?preview():s.view==='result'?result():s.view==='choose'?choose():s.view==='update'?update():s.view==='repair'?repair():s.view==='review'?review():s.view==='materials'?materials():s.view==='proposal'?proposal():directory();const peerNeeded=s.teamCreated&&s.profile==='shared'&&(!s.govReady&&!s.foundationConsent||s.govReady&&s.envCreated&&!s.envReviewed);root.innerHTML=`<div class="zb-lab"><div class="zb-labtop"><span>비교 목업 · 가상 자료 · 실제 사용자 검증 전</span><div class="zb-actions">${L('전체 요구사항 보기','board')}${L('처음부터','reset')}</div></div><div class="zb-labcontrols"><div class="zb-switch" aria-label="비교할 시작 관점"><button type="button" data-action="model-work" aria-pressed="${s.model==='work'}">A · 업무 맥락에서</button><button type="button" data-action="model-notebook" aria-pressed="${s.model==='notebook'}">B · 팀 환경에서</button></div><label>사례<select data-field="scenario" aria-label="비교 사례">${cases.map(([id,title])=>`<option value="${id}" ${s.scenario===id?'selected':''}>${title}</option>`).join('')}</select></label>${s.scenario==='founder'?B('동료 응답 받기 · 가상','peer-response',false,peerNeeded?'':'disabled'):''}</div></div><header><div><button type="button" class="zb-link zb-brand" data-action="home">agent-bios</button><div class="zb-context">${s.view==='review'?'제품 개발팀 · 지식 변경 검토':s.scenario==='founder'&&!s.teamCreated?'새 팀 준비':esc(teamName())+' · '+envName()}</div></div><div class="zb-actions">${L('자료 찾기·관리','materials')}${L('팀 관리','directory','data-directory="team"')}</div></header><main>${content}${s.error?`<div class="zb-error" role="alert">${esc(s.error)}</div>`:''}</main><footer role="status" aria-live="polite">${esc(s.message)}</footer>`;let target=focus.field?root.querySelector(`[data-field="${focus.field}"]`):focus.action?root.querySelector(`[data-action="${focus.action}"]${focus.directory?`[data-directory="${focus.directory}"]`:''}${focus.team?`[data-team="${focus.team}"]`:''}`):null;if(!target&&focus.action)target=root.querySelector('main .zb-primary:not(:disabled),main input,main button');target?.focus({preventScroll:true});}
root.addEventListener('input',event=>{const k=event.target.dataset.field;if(['teamName','proposalText'].includes(k))s[k]=event.target.value;});
root.addEventListener('change',event=>{const k=event.target.dataset.field;if(k==='scenario'){reset(event.target.value,s.model);return;}if(['profile','github'].includes(k)){s[k]=event.target.type==='checkbox'?event.target.checked:event.target.value;render();}});
root.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;const previousView=s.view;s.error='';if(action==='reset'){reset(s.scenario,s.model);return;}if(action==='board')s.board=true;if(action==='close-board')s.board=false;
 if(action==='model-work'||action==='model-notebook'){s.model=action==='model-work'?'work':'notebook';if(!['create','first'].includes(s.view))s.view=s.scenario==='reviewer'?'review':s.model==='work'?'brief':'notebook';s.message='보는 관점만 바꿨습니다. 팀·판·승인·작업 상태는 그대로입니다.';}
 if(action==='home')s.view=s.scenario==='founder'&&!s.envPublished?(s.teamCreated?'first':'create'):s.scenario==='reviewer'?'review':s.model==='work'?'brief':'notebook';
 if(['brief','notebook','preview','choose','update','repair','review','materials','propose'].includes(action)){s.view=action==='propose'?'proposal':action;if(action==='preview')s.message='동일한 준비 결과를 미리 봅니다. 아직 사용한 것은 아닙니다.';}
 if(action==='directory'){s.directory=b.dataset.directory||s.directory;s.view='directory';}
 if(action==='choose-team'&&!s.teamCreated){s.selectedTeam=b.dataset.team;s.env=3;s.adopted=s.scenario==='update'&&s.selectedTeam==='product'?4:3;s.restored=false;s.started=false;s.view=s.model==='work'?'brief':'notebook';s.message='다른 팀의 준비를 새로 구성합니다. 기존 작업의 자료를 복사하거나 권한을 늘리지 않았습니다.';}
 if(action==='keep-old'){s.env=3;s.view='brief';}if(action==='take-update'){s.env=4;s.view='brief';s.message='다음 준비 대상을 4판으로 골랐습니다. 이전 3판 작업은 바뀌지 않았습니다.';}
 if(action==='repair')s.returnView=previousView;if(action==='receive'){s.restored=true;s.view=s.returnView||'brief';s.message='가상 사본에서 필수 본문을 검증했습니다. 작업 시작은 아직 하지 않았습니다.';}
 if(action==='start'){const p=packet();if(p.blocked)s.error='필수 근거가 없어 전달하지 않았습니다.';else if(s.scenario==='founder'&&!s.envPublished)s.error='이 팀의 환경을 먼저 확정해야 합니다.';else{s.delivered=JSON.parse(JSON.stringify(p));s.priorEdition=s.active;s.priorTeam=s.activeTeam;s.active=s.env;s.activeTeam=p.team;s.started=true;s.view='result';s.events.push('prepare','check','deliver');s.message='가상 준비·확인·전달을 마쳤습니다. 실제 에이전트는 실행하지 않았습니다.';}}
 if(action==='approve'&&s.scenario==='reviewer'){s.approved=true;s.message='정확한 변경의 승인만 기록했습니다. 발행·팀 채택·기존 작업은 그대로입니다.';}
 if(action==='submit-proposal'){if(!s.proposalText.trim())s.error='제안 내용을 입력해 주세요.';else{s.proposal=true;s.message='가상 제안 저장. 원본과 팀의 현재 기준은 유지합니다.';}}
 if(action==='start-founder'){reset('founder',s.model);return;}
 if(action==='create-team'&&!s.teamCreated){if(!s.teamName.trim())s.error='팀 이름을 입력해 주세요.';else{s.teamName=s.teamName.trim();s.teamCreated=true;s.govReady=s.profile==='solo';s.env=0;s.adopted=0;s.active=0;s.view='first';s.events.push('team-created');s.message='T-new-context 팀을 만들었습니다. 아직 업무환경은 없습니다.';}}
 if(action==='peer-response'&&s.teamCreated&&s.profile==='shared'){if(!s.govReady)s.foundationConsent=true;else if(s.envCreated)s.envReviewed=true;s.message='정확한 현재 제안에 대한 가상 동료 응답이 도착했습니다. 실제 동의나 승인이 아닙니다.';}
 if(action==='finalize-foundation'&&s.foundationConsent&&!s.govReady){s.govReady=true;s.events.push('foundation-committed');s.message='가상 초기 구성 확정. 팀의 환경은 아직 0개입니다.';}
 if(action==='create-env'&&s.govReady&&!s.envCreated){s.envCreated=true;s.events.push('environment-draft');s.message='같은 팀에 첫 환경 초안을 만들었습니다. 아직 발행·채택 전입니다.';}
 if(action==='publish-adopt'&&s.envCreated&&(s.profile==='solo'||s.envReviewed)){s.envPublished=true;s.env=1;s.adopted=1;s.events.push('environment-published','team-adopted');s.message='정확한 환경 1판의 발행과 이 팀의 채택을 별도로 기록했습니다. 작업 전달은 아직 전입니다.';}
 render();});
reset();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'읽기 간격',options:[{label:'여유 있게',value:'comfortable'},{label:'간결하게',value:'compact'}]});tweak.addToggle(design,'evidence',{label:'이유·근거를 처음부터 펼치기'});}
})();
</script>
