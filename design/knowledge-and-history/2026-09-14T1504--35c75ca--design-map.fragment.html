  function studioLayout(w) {
    const narrow=w<580;
    if(narrow) return {height:480,nodes:{hub:{x:w/2,y:40,width:w*.7},work:{x:w*.25,y:157,width:w*.44},materials:{x:w*.75,y:157,width:w*.44},review:{x:w*.25,y:286,width:w*.44},team:{x:w*.75,y:286,width:w*.44},sync:{x:w/2,y:424,width:w*.65}}};
    return {height:490,nodes:{hub:{x:w/2,y:222,width:w*.29},work:{x:w/6,y:62,width:w*.28},materials:{x:w*5/6,y:62,width:w*.28},review:{x:w/6,y:340,width:w*.28},team:{x:w*5/6,y:340,width:w*.28},sync:{x:w/2,y:442,width:w*.29}}};
  }
  function showStudio() {
    const item=studioCases[state.studio];
    const nodes=studioNodes;
    const extra=(item.direct||[]).map(e=>[e[0],e[1],false,true]);
    const selected=state.selected.studio==='hub'&&state.studio!=='known'?item.focus:state.selected.studio?[state.selected.studio]:item.focus;
    const edges=nodes.filter(n=>n.id!=='hub').map(n=>['hub',n.id,false,true]).concat(extra);
    draw('ted-studio-map',{nodes,edges,positions:studioLayout,adjacent:false},extra.length?item.focus:selected,id=>{state.selected.studio=id;showStudio();});
    const chosen=state.selected.studio&&state.selected.studio!=='hub'?nodes.find(n=>n.id===state.selected.studio):null;
    root.querySelector('#ted-studio-detail').textContent=chosen?chosen.detail:item.detail;
    root.querySelector('#ted-studio-trace').innerHTML=refs(item.refs);
  }
  root.querySelector('#ted-start-case').addEventListener('change',event=>{state.start=event.target.value;state.selected.start=null;showCase('start');});
  root.querySelector('#ted-authority-case').addEventListener('change',event=>{state.authority=event.target.value;state.selected.authority=null;showCase('authority');});
  root.querySelector('#ted-studio-case').addEventListener('change',event=>{state.studio=event.target.value;state.selected.studio=null;showStudio();});
  const redraw=()=>{showStructure();showCase('start');showCase('authority');showStudio();};
  let scheduled=false;
  const schedule=()=>{if(scheduled)return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;redraw();});};
  new ResizeObserver(schedule).observe(root);
  root.querySelectorAll('[role="tabpanel"]').forEach(panel=>new MutationObserver(schedule).observe(panel,{attributes:true,attributeFilter:['hidden']}));
  redraw();
})();
</script>
