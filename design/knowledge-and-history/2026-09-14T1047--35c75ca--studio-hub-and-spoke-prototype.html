<div id="studio-navigation-hub" aria-label="Studio 진입 화면과 hub & spoke 연결 지도"></div>
<style>
#studio-navigation-hub{--nh-bg:light-dark(#fff,#191f1b);--nh-panel:light-dark(#f5f7f3,#242d26);--nh-fg:light-dark(#293a2f,#e6eee8);--nh-muted:light-dark(#58695d,#b5c3b8);--nh-line:light-dark(#ced9d0,#49584c);--nh-accent:light-dark(#346448,#b1ddbd);--nh-on:light-dark(#fff,#213c29);--nh-tint:light-dark(#eaf3e9,#2a402e);--nh-pad:24px;font:14px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--nh-fg);background:var(--nh-bg);border:1px solid var(--nh-line);border-radius:10px;box-sizing:border-box;width:100%;overflow-wrap:anywhere;isolation:isolate}
#studio-navigation-hub *{box-sizing:border-box}#studio-navigation-hub h1,#studio-navigation-hub h2,#studio-navigation-hub h3,#studio-navigation-hub p{margin:0;color:inherit}#studio-navigation-hub h1{font-size:23px;line-height:1.4;font-weight:600;letter-spacing:-.4px}#studio-navigation-hub h2{font-size:18px;line-height:1.5;font-weight:600}#studio-navigation-hub h3{font-size:14px;font-weight:600}#studio-navigation-hub button,#studio-navigation-hub select{font:inherit;color:inherit;cursor:pointer;min-height:36px}#studio-navigation-hub button:disabled{opacity:.5;cursor:default}#studio-navigation-hub .nh-bar{background:var(--nh-panel);padding:12px 16px;border-bottom:1px solid var(--nh-line);border-radius:10px 10px 0 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}#studio-navigation-hub .nh-bar label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}#studio-navigation-hub select{padding:5px 8px;border:1px solid var(--nh-line);border-radius:5px;background:var(--nh-bg);max-width:100%;font-size:12px}#studio-navigation-hub .nh-toggle{display:flex;gap:5px;flex-wrap:wrap}#studio-navigation-hub .nh-toggle button{background:var(--nh-bg);border:1px solid var(--nh-line);border-radius:5px;padding:5px 10px;font-size:12px}#studio-navigation-hub .nh-toggle button[aria-pressed=true]{background:var(--nh-accent);color:var(--nh-on);border-color:var(--nh-accent)}#studio-navigation-hub .nh-content{padding:var(--nh-pad)}#studio-navigation-hub .nh-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}#studio-navigation-hub .nh-kicker{font-size:11px;letter-spacing:1px;color:var(--nh-muted);margin-bottom:5px}#studio-navigation-hub .nh-sub{color:var(--nh-muted);margin-top:7px}#studio-navigation-hub .nh-small{font-size:12px;color:var(--nh-muted)}#studio-navigation-hub .nh-button{background:var(--nh-bg);border:1px solid var(--nh-line);border-radius:5px;padding:7px 12px;text-align:left;font-weight:500}#studio-navigation-hub .nh-primary{background:var(--nh-accent);color:var(--nh-on);border-color:var(--nh-accent)}#studio-navigation-hub .nh-link{border:0;background:transparent;padding:4px 0;text-align:left;color:var(--nh-accent);text-decoration:underline;text-underline-offset:3px}#studio-navigation-hub .nh-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}#studio-navigation-hub .nh-arrival{display:grid;grid-template-columns:1fr auto 1.4fr;gap:14px;align-items:center;background:var(--nh-panel);padding:14px 16px;border-radius:7px;margin:18px 0 12px;font-size:13px}#studio-navigation-hub .nh-arrival strong{font-weight:600}#studio-navigation-hub .nh-map{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.13fr) minmax(0,1fr);grid-template-rows:auto auto auto;gap:24px 30px;padding:18px 0 12px;align-items:center}#studio-navigation-hub .nh-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}#studio-navigation-hub .nh-node{position:relative;z-index:1;min-width:0;background:var(--nh-bg);border:1px solid var(--nh-line);border-radius:9px;padding:16px;text-align:left;min-height:116px}#studio-navigation-hub .nh-node strong{font-size:15px;display:block;font-weight:600;line-height:1.5;margin:4px 0}#studio-navigation-hub .nh-node small{display:block;font-size:11px;color:var(--nh-muted);margin-top:7px}#studio-navigation-hub .nh-node[aria-pressed=true]{border:2px solid var(--nh-accent);padding:15px;background:var(--nh-tint)}#studio-navigation-hub .nh-node-work{grid-column:1;grid-row:1}#studio-navigation-hub .nh-node-materials{grid-column:3;grid-row:1}#studio-navigation-hub .nh-node-review{grid-column:1;grid-row:2}#studio-navigation-hub .nh-node-team{grid-column:3;grid-row:2}#studio-navigation-hub .nh-node-sync{grid-column:2;grid-row:3}#studio-navigation-hub .nh-node-hub{grid-column:2;grid-row:2;background:var(--nh-accent);color:var(--nh-on);border-color:var(--nh-accent);padding:21px 17px;text-align:center;min-height:136px}#studio-navigation-hub .nh-node-hub strong{font-size:19px;margin:6px 0}#studio-navigation-hub .nh-node-hub small{color:inherit}#studio-navigation-hub .nh-map-caption{font-size:12px;color:var(--nh-muted);padding-top:8px}#studio-navigation-hub .nh-detail{border-top:1px solid var(--nh-line);padding-top:20px;margin-top:18px}#studio-navigation-hub .nh-detail p{margin-top:8px}#studio-navigation-hub .nh-route{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:15px 0}#studio-navigation-hub .nh-route button{background:var(--nh-panel);border:1px solid var(--nh-line);border-radius:5px;padding:7px 10px;font-size:12px;text-align:left}#studio-navigation-hub .nh-route button[aria-current=page]{background:var(--nh-accent);border-color:var(--nh-accent);color:var(--nh-on)}#studio-navigation-hub .nh-jumps{display:flex;gap:7px;flex-wrap:wrap;margin:11px 0}#studio-navigation-hub .nh-jumps button{border:1px dashed var(--nh-line);background:var(--nh-bg);padding:7px 10px;border-radius:5px;font-size:12px;text-align:left}#studio-navigation-hub .nh-preview{padding:17px;background:var(--nh-panel);border-radius:7px;margin-top:16px}#studio-navigation-hub .nh-preview h3{margin-bottom:7px}#studio-navigation-hub .nh-preview .nh-actions{margin-top:13px}#studio-navigation-hub .nh-list{margin:12px 0;padding-left:20px}#studio-navigation-hub .nh-list li{margin:7px 0}#studio-navigation-hub .nh-homebar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--nh-line)}#studio-navigation-hub .nh-homegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}#studio-navigation-hub .nh-homecard{padding:20px;background:var(--nh-bg);border:1px solid var(--nh-line);border-radius:8px;text-align:left}#studio-navigation-hub .nh-homecard strong{display:block;font-weight:600;font-size:18px;margin-bottom:7px}#studio-navigation-hub .nh-homecard span{display:block;font-size:13px;color:var(--nh-muted)}#studio-navigation-hub .nh-homeutilities{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--nh-line)}#studio-navigation-hub .nh-note{padding:12px 14px;background:var(--nh-tint);border-radius:6px;margin-top:18px;font-size:13px}#studio-navigation-hub .nh-audit{margin-top:16px;border-top:1px solid var(--nh-line);padding-top:12px}#studio-navigation-hub summary{cursor:pointer;font-weight:500}#studio-navigation-hub .nh-footer{padding:12px var(--nh-pad);border-top:1px solid var(--nh-line);font-size:12px;color:var(--nh-muted)}#studio-navigation-hub .nh-screenbadge{font-size:11px;color:var(--nh-muted);display:block;margin-bottom:6px}#studio-navigation-hub .nh-back{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--nh-line)}
@media(max-width:600px){#studio-navigation-hub{--nh-pad:16px!important}#studio-navigation-hub .nh-arrival{grid-template-columns:1fr;gap:7px}#studio-navigation-hub .nh-arrival>span{display:none}#studio-navigation-hub .nh-map{grid-template-columns:1fr 1fr;grid-template-rows:auto;gap:12px;padding-top:14px}#studio-navigation-hub .nh-node-hub{grid-column:1/-1;grid-row:1;min-height:108px}#studio-navigation-hub .nh-node-work{grid-column:1;grid-row:2}#studio-navigation-hub .nh-node-materials{grid-column:2;grid-row:2}#studio-navigation-hub .nh-node-review{grid-column:1;grid-row:3}#studio-navigation-hub .nh-node-team{grid-column:2;grid-row:3}#studio-navigation-hub .nh-node-sync{grid-column:1/-1;grid-row:4;min-height:80px}#studio-navigation-hub .nh-lines{display:none}#studio-navigation-hub .nh-node{padding:12px;min-height:125px}#studio-navigation-hub .nh-node[aria-pressed=true]{padding:11px}#studio-navigation-hub .nh-node strong{font-size:14px}#studio-navigation-hub .nh-node-hub strong{font-size:18px}#studio-navigation-hub .nh-homegrid{grid-template-columns:1fr}#studio-navigation-hub .nh-bar label{width:100%}}
@media(pointer:coarse){#studio-navigation-hub button,#studio-navigation-hub select,#studio-navigation-hub summary{min-height:44px}}
</style>
<script>
(() => {
const root=document.getElementById('studio-navigation-hub');
const design={density:'comfortable'};
const groups={
work:{label:'일 시작·계속·인계',question:'지금 할 일에 맞는 기준',ids:['W01','W09'],desc:'현재 작업에 필요한 지침·근거·결정을 확인하고, 실제 수신자에게 전달합니다.',back:'근거나 인계 대상을 확인한 뒤 준비하던 작업으로 돌아옵니다.'},
materials:{label:'환경·자료 만들고 고치기',question:'우리 팀이 함께 쓰는 내용',ids:['W02','W03','W04','W10'],desc:'환경의 구성과 각 원본을 탐색합니다. 지침·지식·결정은 각 의미와 소유자에 맞게 편집합니다.',back:'검토가 끝나면 수정하던 원본·환경과 그 결과로 돌아옵니다.'},
review:{label:'변경 검토·승인',question:'내 판단이 필요한 변경',ids:['W05'],desc:'정확한 변경과 영향을 확인합니다. 승인·발행·팀 채택·작업 사용을 구분합니다.',back:'검토 요청이나 원래 수정 대상에 결과와 남은 담당자를 표시합니다.'},
team:{label:'팀 만들고 관리하기',question:'구성원·권한·팀 수명주기',ids:['W06','W07'],desc:'팀 생성·참여·조회·설정 변경·인계·보관·종료를 관리합니다.',back:'같은 팀 ID를 유지해 환경 관리로 이어갑니다. 새 팀에는 처음부터 환경이 있다고 가정하지 않습니다.'},
sync:{label:'자료 교환·문제 해결',question:'로컬·공유 전·누락·복구',ids:['W08'],desc:'P2P 사본과 선택적인 GitHub 경로로 자료를 교환하고 불확실한 결과를 확인합니다.',back:'자료를 받았으면 원래 작업·수신자의 준비 상태를 다시 확인합니다. 자동으로 사용을 시작하지 않습니다.'}
};
const screens={
W01:{name:'작업 기준 확인',group:'work',body:'선택한 팀·환경, 이번 작업의 지침·지식·현재 결정과 미결정 사항을 함께 봅니다.',actions:[['근거 확인','W03'],['결정 이유','W04'],['부족한 자료 해결','W08'],['수신자·인계','W09']]},
W02:{name:'환경 탐색·구성',group:'materials',body:'여러 환경 중 선택한 환경과 원본의 정확한 판을 봅니다. 원본 지침 편집은 해당 소유자 경로로 직접 열립니다.',actions:[['지식 원본','W03'],['결정 원본','W04'],['검색·일괄 작업','W10'],['구성 변경 검토','W05'],['이 환경으로 준비','W01']]},
W03:{name:'업무 지식·근거·관계',group:'materials',body:'안정된 원칙과 바뀌는 기준, 조건·예외·기간·근거를 함께 봅니다. 온톨로지와 문항·렌즈 검토가 이어집니다.',actions:[['수정 제안 검토','W05'],['관련 결정','W04']]},
W04:{name:'결정·병행 업무 흐름',group:'materials',body:'현재 선택과 열린 질문에서 기록된 이유·대안·결과·다른 업무 흐름의 정정을 따라갑니다.',actions:[['정정·새 결정 검토','W05'],['관련 근거','W03']]},
W05:{name:'정확한 변경 검토',group:'review',body:'요청의 대상·원문·변경·영향과 현재 계정의 권한을 확인합니다. 승인은 실행·채택 완료를 의미하지 않습니다.',actions:[['근거 원문','W03'],['관련 환경','W02']]},
W06:{name:'팀 생성',group:'team',body:'이름·초기 책임·P2P 기본·GitHub 연결 추천·승인 정책을 정합니다. 생성과 초기 동의, 첫 환경은 다른 단계입니다.',actions:[['생성 후 팀 관리','W07']]},
W07:{name:'팀 조회·변경·종료',group:'team',body:'구성원·기기·권한·연결·소유권·보관·복원·종료를 관리합니다. 탈퇴와 로컬 제거는 팀 종료와 구분합니다.',actions:[['첫 환경·기존 환경','W02'],['새 팀 만들기','W06'],['권한·정책 변경 검토','W05'],['보관·복구 상태','W08']]},
W08:{name:'교환·사본·결과 복구',group:'sync',body:'로컬에서 가능한 일, 아직 보낼 것, 누락된 본문, 불확실한 실행 결과를 구분합니다. GitHub 없이도 허용된 P2P 경로를 사용합니다.',actions:[]},
W09:{name:'수신자·인계·실제 전달',group:'work',body:'이 내용을 받을 실제 작업·하위 작업의 권한과 본문·문맥을 확인합니다. 부모의 전달 기록으로 대체하지 않습니다.',actions:[['전달할 기준','W01'],['수신자 준비 문제 해결','W08']]},
W10:{name:'검색·일괄 가져오기',group:'materials',body:'허용된 범위에서 소유자·판·적용 조건을 확인해 선택합니다. 항목별 완료·실패·미확인 결과와 재개 경로를 유지합니다.',actions:[['원본 열기','W03'],['가져오기 변경 검토','W05']]}
};
let s={view:'map',arrival:'known',selected:'work',current:null,trail:[],origin:'Studio 홈',invite:false,notice:'지도는 화면 이동 관계입니다. 저장 구조나 모든 작업의 필수 순서를 뜻하지 않습니다.'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,action,primary=false,extra='')=>`<button type="button" class="nh-button${primary?' nh-primary':''}" data-action="${action}" ${extra}>${label}</button>`;
const L=(label,action,extra='')=>`<button type="button" class="nh-link" data-action="${action}" ${extra}>${label}</button>`;
const route=(label,id,primary=false)=>B(label,'screen',primary,`data-id="${id}"`);
const head=(title,sub)=>`<div class="nh-head"><div><div class="nh-kicker">STUDIO · NAVIGATION STUDY</div><h1>${title}</h1><p class="nh-sub">${sub}</p></div></div>`;
function arrival(){const a={known:['알려진 팀·환경이 있음','선택한 팀의 Studio 홈','팀·환경 맥락을 확인하고 원하는 일로 진입'],none:['팀도 초대도 없는 첫 방문','팀 만들기 / 초대받아 참여','공동 운영 준비 후 첫 환경을 별도로 구성'],link:['초대·검토 요청으로 접속','권한 확인 후 해당 대상에 직접 진입','홈을 먼저 방문할 필요 없음'],host:['기존 호스트에서 작업 이어감','W01 작업 기준 / W09 수신자','기존 작업 맥락과 실제 수신자를 유지']}[s.arrival];return `<div class="nh-arrival"><div><strong>${a[0]}</strong></div><span aria-hidden="true">→</span><div><strong>${a[1]}</strong><br><span class="nh-small">${a[2]}</span></div></div>`;}
function drawMap(){return head('진입점에서 다섯 갈래로','홈은 갈 곳을 찾는 중심입니다. 작업 중에는 필요한 화면으로 바로 연결됩니다.')+arrival()+`<div class="nh-map" aria-label="Studio 홈과 다섯 업무 갈래"><svg class="nh-lines" aria-hidden="true"></svg>${Object.entries(groups).map(([id,g])=>`<button type="button" class="nh-node nh-node-${id}" data-node="${id}" data-action="spoke" data-id="${id}" aria-pressed="${s.selected===id}"><span class="nh-small">${g.question}</span><strong>${g.label}</strong><small>${g.ids.join(' · ')}</small></button>`).join('')}<button type="button" class="nh-node nh-node-hub" data-node="hub" data-action="show-home"><small>선택한 팀·환경</small><strong>Studio 홈</strong><small>무엇을 하려고 왔나요?<br>진입 화면 보기 →</small></button></div><p class="nh-map-caption">실선 ↔ 홈에서 열기·홈으로 돌아오기 &nbsp; / &nbsp; 아래 바로가기는 홈을 거치지 않는 연결</p>${branch()}`;}
function branch(){const g=groups[s.selected];return `<section class="nh-detail"><h2>${g.label}</h2><p>${g.desc}</p><div class="nh-route">${g.ids.map(id=>`<button type="button" data-action="screen" data-id="${id}" ${s.current===id?'aria-current="page"':''}>${id} ${screens[id].name}</button>`).join('')}</div><p class="nh-small">${g.back}</p>${s.current?screenPreview():`<div class="nh-preview"><h3>이 갈래에서 열 화면을 선택하세요</h3><p class="nh-small">기존 와이어프레임 번호를 그대로 연결했습니다. 화면 이동은 실제 생성·승인·전달이 아닙니다.</p></div>`}<details class="nh-audit"><summary>주요 바로가기와 돌아오는 길</summary><div class="nh-jumps">${[['작업 → 근거 → 원래 작업','W01','W03'],['편집 → 검토 → 원래 편집','W02','W05'],['수신자 → 복구 → 준비 재확인','W09','W08'],['팀 생성 → 관리 → 첫 환경','W06','W07']].map(([label,from,to])=>`<button type="button" data-action="journey" data-from="${from}" data-to="${to}">${label}</button>`).join('')}</div><p class="nh-small">출발 화면·대상·초안·요청 ID를 보존합니다. 다른 팀의 자료를 열었다고 작업 팀을 바꾸지 않습니다.</p></details></section>`;}
function screenPreview(){const base=screens[s.current];const p=s.invite&&s.current==='W07'?{name:'초대 확인·참여',body:'초대가 가리키는 팀 ID·초대 대상·제안된 역할·유효성을 확인합니다. 동의와 구성원 등록 확정은 별개이며, 참여 전에는 허용된 초대 정보만 볼 수 있습니다.',actions:[]}:base;return `<section class="nh-preview"><span class="nh-screenbadge">현재 위치 · ${s.current} / ${p.name}</span><h3>${p.name}</h3><p>${p.body}</p><div class="nh-actions">${p.actions.map(([label,id])=>route(label,id)).join('')}${s.current==='W02'?B('Instructions 원본 편집','instruction'):''}</div>${s.current==='W08'?'<p class="nh-small">복구 결과는 원래 준비 화면에 돌려줍니다. 자동 시작하지 않습니다.</p>':''}<div class="nh-back"><div class="nh-small">출발점: ${esc(s.origin)}<br>이동: ${[...s.trail,s.current].map(x=>x==='home'?'Studio 홈':x==='entry'?'진입 화면':x).join(' → ')}</div><div class="nh-actions">${B(s.trail.length?'직전 맥락으로 돌아가기':'갈래로 돌아가기','back')}${L('Studio 홈','home')}</div></div></section>`;}
function entry(){if(s.current)return head(s.invite&&s.current==='W07'?'초대 확인·참여':screens[s.current].name,'직접 연결된 화면의 역할과 다음 경로입니다. 실제 업무 데이터는 변경하지 않습니다.')+screenPreview();if(s.arrival==='none')return `<div class="nh-homebar"><strong>agent-bios Studio</strong><span class="nh-small">현재 참여한 팀 없음</span></div>${head('함께 사용할 환경을 준비하세요','새 팀을 만들거나, 기존 팀의 초대를 통해 참여할 수 있습니다.')}<div class="nh-homegrid"><button type="button" class="nh-homecard" data-action="screen" data-id="W06"><strong>팀 만들기</strong><span>P2P 기본 · GitHub 연결 추천<br>초기 책임과 운영 방식을 함께 설정</span></button><button type="button" class="nh-homecard" data-action="invite"><strong>초대받은 팀 참여</strong><span>초대의 팀·대상·역할 확인<br>동의와 구성원 등록은 별도</span></button></div><div class="nh-note">팀 생성·참여가 끝나도 첫 업무환경은 아직 없을 수 있습니다. 그때는 환경 만들기(W02)로 안내합니다.</div>`;
if(s.arrival==='link')return `<div class="nh-homebar"><strong>agent-bios Studio</strong><span class="nh-small">직접 받은 링크 · 대상과 권한 확인</span></div>${head('받은 일로 바로 들어갑니다','Studio 홈을 거치는 대신 요청된 대상과 가능한 동작을 확인합니다.')}<div class="nh-homegrid"><button type="button" class="nh-homecard" data-action="screen" data-id="W05"><strong>변경 검토 요청 열기</strong><span>정확한 요청·범위·현재 권한을 확인<br>승인과 발행을 구분</span></button><button type="button" class="nh-homecard" data-action="invite"><strong>팀 초대 확인</strong><span>같은 팀 ID로 참여<br>가입 전에는 허용된 초대 내용만 표시</span></button></div>`;
if(s.arrival==='host')return `<div class="nh-homebar"><strong>agent-bios · 기존 작업에서</strong><span class="nh-small">제품 개발팀 / 개발 점검 기본</span></div>${head('작업하던 맥락에서 이어갑니다','Studio 홈을 열거나 새 작업을 등록할 필요는 없습니다.')}<div class="nh-homegrid"><button type="button" class="nh-homecard" data-action="screen" data-id="W01"><strong>이 작업의 기준 확인</strong><span>현재 지침·근거·결정과 미해결 사항</span></button><button type="button" class="nh-homecard" data-action="screen" data-id="W09"><strong>인계·수신자 확인</strong><span>실제 받을 대상의 본문·권한·문맥 확인</span></button></div>`;
return `<div class="nh-homebar"><div><strong>agent-bios Studio</strong><div class="nh-small">제품 개발팀 · 개발 점검 기본</div></div>${route('다른 팀·환경 선택','W02')}</div>${head('어떤 일을 하시겠어요?','선택한 환경을 살펴보거나, 현재 작업에 맞는 기준으로 이어갑니다.')}<div class="nh-homegrid"><button type="button" class="nh-homecard" data-action="screen" data-id="W01"><strong>작업 기준 확인·계속하기</strong><span>이 일의 방법·근거·결정부터 확인<br>필요한 경우 인계할 수신자까지</span></button><button type="button" class="nh-homecard" data-action="screen" data-id="W02"><strong>환경·자료 살펴보기</strong><span>공유 환경 구성과 지침·지식·결정<br>작업 등록 없이 직접 찾고 관리</span></button></div><div class="nh-homeutilities">${route('변경 검토','W05')}${route('팀 관리','W07')}${route('자료 교환·문제 해결','W08')}</div><div class="nh-note">로컬에서 준비된 기준을 사용할 수 있습니다. GitHub 교환 대기는 별도로 확인합니다.</div><details class="nh-audit"><summary>홈에 표시할 상태의 기준</summary><p class="nh-small">실제 사용자에게 해당되는 요청과 제한만 표시합니다. 여기의 버튼 수·우선순위는 검토안이며, 항상 전체 관리 권한이 있다는 뜻은 아닙니다.</p></details>`;}
function openScreen(id){if(!screens[id])return;if(id!=='W07')s.invite=false;if(!s.current){s.origin=s.view==='entry'?(s.arrival==='known'?'Studio 홈':s.arrival==='host'?'기존 작업':s.arrival==='link'?'직접 받은 요청':'첫 방문'):'Studio 홈';s.trail=[s.view==='entry'&&s.arrival!=='known'?'entry':'home'];}else s.trail.push(s.current);s.current=id;s.selected=screens[id].group;s.notice=`${id} ${screens[id].name} 경로를 열었습니다. 실제 가입·승인·전달은 수행하지 않았습니다.`;}
function drawLines(){const area=root.querySelector('.nh-map'),svg=root.querySelector('.nh-lines');if(!area||!svg)return;const a=area.getBoundingClientRect(),hub=root.querySelector('[data-node="hub"]').getBoundingClientRect();const center=r=>({x:r.left-a.left+r.width/2,y:r.top-a.top+r.height/2});const origin=center(hub);svg.setAttribute('viewBox',`0 0 ${a.width} ${a.height}`);svg.innerHTML=`<defs><marker id="nh-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="context-stroke"></path></marker></defs>`;for(const id of Object.keys(groups)){const r=root.querySelector(`[data-node="${id}"]`).getBoundingClientRect(),c=center(r),dx=c.x-origin.x,dy=c.y-origin.y;const scale=(w,h)=>Math.min(Math.abs(dx)>0?w/2/Math.abs(dx):Infinity,Math.abs(dy)>0?h/2/Math.abs(dy):Infinity);const t0=scale(hub.width,hub.height),t1=scale(r.width,r.height);const el=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [k,v] of Object.entries({x1:origin.x+dx*t0,y1:origin.y+dy*t0,x2:c.x-dx*t1,y2:c.y-dy*t1,stroke:s.selected===id?'var(--nh-accent)':'var(--nh-line)','stroke-width':s.selected===id?2.5:1.5,'marker-start':'url(#nh-arrow)','marker-end':'url(#nh-arrow)'}))el.setAttribute(k,String(v));svg.appendChild(el);}}
function render(){const a=document.activeElement;const focus=root.contains(a)?{action:a.dataset.action,id:a.dataset.id,view:a.dataset.view,field:a.dataset.field}:{};root.style.setProperty('--nh-pad',design.density==='compact'?'18px':'24px');root.innerHTML=`<div class="nh-bar"><div class="nh-toggle" aria-label="보기"><button type="button" data-action="view" data-view="map" aria-pressed="${s.view==='map'}">연결 지도</button><button type="button" data-action="view" data-view="entry" aria-pressed="${s.view==='entry'}">진입 화면</button></div><label>진입 상황<select data-field="arrival" aria-label="진입 상황">${[['known','알려진 팀·환경'],['none','팀이 없는 첫 방문'],['link','초대·검토 링크'],['host','기존 호스트 작업']].map(([id,label])=>`<option value="${id}" ${s.arrival===id?'selected':''}>${label}</option>`).join('')}</select></label><span class="nh-small">가상 화면 이동 · 실제 작업 실행 없음</span></div><main class="nh-content">${s.view==='map'?drawMap():entry()}</main><footer class="nh-footer" role="status" aria-live="polite">${esc(s.notice)}</footer>`;drawLines();let target=focus.field?root.querySelector(`[data-field="${focus.field}"]`):focus.action?root.querySelector(`[data-action="${focus.action}"]${focus.id?`[data-id="${focus.id}"]`:''}${focus.view?`[data-view="${focus.view}"]`:''}`):null;if(!target&&focus.action)target=root.querySelector('main button');target?.focus({preventScroll:true});}
root.addEventListener('change',e=>{if(e.target.dataset.field==='arrival'){s.arrival=e.target.value;s.invite=false;s.current=null;s.trail=[];s.notice='진입 상황만 바꿔 봅니다. 가입 상태나 실제 권한을 변경하지 않습니다.';render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const action=b.dataset.action;if(action==='view'){s.view=b.dataset.view;s.current=null;s.trail=[];}if(action==='spoke'){s.selected=b.dataset.id;s.current=null;s.trail=[];}if(action==='show-home'){s.view='entry';s.current=null;s.trail=[];}if(action==='screen')openScreen(b.dataset.id);if(action==='home'){s.view='entry';s.current=null;s.trail=[];s.notice='원래 진입 상황으로 돌아왔습니다. 홈 이동으로 팀 가입이나 권한이 생기지는 않습니다.';}if(action==='back'){const previous=s.trail.pop();if(previous&&screens[previous]){s.current=previous;s.selected=screens[previous].group;}else{s.current=null;s.trail=[];}s.notice='직전 맥락으로 돌아왔습니다. 초안·대상·요청 식별자를 보존하는 이동을 뜻합니다.';}if(action==='journey'){s.current=b.dataset.from;s.selected=screens[s.current].group;s.origin=screens[s.current].name;s.trail=[];openScreen(b.dataset.to);}if(action==='invite'){s.invite=true;openScreen('W07');s.notice='초대의 팀 ID·상대·역할을 확인하는 진입 경로입니다. 동의나 구성원 등록을 실행한 것이 아닙니다.';}if(action==='instruction'){s.notice='Instructions 원본 편집은 W02에서 직접 열립니다. 원본 소유자·정확한 판·편집 권한을 유지하며, 환경 구성에서 빼는 동작과 구분합니다.';}render();});
render();
const observer=new ResizeObserver(drawLines);observer.observe(root);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'화면 간격',options:[{label:'기본',value:'comfortable'},{label:'간결하게',value:'compact'}]});}
})();
</script>
