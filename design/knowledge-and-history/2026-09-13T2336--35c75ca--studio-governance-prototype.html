<div id="governed-studio" aria-label="승인과 권한을 포함한 Studio 목업"></div>
<style>
#governed-studio{--gs-bg:light-dark(#fff,#181e1b);--gs-soft:light-dark(#f4f7f4,#222b25);--gs-fg:light-dark(#22342b,#e7efe9);--gs-muted:light-dark(#58695f,#b1c0b5);--gs-line:light-dark(#dce4de,#3a483e);--gs-green:light-dark(#286249,#acdfbe);--gs-on:light-dark(#fff,#1a3524);--gs-tint:light-dark(#edf5ef,#283d2f);--gs-amber:light-dark(#75541a,#e9c886);--gs-alert:light-dark(#fcf5e6,#3b3220);--gs-pad:24px;background:var(--gs-bg);color:var(--gs-fg);border:1px solid var(--gs-line);border-radius:12px;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;width:100%;overflow-wrap:anywhere;box-sizing:border-box;isolation:isolate}
#governed-studio *{box-sizing:border-box}#governed-studio h1,#governed-studio h2,#governed-studio h3,#governed-studio p{margin:0;color:inherit}#governed-studio h1{font-size:24px;font-weight:600;line-height:1.4;letter-spacing:-.5px}#governed-studio h2{font-size:18px;font-weight:600}#governed-studio h3{font-size:14px;font-weight:600}#governed-studio button,#governed-studio input,#governed-studio select,#governed-studio textarea{font:inherit;color:inherit}#governed-studio button{cursor:pointer;min-height:36px}#governed-studio button:disabled{cursor:default;opacity:.5}#governed-studio input,#governed-studio select,#governed-studio textarea{background:var(--gs-bg);border:1px solid var(--gs-line);padding:7px 9px;border-radius:6px;max-width:100%;min-width:0}#governed-studio textarea{width:100%;min-height:95px;resize:vertical}#governed-studio input[type=checkbox]{width:18px;height:18px;accent-color:var(--gs-green)}
#governed-studio .gs-harness{background:var(--gs-soft);padding:10px 16px;border-bottom:1px solid var(--gs-line);border-radius:12px 12px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:12px}#governed-studio .gs-harness label{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#governed-studio .gs-harness select{font-size:12px;padding:4px 6px}#governed-studio .gs-shell{display:grid;grid-template-columns:166px minmax(0,1fr)}#governed-studio aside{padding:22px 10px;background:var(--gs-soft);border-right:1px solid var(--gs-line);border-radius:0 0 0 12px}#governed-studio .gs-brand{padding:0 10px 22px;font-size:19px;font-weight:600}#governed-studio .gs-brand small{font-size:11px;display:block;font-weight:400;color:var(--gs-muted)}#governed-studio nav{display:flex;gap:5px;flex-direction:column}#governed-studio nav button{display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--gs-muted);border-radius:6px;padding:9px 10px;text-align:left}#governed-studio nav button[aria-current=page]{background:var(--gs-tint);color:var(--gs-green);font-weight:600}#governed-studio nav svg{width:16px;height:16px;flex:none}#governed-studio .gs-navgap{height:12px;border-top:1px solid var(--gs-line);margin-top:12px}#governed-studio .gs-workspace{min-width:0}#governed-studio header{padding:17px var(--gs-pad);border-bottom:1px solid var(--gs-line)}#governed-studio .gs-context{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}#governed-studio .gs-context strong{font-weight:500}#governed-studio .gs-editions{font-size:12px;display:flex;gap:10px 20px;flex-wrap:wrap;color:var(--gs-muted);margin-top:9px}#governed-studio .gs-editions b{font-weight:500;color:var(--gs-fg)}#governed-studio main{padding:var(--gs-pad);min-width:0}#governed-studio .gs-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:22px}#governed-studio .gs-kicker{font-size:11px;letter-spacing:1px;color:var(--gs-muted);margin-bottom:6px}#governed-studio .gs-sub{color:var(--gs-muted);margin-top:7px}#governed-studio .gs-small{font-size:12px;color:var(--gs-muted)}#governed-studio .gs-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}#governed-studio .gs-button{border:1px solid var(--gs-line);background:var(--gs-bg);border-radius:6px;padding:7px 12px;text-align:center;font-weight:500}#governed-studio .gs-primary{background:var(--gs-green);border-color:var(--gs-green);color:var(--gs-on)}#governed-studio .gs-link{border:0;background:transparent;padding:4px 0;color:var(--gs-green);text-align:left}#governed-studio .gs-pill{display:inline-block;border-radius:4px;padding:2px 7px;background:var(--gs-soft);font-size:11px;color:var(--gs-muted)}#governed-studio .gs-note{background:var(--gs-tint);color:var(--gs-green);padding:12px 14px;border-radius:7px;margin:16px 0}#governed-studio .gs-warning{background:var(--gs-alert);color:var(--gs-amber)}#governed-studio .gs-section{margin-top:23px}#governed-studio .gs-sectionhead{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}#governed-studio .gs-facts{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px 12px;font-size:13px;margin:17px 0}#governed-studio dt{color:var(--gs-muted)}#governed-studio dd{margin:0}#governed-studio .gs-row{padding:14px 0;border-bottom:1px solid var(--gs-line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}#governed-studio .gs-row strong{font-weight:500}#governed-studio .gs-row small{display:block;color:var(--gs-muted);font-size:12px;margin-top:4px}#governed-studio .gs-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}#governed-studio .gs-field{display:block;margin:15px 0}#governed-studio .gs-field>span{display:block;margin-bottom:6px;font-weight:500}#governed-studio .gs-field input:not([type=checkbox]),#governed-studio .gs-field select{width:100%}#governed-studio .gs-check{display:flex;align-items:center;gap:9px;margin:15px 0}#governed-studio .gs-bottom{padding-top:17px;margin-top:23px;border-top:1px solid var(--gs-line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}#governed-studio .gs-request{display:grid;grid-template-columns:165px minmax(0,1fr);gap:20px}#governed-studio .gs-requestlist{display:flex;gap:8px;flex-direction:column}#governed-studio .gs-requestlist button{border:1px solid var(--gs-line);background:var(--gs-bg);padding:10px;border-radius:6px;text-align:left}#governed-studio .gs-requestlist button[aria-pressed=true]{background:var(--gs-tint);border-color:var(--gs-green)}#governed-studio .gs-detail{min-width:0}#governed-studio details{border-top:1px solid var(--gs-line);padding-top:12px;margin-top:15px}#governed-studio summary{cursor:pointer;font-weight:500;color:var(--gs-green)}#governed-studio details p{margin-top:9px}#governed-studio .gs-flow{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:15px 0;font-size:12px;color:var(--gs-muted)}#governed-studio .gs-flow li{padding:4px 7px;background:var(--gs-soft);border-radius:4px}#governed-studio .gs-flow li[aria-current=step]{background:var(--gs-tint);color:var(--gs-green);font-weight:600}#governed-studio .gs-audit{list-style:none;padding:0;margin:15px 0}#governed-studio .gs-audit li{border-left:2px solid var(--gs-line);padding:0 0 16px 13px}#governed-studio footer{padding:12px var(--gs-pad);border-top:1px solid var(--gs-line);font-size:12px;color:var(--gs-muted)}#governed-studio [data-layout=top] .gs-shell{grid-template-columns:1fr}#governed-studio [data-layout=top] aside{border-right:0;border-bottom:1px solid var(--gs-line);border-radius:0;padding:12px var(--gs-pad)}#governed-studio [data-layout=top] .gs-brand{padding:0 0 10px}#governed-studio [data-layout=top] nav{flex-direction:row;flex-wrap:wrap}#governed-studio [data-layout=top] .gs-navgap{display:none}
@media(max-width:800px){#governed-studio .gs-shell{grid-template-columns:1fr}#governed-studio aside{border-right:0;border-bottom:1px solid var(--gs-line);border-radius:0;padding:12px 16px}#governed-studio .gs-brand{padding:0 0 10px}#governed-studio nav{flex-direction:row;flex-wrap:wrap;gap:3px}#governed-studio nav button{font-size:12px;padding:7px 8px}#governed-studio .gs-navgap{display:none}}
@media(max-width:550px){#governed-studio{--gs-pad:16px!important}#governed-studio .gs-grid,#governed-studio .gs-request{grid-template-columns:1fr}#governed-studio .gs-requestlist{display:grid;grid-template-columns:1fr 1fr}#governed-studio .gs-facts{grid-template-columns:75px minmax(0,1fr)}#governed-studio .gs-field input,#governed-studio .gs-field select,#governed-studio textarea{font-size:16px}#governed-studio .gs-harness label{width:100%}}
@media(pointer:coarse){#governed-studio button,#governed-studio select,#governed-studio summary{min-height:44px}}
</style>
<script>
(() => {
const root=document.getElementById('governed-studio');
const design={layout:'side',density:'comfortable'};
const people={
 author:{name:'민지',label:'기여자',account:'minji',human:true,rights:['read','env.propose','source.propose','memory.propose']},
 reviewer:{name:'지원',label:'내용 승인자',account:'jiwon',human:true,rights:['read','env.review','source.review','memory.review','adopt.review']},
 operator:{name:'서준',label:'발행·채택 담당자',account:'seojun',human:true,rights:['read','env.publish','source.publish','memory.decide','adopt.propose','adopt.execute']},
 admin:{name:'유나',label:'권한 관리자',account:'yuna',human:true,rights:['govern.propose','govern.apply','suspend']},
 guardian:{name:'태호',label:'권한 승인자',account:'taeho',human:true,rights:['govern.review','govern.apply','suspend']},
 agent:{name:'민지의 에이전트',label:'위임받은 기여자',account:'minji',human:false,rights:['read','env.propose','source.propose','memory.propose']},
 viewer:{name:'다현',label:'사용자',account:'dahyun',human:true,rights:['read']}
};
const kinds={env:{label:'환경 새 판 발행',propose:'env.propose',review:'env.review',execute:'env.publish',scope:'제품 개발 환경'},source:{label:'자료 새 버전 발행',propose:'source.propose',review:'source.review',execute:'source.publish',scope:'팀 원본 자료'},memory:{label:'결정 기록 수용',propose:'memory.propose',review:'memory.review',execute:'memory.decide',scope:'결제 안정성 업무 흐름'},adopt:{label:'팀 기준 채택',propose:'adopt.propose',review:'adopt.review',execute:'adopt.execute',scope:'제품 개발팀 채택 기준'},grant:{label:'권한 부여',propose:'govern.propose',review:'govern.review',execute:'govern.apply',scope:'제품 개발 환경 권한'},policy:{label:'승인 정책 변경',propose:'govern.propose',review:'govern.review',execute:'govern.apply',scope:'환경 발행 정책'},resume:{label:'일시 중지 해제',propose:'govern.propose',review:'govern.review',execute:'govern.apply',scope:'제품 개발팀 사용'}};
const rightsNames={'read':'자료 읽기·환경 사용','env.propose':'환경 변경 제안','env.review':'환경 발행 승인','env.publish':'환경 발행 실행','source.propose':'원본 수정 제안','source.review':'원본 발행 승인','source.publish':'원본 발행 실행','memory.propose':'결정·관측 기록 제안','memory.review':'결정 수용 승인','memory.decide':'결정 수용 실행','adopt.propose':'팀 채택 제안','adopt.review':'팀 채택 승인','adopt.execute':'팀 채택 실행','govern.propose':'권한·정책 변경 제안','govern.review':'권한·정책 변경 승인','govern.apply':'승인된 권한·정책 실행','suspend':'신규 작업 일시 중지'};
let s;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,action,primary=false,attrs='')=>`<button type="button" class="gs-button${primary?' gs-primary':''}" data-action="${action}" ${attrs}>${label}</button>`;
const L=(label,action,attrs='')=>`<button type="button" class="gs-link" data-action="${action}" ${attrs}>${label}</button>`;
const tag=label=>`<span class="gs-pill">${label}</span>`;
function reset(){s={actor:'author',area:'environment',requests:[],selected:null,published:3,authorityPublished:3,adopted:3,used:3,epoch:0,grantEpoch:0,policy:{revision:1,required:1},sources:{instructions:5,knowledge:7},extra:{},revoked:{},optional:true,publishedOptional:true,adoptedOptional:true,reason:'출시 확인표는 별도 배포 절차에서 사용하므로 이 환경에서는 제외합니다.',body:'변경의 근거와 적용 범위를 구체적으로 적습니다.',condition:'결제 결과가 확정되지 않은 일시적 오류에 적용',question:'결과가 확정된 요청에도 이 기준을 적용할 수 있는가?',eventType:'decision',recordTarget:'D-018',grantTarget:'author',grantRight:'env.publish',grantExpiry:'2026-09-14T23:59:00+09:00',reviewReason:'변경 범위와 근거를 확인했습니다.',policyRequired:0,mode:'normal',paused:false,prepared:false,log:[],message:'민지로 변경을 제안한 뒤 지원으로 승인하고, 서준으로 발행해 보세요.'};render();}
function can(person,right){return !s.revoked[person+':'+right]&&(people[person].rights.includes(right)||(s.extra[person]||[]).includes(right));}
function who(){return people[s.actor];}
function policyFor(kind){return kind==='env'?s.policy:{revision:1,required:1};}
function expected(kind,payload={}){return kind==='env'?s.epoch:kind==='adopt'?s.adopted:kind==='grant'?s.grantEpoch:kind==='policy'?s.policy.revision:kind==='source'?s.sources[payload.source]:kind==='memory'?s.requests.filter(x=>x.kind==='memory'&&x.state==='committed').length:0;}
function eligible(r,person){return people[person].human&&people[person].account!==r.account&&can(person,kinds[r.kind].review);}
function approvals(r){return r.approvals.filter(a=>eligible(r,a.person));}
function status(r){if(r.state==='unknown')return '결과 확인 중';if(r.state==='committed')return '실행 완료';if(r.state==='rejected')return '반려';if(r.state==='withdrawn')return '철회';if(r.state==='conflict')return '충돌 · 새 요청 필요';if(r.policyRevision!==policyFor(r.kind).revision)return '정책 변경 · 재검토 필요';if(!can(r.author,kinds[r.kind].propose))return '제안 권한 만료';if(approvals(r).length>=r.required)return '승인 충족';return r.approvals.length?'승인 자격 재확인 필요':'검토 대기';}
function log(text){s.log.unshift({actor:who().name,text});s.message=text;}
function request(kind,payload){if(!can(s.actor,kinds[kind].propose)){s.message='이 범위의 변경 제안 권한이 없습니다.';return;}const p=policyFor(kind),r={id:'R-'+String(s.requests.length+1).padStart(3,'0'),kind,payload,author:s.actor,account:who().account,base:expected(kind,payload),policyRevision:p.revision,required:p.required,approvals:[],state:'submitted'};s.requests.push(r);s.selected=r.id;s.area='review';log(`${r.id} ${kinds[kind].label} 요청. 내용과 대상이 고정되었습니다.`);}
function canView(r){return ['grant','policy','resume'].includes(r.kind)?['govern.propose','govern.review','govern.apply'].some(right=>can(s.actor,right)):can(s.actor,'read');}
function current(){const visible=s.requests.filter(canView);return visible.find(r=>r.id===s.selected)||visible[visible.length-1];}
function heading(kicker,title,sub,action=''){return `<div class="gs-head"><div><div class="gs-kicker">${kicker}</div><h1>${title}</h1><p class="gs-sub">${sub}</p></div>${action}</div>`;}
function hint(right){return can(s.actor,right)?`현재 계정은 ${rightsNames[right]} 가능`:`현재 계정에 ${rightsNames[right]} 권한이 없습니다.`;}
function environment(){return heading('WORK ENVIRONMENT','제품 개발 기본 환경','팀의 자료 구성과 변경 절차를 함께 관리합니다.',B('새 작업 준비','prepare',true,can(s.actor,'read')?'':'disabled'))+
 `<div class="gs-note">제안 → 독립 승인 → 권한자 발행 → 별도 팀 채택 → 새 작업 사용</div><div class="gs-grid"><section><h2>팀이 채택한 ${s.adopted}판</h2><div class="gs-row"><div><strong>작업 기본 지침 · 5판</strong><small>필수 · 시작할 때</small></div>${L('열기','nav','data-area="instructions"')}</div><div class="gs-row"><div><strong>결제 서비스 원칙 · 7판</strong><small>필수 · 조건과 예외 포함</small></div>${L('열기','nav','data-area="knowledge"')}</div><div class="gs-row"><div><strong>결제 안정성 + 출시 운영</strong><small>필수 · 결정과 관련 정정 조회</small></div>${L('열기','nav','data-area="memory"')}</div><div class="gs-row"><div><strong>출시 전 확인표</strong><small>${s.adoptedOptional?'포함':'미포함'} · 선택 자료</small></div></div></section><section><h2>새 환경 판 제안</h2><p class="gs-small">원본 자료를 바꾸지 않고 환경의 구성을 바꿉니다.</p><label class="gs-check"><input type="checkbox" data-field="optional" ${s.optional?'checked':''} ${can(s.actor,'env.propose')?'':'disabled'}>출시 전 확인표 포함</label><label class="gs-field"><span>변경 이유</span><textarea data-field="reason" ${can(s.actor,'env.propose')?'':'disabled'}>${esc(s.reason)}</textarea></label><p class="gs-small">${hint('env.propose')} · 정책 ${s.policy.revision}판: ${s.policy.required?'독립된 사람 1명 승인':'별도 승인 없이 권한자가 실행'}</p><div class="gs-bottom">${B('환경 발행 승인 요청','submit-env',true,can(s.actor,'env.propose')?'':'disabled')}</div></section></div>`+
 (s.published>s.adopted?`<div class="gs-note">${s.published}판 발행 완료 · 팀 채택은 ${s.adopted}판입니다.<div class="gs-actions">${B(`${s.published}판 채택 승인 요청`,'submit-adopt',true,can(s.actor,'adopt.propose')?'':'disabled')}<span class="gs-small">${hint('adopt.propose')}</span></div></div>`:'')+
 (s.prepared?`<section class="gs-section"><h2>새 작업 사용 전 확인</h2><p>환경 ${s.adopted}판 · 지침 5판 · 지식 7판 · 결정 M-42까지</p><p class="gs-small">이 목업은 접근·본문·호스트 조건이 충족된 가상 사례입니다. 이전 목업의 상세 미리보기 단계를 축약했습니다.</p><div class="gs-note ${s.paused?'gs-warning':''}">${s.paused?'신규 작업 사용이 일시 중지되어 있습니다.':s.mode==='missing'?'필수 지식에 접근할 수 없습니다.':s.mode==='offline'?'온라인 권한 확인이 필요하여 오프라인 사용을 시작할 수 없습니다.':'가상 필수 자료와 새 문맥 준비 완료'}</div>${B(`${s.adopted}판으로 새 가상 작업 시작`,'use',true,s.paused||s.mode==='missing'||s.mode==='offline'?'disabled':'')}</section>`:'');}
function source(){const knowledge=s.area==='knowledge',key=s.area,label=knowledge?'업무 지식':'작업 지침';if(!can(s.actor,'read'))return heading('SOURCE',label,'이 계정은 권한 운영 메타데이터만 볼 수 있습니다.')+`<div class="gs-note gs-warning">원본 자료 읽기 권한이 없습니다. 팀의 권한 관리 권한으로 본문을 열 수는 없습니다.</div>`;

 `<div class="gs-note">제품 개발팀 · 공유 팀 정책 · 유나/태호가 권한 운영을 나눠 맡습니다. 팀 권한은 다른 소유자의 자료 권한을 늘릴 수 없습니다.</div><details open><summary>현재 권한과 출처</summary>${Object.entries(people).map(([id,p])=>`<div class="gs-row"><div><strong>${p.name} · ${p.label}</strong><small>${[...new Set([...p.rights,...(s.extra[id]||[])])].filter(x=>can(id,x)).map(x=>rightsNames[x]).join(' · ')||'현재 권한 없음'}</small><small>${id==='agent'?'민지의 위임 · 승인 대리 불가':'가상 초기 권한 배정'}${(s.extra[id]||[]).length?' · 추가 권한은 승인된 요청 참조':''}</small></div>${id==='reviewer'?B('환경 승인 권한 회수','revoke-reviewer',false,can(s.actor,'suspend')&&can('reviewer','env.review')?'':'disabled'):''}</div>`).join('')}</details>
 <section class="gs-section"><h2>권한 부여 요청</h2><div class="gs-grid"><label class="gs-field"><span>받을 사람·에이전트</span><select data-field="grantTarget">${Object.entries(people).filter(([id])=>['author','reviewer','agent'].includes(id)).map(([id,p])=>`<option value="${id}" ${s.grantTarget===id?'selected':''}>${p.name}</option>`).join('')}</select></label><label class="gs-field"><span>허용할 행동</span><select data-field="grantRight">${['env.publish','env.review'].map(v=>`<option value="${v}" ${s.grantRight===v?'selected':''}>${rightsNames[v]}</option>`).join('')}</select></label></div><dl class="gs-facts"><dt>범위</dt><dd>제품 개발 환경만 · 원본 발행과 팀 채택 제외</dd><dt>만료</dt><dd>2026.09.14 23:59 KST · 가상 고정 시각</dd><dt>재위임</dt><dd>허용하지 않음</dd></dl>${B('권한 부여 승인 요청','submit-grant',true,can(s.actor,'govern.propose')?'':'disabled')}<p class="gs-small" style="margin-top:8px">${hint('govern.propose')} · 별도 권한 승인자의 검토가 필요합니다.</p></section>

function applyEffect(r){const p=r.payload;if(r.kind==='env'){s.authorityPublished=p.targetEdition;s.epoch++;s.publishedOptional=p.optional;}if(r.kind==='adopt'){s.adopted=p.edition;s.adoptedOptional=p.optional;s.prepared=false;}if(r.kind==='source')s.sources[p.source]++;if(r.kind==='grant'){s.extra[p.target]=[...new Set([...(s.extra[p.target]||[]),p.right])];delete s.revoked[p.target+':'+p.right];s.grantEpoch++;}if(r.kind==='policy'){s.policy={revision:s.policy.revision+1,required:p.required};}if(r.kind==='resume')s.paused=false;}
function execute(r){if(s.requests.some(q=>q.state==='unknown')){s.message='먼저 결과가 불확실한 기존 작업을 확인해 주세요.';return;}if(!r||status(r)!=='승인 충족'||!can(s.actor,kinds[r.kind].execute)){s.message='승인 조건 또는 실행 권한이 충족되지 않았습니다.';return;}if(s.mode==='offline'){log(`${r.id}: 오프라인. 공유 상태를 변경하지 않았습니다.`);return;}if(s.mode==='missing'&&['env','source','adopt'].includes(r.kind)){log(`${r.id}: 필수 자료 접근을 확인할 수 없어 실행하지 않았습니다.`);return;}if(s.mode==='conflict'&&r.kind==='env'){s.epoch++;s.mode='normal';}if(r.base!==expected(r.kind,r.payload)){r.state='conflict';log(`${r.id}: 기준 상태가 달라졌습니다. 후보는 유지하고 새 요청으로 검토해야 합니다.`);return;}r.receipt={id:'OP-'+r.id,outcome:'committed'};if(s.mode==='lost'){r.state='unknown';s.mode='normal';log(`${r.id}: 실행 응답을 받지 못했습니다. 같은 작업의 결과를 확인하세요.`);}else{applyEffect(r);r.state='committed';s.published=s.authorityPublished;log(`${r.id}: ${kinds[r.kind].label} 가상 실행 완료.`);}}
function render(){const active=document.activeElement;const focus=root.contains(active)?{field:active.dataset.field,action:active.dataset.action,area:active.dataset.area,id:active.dataset.id}:{};root.style.setProperty('--gs-pad',design.density==='compact'?'18px':'24px');const nav=[['environment','업무환경','layers'],['instructions','작업 지침','list-checks'],['knowledge','업무 지식','book-open'],['memory','결정 기억','git-branch'],['review','검토·승인','badge-check'],['access','팀·권한','users'],['operations','동기화·기록','history']];let content=s.area==='environment'?environment():['instructions','knowledge'].includes(s.area)?source():s.area==='memory'?memory():s.area==='review'?review():s.area==='access'?access():operations();root.innerHTML=`<div data-layout="${design.layout}"><div class="gs-harness"><span>목업 · 가상 계정 전환 · 실제 권한·승인·저장 없음</span><label>체험 계정<select aria-label="체험 계정" data-field="actor">${Object.entries(people).map(([id,p])=>`<option value="${id}" ${s.actor===id?'selected':''}>${p.name} · ${p.label}</option>`).join('')}</select></label>${L('처음부터','reset')}</div><div class="gs-shell"><aside><div class="gs-brand">Studio<small>agent-bios · 팀 업무환경</small></div><nav aria-label="주요 영역">${nav.map(([id,label,icon],i)=>`${i===4?'<div class="gs-navgap"></div>':''}<button type="button" data-action="nav" data-area="${id}" ${s.area===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${label}</button>`).join('')}</nav></aside><div class="gs-workspace"><header><div class="gs-context"><strong>제품 개발팀 / 제품 개발 기본 환경</strong><span class="gs-small">${who().name} · ${who().label}</span></div><div class="gs-editions"><span>발행 <b data-status="published">${s.published}판</b></span><span>팀 채택 <b data-status="adopted">${s.adopted}판</b></span><span>최근 가상 작업 <b data-status="used">${s.used}판</b></span><span>사용 상태 <b>${s.paused?'일시 중지':'정상'}</b></span></div></header><main>${content}</main><footer role="status" aria-live="polite">${esc(s.message)}</footer></div></div></div>`;if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});let target=focus.field?root.querySelector(`[data-field="${focus.field}"]`):focus.action?root.querySelector(`[data-action="${focus.action}"]${focus.area?`[data-area="${focus.area}"]`:''}${focus.id?`[data-id="${focus.id}"]`:''}`):null;if(!target&&focus.action)target=root.querySelector('main .gs-primary:not(:disabled),main button:not(:disabled)');target?.focus({preventScroll:true});}
root.addEventListener('input',event=>{const f=event.target.dataset.field;if(['reason','body','condition','question','recordTarget','reviewReason'].includes(f))s[f]=event.target.value;});
root.addEventListener('change',event=>{const f=event.target.dataset.field;if(!f||['reason','body','condition','question','recordTarget','reviewReason'].includes(f))return;if(f==='optional')s.optional=event.target.checked;else if(f==='policyRequired')s.policyRequired=Number(event.target.value);else s[f]=event.target.value;if(f==='actor')s.message=`체험 계정만 ${who().name}(으)로 바꿨습니다. 실제로 다른 사람의 권한을 얻는 기능이 아닙니다.`;if(f==='mode')s.prepared=false;render();});
root.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,r=current();if(a==='reset'){reset();return;}if(a==='nav')s.area=b.dataset.area;if(a==='select-request')s.selected=b.dataset.id;
 if(a==='submit-env'){if(s.optional===s.publishedOptional){s.message='발행된 구성과 같습니다. 확인표 포함 여부를 바꿔 주세요.';}else if(!s.reason.trim())s.message='변경 이유를 입력해 주세요.';else request('env',{baseEdition:s.published,targetEdition:s.published+1,optional:s.optional,reason:s.reason});}
 if(a==='submit-source'){if(!s.body.trim()||(s.area==='knowledge'&&(!s.condition.trim()||!s.question.trim())))s.message='본문과 필요한 조건·검증 문항을 입력해 주세요.';else request('source',{source:s.area,body:s.body,condition:s.condition,question:s.question});}
 if(a==='submit-memory'){if(!s.body.trim()||!s.recordTarget.trim())s.message='대상과 기록 내용·근거가 필요합니다.';else request('memory',{eventType:s.eventType,target:s.recordTarget,body:s.body});}
 if(a==='submit-adopt'&&s.published>s.adopted)request('adopt',{edition:s.published,optional:s.publishedOptional});
 if(a==='submit-grant')request('grant',{target:s.grantTarget,right:s.grantRight,expiry:s.grantExpiry});
 if(a==='submit-policy'&&s.policyRequired!==s.policy.required){request('policy',{required:s.policyRequired});if(current()?.kind==='policy')current().policyTargetBase=s.policy.revision;}
 if(a==='approve'&&r&&eligible(r,s.actor)){if(['검토 대기','승인 충족','승인 자격 재확인 필요'].includes(status(r))){if(!r.approvals.some(x=>x.person===s.actor))r.approvals.push({person:s.actor,reason:s.reviewReason});log(`${r.id}: ${who().name}의 승인 기록. 실행은 아직 하지 않았습니다.`);}}
 if(a==='reject'&&r&&eligible(r,s.actor)&&['검토 대기','승인 충족','승인 자격 재확인 필요'].includes(status(r))){if(!s.reviewReason.trim())s.message='반려 이유를 입력해 주세요.';else{r.state='rejected';r.rejection=s.reviewReason;log(`${r.id}: 반려. 수정하려면 새 요청을 제출합니다.`);}}
 if(a==='withdraw'&&r&&r.account===who().account&&!['committed','unknown','rejected','withdrawn'].includes(r.state)){r.state='withdrawn';log(`${r.id}: 제안자가 요청을 철회했습니다.`);}
 if(a==='execute')execute(r);
 if(a==='recover'&&r?.state==='unknown'&&r.receipt){applyEffect(r);r.state='committed';s.published=s.authorityPublished;log(`${r.id}: ${r.receipt.id} 기존 영수증으로 완료 확인. 다시 실행하지 않았습니다.`);}
 if(a==='revoke-reviewer'&&can(s.actor,'suspend')){s.revoked['reviewer:env.review']=true;s.grantEpoch++;log('지원의 환경 승인 권한 회수. 실행 전인 기존 승인도 자격을 다시 확인합니다.');}
 if(a==='pause'&&can(s.actor,'suspend')){s.paused=true;s.prepared=false;log('제품 개발팀 신규 작업 사용 일시 중지. 기존에 전달한 문맥은 삭제하지 않았습니다.');}
 if(a==='submit-resume'&&s.paused)request('resume',{});
 if(a==='prepare'&&can(s.actor,'read')){s.prepared=true;s.message='새 가상 작업의 준비 상태를 확인하세요.';}
 if(a==='use'&&s.prepared&&can(s.actor,'read')&&!s.paused&&!['missing','offline'].includes(s.mode)){s.used=s.adopted;s.prepared=false;log(`${s.adopted}판으로 새 가상 작업 시작. 앞선 작업의 문맥은 유지됩니다.`);}
 render();});
reset();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'layout',{label:'탐색 위치',options:[{label:'왼쪽',value:'side'},{label:'상단',value:'top'}]});tweak.addSelect(design,'density',{label:'화면 밀도',options:[{label:'여유 있게',value:'comfortable'},{label:'간결하게',value:'compact'}]});}
})();
</script>
