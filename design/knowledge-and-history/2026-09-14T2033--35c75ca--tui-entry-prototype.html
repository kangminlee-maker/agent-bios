<div id="tui-entry-study" aria-label="작업 진입 화면 설계"></div>
<style>
#tui-entry-study{--te-bg:light-dark(#fff,#191919);--te-panel:light-dark(#f4f4f2,#252525);--te-text:light-dark(#262626,#e6e6e3);--te-muted:light-dark(#61615d,#b9b9b3);--te-line:light-dark(#cececa,#555550);--te-strong:light-dark(#30302e,#e3e3df);--te-on:light-dark(#fff,#20201e);font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic",monospace;color:var(--te-text);background:var(--te-bg);width:100%;border:1px solid var(--te-line);isolation:isolate;box-sizing:border-box;overflow-wrap:anywhere}
#tui-entry-study *{box-sizing:border-box}
#tui-entry-study h1,#tui-entry-study h2,#tui-entry-study h3,#tui-entry-study p{margin:0;color:inherit}
#tui-entry-study h1{font-size:18px;line-height:1.4;font-weight:500}
#tui-entry-study h2{font-size:15px;font-weight:500}
#tui-entry-study h3{font-size:14px;font-weight:500}
#tui-entry-study button,#tui-entry-study input,#tui-entry-study select{font:inherit;color:inherit}
#tui-entry-study button{min-height:34px;cursor:pointer}
#tui-entry-study button:disabled{opacity:.5;cursor:default}
#tui-entry-study .te-chrome{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:5px 14px;border-bottom:1px solid var(--te-line);background:var(--te-panel)}
#tui-entry-study .te-brand{font-weight:500}
#tui-entry-study .te-small{font-size:12px;color:var(--te-muted)}
#tui-entry-study .te-content{padding:14px 16px}
#tui-entry-study .te-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
#tui-entry-study .te-head p{margin-top:5px;color:var(--te-muted)}
#tui-entry-study .te-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tui-entry-study .te-button{border:1px solid var(--te-line);background:var(--te-bg);padding:6px 11px;border-radius:2px;text-align:left;font-weight:500}
#tui-entry-study .te-primary{background:var(--te-strong);color:var(--te-on);border-color:var(--te-strong)}
#tui-entry-study .te-link{padding:3px 0;background:transparent;border:0;text-decoration:underline;text-underline-offset:3px;text-align:left}
#tui-entry-study .te-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(225px,1fr);gap:24px}
#tui-entry-study[data-layout="single"] .te-grid{grid-template-columns:1fr}
#tui-entry-study .te-section+.te-section{margin-top:10px;padding-top:8px;border-top:1px solid var(--te-line)}
#tui-entry-study .te-sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px}
#tui-entry-study .te-facts{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 12px;margin:0}
#tui-entry-study .te-source-summary{display:grid;grid-template-columns:68px minmax(0,1fr);gap:4px 10px;margin:8px 0 0}
#tui-entry-study .te-source-summary dt{color:var(--te-muted)}
#tui-entry-study dt{color:var(--te-muted)}
#tui-entry-study dd{margin:0;min-width:0}
#tui-entry-study .te-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--te-line)}
#tui-entry-study .te-row:last-child{border-bottom:0}
#tui-entry-study .te-row strong{font-weight:500}
#tui-entry-study .te-row small{display:block;color:var(--te-muted);font-size:12px;margin-top:3px}
#tui-entry-study .te-summary{border-left:1px solid var(--te-line);padding-left:22px;min-width:0}
#tui-entry-study[data-layout="single"] .te-summary{border-left:0;padding-left:0;border-top:1px solid var(--te-line);padding-top:18px}
#tui-entry-study .te-summary h2{margin-bottom:12px}
#tui-entry-study .te-summary p+p{margin-top:10px}
#tui-entry-study .te-summary .te-actions{margin-top:16px}
#tui-entry-study .te-state{border-left:3px solid var(--te-strong);padding:10px 12px;background:var(--te-panel);margin:14px 0}
#tui-entry-study .te-state strong{font-weight:500}
#tui-entry-study .te-steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:0;list-style:none;color:var(--te-muted);font-size:12px}
#tui-entry-study .te-steps li[aria-current="step"]{color:var(--te-text);font-weight:500}
#tui-entry-study .te-form{display:grid;gap:14px}
#tui-entry-study .te-field{display:grid;gap:5px;min-width:0}
#tui-entry-study .te-field input,#tui-entry-study .te-field select{width:100%;max-width:100%;min-width:0;background:var(--te-bg);border:1px solid var(--te-line);border-radius:2px;padding:8px 9px}
#tui-entry-study .te-choices{display:grid;gap:10px}
#tui-entry-study .te-choice{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--te-line);padding:12px;cursor:pointer}
#tui-entry-study .te-choice input{margin:3px 0 0;accent-color:var(--te-strong);flex:none}
#tui-entry-study .te-choice:has(input:checked){background:var(--te-panel);border-color:var(--te-strong)}
#tui-entry-study .te-choice small{display:block;color:var(--te-muted);margin-top:3px}
#tui-entry-study .te-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--te-line);padding-top:16px;margin-top:20px}
#tui-entry-study .te-hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tui-entry-study .te-intent{border:1px solid var(--te-line);padding:14px;background:var(--te-bg);text-align:left;border-radius:2px}
#tui-entry-study .te-intent strong{display:block;font-weight:500}
#tui-entry-study .te-intent span{display:block;font-size:12px;color:var(--te-muted);margin-top:5px}
#tui-entry-study .te-hub .te-intent:first-child{grid-column:1/-1;background:var(--te-panel)}
#tui-entry-study .te-foot{padding:10px 18px;border-top:1px solid var(--te-line);background:var(--te-panel);display:grid;gap:4px;font-size:12px}
#tui-entry-study .te-error{margin-top:14px;border:1px solid var(--te-strong);padding:10px 12px}
#tui-entry-study .te-quote{white-space:pre-wrap;margin:14px 0;padding:12px;border-left:2px solid var(--te-line);background:var(--te-panel)}
@media(max-width:650px){#tui-entry-study .te-grid{grid-template-columns:1fr}#tui-entry-study .te-summary{border-left:0;padding-left:0;border-top:1px solid var(--te-line);padding-top:18px}#tui-entry-study .te-content{padding:16px}#tui-entry-study .te-chrome{padding:10px 14px}#tui-entry-study .te-hub{grid-template-columns:1fr}#tui-entry-study .te-facts{grid-template-columns:65px minmax(0,1fr);gap:8px 10px}#tui-entry-study .te-field input,#tui-entry-study .te-field select{font-size:16px}}
@media(pointer:coarse){#tui-entry-study button,#tui-entry-study select,#tui-entry-study input{min-height:44px}}
</style>
<script>
(function(){
  'use strict';
  const root=document.getElementById('tui-entry-study');
  const design={entry:'host',scenario:'personal',layout:'split'};
  let appliedDesign={...design};
  const clone=value=>JSON.parse(JSON.stringify(value));
  const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cases={
    personal:{label:'첫 개인 시작',team:false,location:'payments · 로컬 레포',checkpoint:'이 범위의 진행 기록 없음',environment:'personal',prior:null},
    team:{label:'팀 환경 선택',team:true,location:'payments · 로컬 레포',checkpoint:'9월 14일 14:20 · 검토 메모 저장',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'},
    empty:{label:'레포 없는 시작',team:false,location:'연결된 레포 없음',checkpoint:'확인된 진행 기록 없음',environment:'personal',prior:null},
    missing:{label:'필수 초기 자료 없음',team:true,location:'payments · 로컬 레포',checkpoint:'9월 14일 14:20 · 검토 메모 저장',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'},
    offline:{label:'오프라인',team:true,location:'payments · 로컬 레포',checkpoint:'9월 12일 · 마지막 로컬 기록',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'},
    unknown:{label:'이전 실행 결과 미확인',team:true,location:'payments · 로컬 레포',checkpoint:'모의 실행 07 · 응답 미확인',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'},
    locked:{label:'잠긴 범위',team:true,location:'payments · 로컬 레포',checkpoint:'보호된 기록',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'},
    denied:{label:'필수 자료 접근 불가',team:true,location:'payments · 로컬 레포',checkpoint:'9월 14일 14:20 · 검토 메모 저장',environment:'team',prior:'이전 세션 04 · 환경 2판 전달 기록'}
  };
  const environments={personal:{name:'개인 기본 자료',state:'개인용 · 조사와 초안에 사용'},reference:{name:'공통 기초 자료',state:'제공된 참고 자료 · 개인 사용'},team:{name:'변경 점검 · 3판',state:'업무팀에서 채택한 기준'},review:{name:'문서 점검 · 1판',state:'업무팀에서 채택한 기준'}};
  const configurations={standard:{name:'기본 실행',model:'도구의 기본 모델',delegation:'추가 작업자 없음',review:'필요할 때 직접 요청'},careful:{name:'검토 강화',model:'설정된 검토 모델',delegation:'추가 검토자 1명',review:'별도 검토 요청 포함'},fast:{name:'반복 작업용',model:'설정된 실행 모델',delegation:'추가 작업자 없음',review:'필요할 때 직접 요청'}};
  let s;
  function resetCase(){
    const example=cases[design.scenario]||cases.personal;
    s={page:design.entry==='host'?'prepare':'home',revision:0,preview:null,result:null,error:'',notice:'선택은 이번 준비에만 반영 · 아직 실행 전',hint:'Tab 이동 · Enter 표시된 동작 · 입력 중 단축키 실행 안 함',recovered:false,unlocked:design.scenario!=='locked',requestSequence:0,source:null,returnPage:'prepare',draft:{environment:example.environment,configuration:'standard',permission:'confirm'},active:example.prior,pending:null};
    if(design.scenario==='unknown')s.pending={id:'모의 실행 07',draft:clone(s.draft),location:example.location,revision:0};
  }
  const currentCase=()=>cases[design.scenario]||cases.personal;
  const locked=()=>!s.unlocked;
  const environment=()=>environments[s.draft.environment];
  const configuration=()=>configurations[s.draft.configuration];
  const scopeName=()=>currentCase().team?'업무팀':'개인 작업';
  function button(label,action,primary=false,extra='',hint=''){
    return '<button type="button" class="te-button'+(primary?' te-primary':'')+'" data-action="'+action+'" '+extra+' data-hint="'+esc(hint||label)+'">'+label+'</button>';
  }
  const link=(label,action,hint='')=>'<button type="button" class="te-link" data-action="'+action+'" data-hint="'+esc(hint||label)+'">'+label+'</button>';
  const header=(title,sub='')=>'<div class="te-head"><div><h1>'+title+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div></div>';
  const facts=rows=>'<dl class="te-facts">'+rows.map(row=>'<dt>'+row[0]+'</dt><dd>'+row[1]+'</dd>').join('')+'</dl>';
  const phases=active=>'<ol class="te-steps" aria-label="현재 단계">'+['작업 준비','예상 결과 확인','모의 결과'].map((label,i)=>'<li'+(i===active?' aria-current="step"':'')+'>'+(i+1)+'. '+label+'</li>').join('<li aria-hidden="true">→</li>')+'</ol>';
  function sources(){
    if(locked())return [];
    const team=currentCase().team;
    const alternate=['reference','review'].includes(s.draft.environment);
    return [
      {id:'instructions',role:'지침',name:team?(alternate?'문서 점검 지침 · 1판':'변경 점검 지침 · 5판'):(alternate?'자료 읽기 지침 · 1판':'기본 작업 지침 · 1판'),owner:team?'업무팀':'제공 자료의 원소유자',status:'본문 준비됨',meta:true,read:true,use:true,body:'확인한 내용과 아직 확인하지 못한 내용을 구분합니다. 참고 자료의 조건을 함께 읽습니다.'},
      {id:'knowledge',role:'지식',name:team?'업무 확인 기준 · 7판':(alternate?'자료 해석 원칙 · 1판':'기초 검토 원칙 · 1판'),owner:team?'업무팀':'제공 자료의 원소유자',status:design.scenario==='denied'?'접근 확인 필요':design.scenario==='missing'&&!s.recovered?'필수 초기 본문 받기 필요':'연결됨 · 업무별 조회 전',meta:design.scenario!=='denied',read:design.scenario!=='denied',use:design.scenario!=='denied',available:design.scenario!=='missing'||s.recovered,body:'근거가 확인된 내용과 해석을 분리합니다. 확인하지 못한 결과를 확정된 사실로 표시하지 않습니다.'},
      {id:'memory',role:'결정 기록',name:team?'팀·레포 결정 자료':'연결한 결정 자료 없음',owner:team?'업무팀':'개인 작업',status:team?'업무별 조회 전':'과거 기록 전체를 확인한 것은 아님',meta:true,read:true,use:true,body:team?'확인된 사실과 미확인 항목을 구분해 남기기로 했습니다. 안내 주기는 아직 정하지 않았습니다.':'이번 환경에 연결한 결정 자료가 없습니다. 과거의 전체 기록이 없다는 뜻은 아닙니다.'}
    ];
  }
  function assessment(){
    if(locked())return {allowed:false,title:'잠금 해제가 필요합니다',reason:'보호된 자료와 이전 결과를 표시하지 않습니다.',action:'unlock'};
    if(s.pending)return {allowed:false,title:'이전 실행의 결과부터 확인하세요',reason:'같은 실행의 결과를 확인한 뒤 새로 준비합니다.',action:'pending'};
    const unavailable=sources().find(source=>!source.meta||!source.read||!source.use);
    if(unavailable)return {allowed:false,title:'필요한 자료를 확인할 권한이 없습니다',reason:'자료의 제목·내용을 대신 표시하지 않습니다.',action:'recovery'};
    const missing=sources().find(source=>source.available===false);
    if(missing)return {allowed:false,title:'필수 초기 자료 확인이 필요합니다',reason:'복구 화면을 여는 것만으로 준비되지는 않습니다.',action:'recovery'};
    return {allowed:true,title:'이 환경으로 시작할 조건을 확인했습니다',reason:(design.scenario==='offline'?'마지막 로컬 기준입니다. ':'')+'구체 업무와 필요한 지식·결정은 시작 후 실제 요청에 따라 확인합니다.'};
  }
  function changed(message){s.revision++;s.preview=null;s.result=null;s.error='';s.notice=message||'준비 초안만 바뀌었습니다. 이전 미리보기는 무효이며 기존 작업은 그대로입니다.';}
  function sourceRows(){return sources().map(source=>'<div class="te-row"><div><strong>'+source.role+'</strong><div>'+esc(source.meta?source.name:'필요한 자료 확인 불가')+'</div><small>'+esc(source.status)+'</small></div>'+(source.meta?button('내용 보기','source',false,'data-source="'+source.id+'"','허용된 본문을 읽습니다. 선택·채택·전달을 수행하지 않습니다.'):button('접근 확인','recovery',false,'','허가된 접근 경로만 확인합니다.'))+'</div>').join('');}
  function activeLine(){return s.active?'기존 작업: '+esc(s.active)+' · 이 화면의 선택으로 바뀌지 않음':'현재 이 예시에서 시작한 실제 작업 없음';}
  function primaryPreparation(){
    if(s.pending)return button('이전 실행 결과 확인','pending',true,'','기존 실행의 식별자를 유지해 결과를 확인합니다. 새 실행이 아닙니다.');
    return button('준비 상태 확인','prepare-check',true,'','환경의 필수 초기 자료·접근·시작 조건을 확인합니다. 현재 업무는 추정하지 않습니다.');
  }
  function prepareView(){
    const status=design.scenario==='offline'?'오프라인 · 9월 12일 로컬 기준 / 이후 변경 미확인':s.pending?'이전 실행 결과 미확인':design.scenario==='empty'?'레포 없이 환경 선택 가능':'아직 실행 전';
    const rows=sources().map(item=>'<dt>'+esc(item.role)+'</dt><dd>'+esc(item.meta?item.name:'필요한 자료 확인 불가')+' · '+esc(item.status)+'</dd>').join('');
    return header('어떤 환경으로 시작할까요?',scopeName()+' · '+status)+'<div class="te-grid"><div><section class="te-section"><div class="te-sectionhead"><h2>현재 확인되는 맥락</h2>'+link('기록 자세히','context-details')+'</div>'+facts([['현재 위치',esc(currentCase().location)],['최근 기록',esc(currentCase().checkpoint)]])+'<p class="te-small">현재 할 일이나 업무 완료를 뜻하지 않습니다.</p>'+'</section><section class="te-section"><div class="te-sectionhead"><h2>업무환경</h2>'+link('환경 선택','edit-environment')+'</div><p>'+esc(environment().name)+' <span class="te-small">· '+esc(environment().state)+'</span></p><dl class="te-source-summary">'+rows+'</dl>'+link('자료 자세히 보기','materials','선택한 자료의 본문과 출처를 엽니다. 선택이나 전달은 하지 않습니다.')+'</section><section class="te-section"><div class="te-sectionhead"><h2>실행 방법</h2>'+link('구성 변경','edit-tools')+'</div>'+facts([['도구 / 대상','Codex CLI / 새 세션 예정'],['구성',esc(configuration().name)+' · '+esc(configuration().delegation)],['파일 변경',s.draft.permission==='confirm'?'변경 전에 사용자 확인':'세션의 명시적 허용 범위만 변경']])+'</section></div><aside class="te-summary"><h2>다음 행동의 결과</h2><p>선택한 환경·접근 조건·실행 설정을 확인합니다.</p><p class="te-small">구체적인 할 일은 세션을 시작한 뒤 정합니다. 업무별 지식·결정 조회도 그 요청에 따릅니다.</p>'+(s.pending?'<div class="te-state">'+esc(s.pending.id)+' · 같은 요청의 결과 확인 필요</div>':'')+'<div class="te-actions">'+primaryPreparation()+'</div>'+(s.active?'<p class="te-small" style="margin-top:14px">'+activeLine()+'</p>':'')+'</aside></div>';
  }

      else{s.requestSequence++;s.result={id:'모의 실행 '+String(s.requestSequence).padStart(2,'0'),draft:clone(s.preview.draft),recovered:false};s.page='result';s.notice='모의 결과만 표시했습니다. 실제 파일·도구·계정·네트워크는 변경하지 않았습니다.';}
    }
    else if(action==='recover-body'){if(design.scenario==='missing'&&!s.recovered&&sources().every(source=>source.read&&source.use)){s.recovered=true;changed('필수 본문의 수신·검증을 모의했습니다. 같은 준비를 다시 확인해야 하며 아직 전달하지 않았습니다.');s.page='prepare';}}
    else if(action==='resolve-unknown'){if(s.pending){s.result={id:s.pending.id,draft:clone(s.pending.draft),recovered:true};s.pending=null;s.page='result';s.notice='같은 실행의 모의 결과를 확인했습니다. 새 실행을 만들지 않았습니다.';}}
    else if(action==='lock'){s.unlocked=false;s.preview=null;s.error='';s.notice='가상 잠금 상태입니다. 기존 작업에 전달된 문맥은 지우지 않습니다.';}
    else if(action==='unlock'){s.unlocked=true;s.preview=null;s.page=design.entry==='host'?'prepare':'home';s.notice='허용된 기기로 재확인한 경우를 모의했습니다. 준비 상태를 새로 확인하세요.';}
    render();
  });
  root.addEventListener('keydown',event=>{
    if(event.target.closest('input,select,textarea,[contenteditable]'))return;
    if(event.key==='Escape'&&!locked()&&!['home','prepare'].includes(s.page)){event.preventDefault();navigate('prepare');render();return;}
    const menu=event.target.closest('[data-menu]');
    if(!menu||!['ArrowDown','ArrowUp'].includes(event.key))return;
    const buttons=[...menu.querySelectorAll('button:not(:disabled)')];const index=buttons.indexOf(document.activeElement);if(index<0)return;event.preventDefault();buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();
  });
  function applyDesign(){
    if(!cases[design.scenario])design.scenario='personal';
    if(design.scenario!==appliedDesign.scenario)resetCase();
    else if(design.entry!==appliedDesign.entry)s.page=design.entry==='host'?'prepare':'home';
    appliedDesign={...design};render();
  }
  resetCase();render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:applyDesign});
    tweak.addSelect(design,'entry',{label:'진입 경로',options:[{label:'도구에서 바로 작업 준비',value:'host'},{label:'일반 작업 관리 홈',value:'studio'}]});
    tweak.addSelect(design,'scenario',{label:'가상 사례',options:Object.entries(cases).map(([value,c])=>({label:c.label,value}))});
    tweak.addSelect(design,'layout',{label:'정보 배치',options:[{label:'두 영역 · 준비와 다음 행동',value:'split'},{label:'한 열 · 읽는 순서대로',value:'single'}]});
  }
})();
</script>
