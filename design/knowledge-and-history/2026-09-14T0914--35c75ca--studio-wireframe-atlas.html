<script>
(() => {
const root=document.getElementById('studio-wireframe-atlas');
const design={density:'comfortable',notes:true};
const frames=[
 {id:'W01',name:'작업 기준 확인·시작',role:'작업자',need:'이 일에 어떤 기준을 써야 하나?',parts:['팀·환경 + 현재 작업','방법·근거·결정','시작 / 부족한 것 해결'],next:'W09',req:'U01–U04 · U09 · U11',gui:'익숙하지 않은 작업자도 대상과 근거를 한곳에서 확인합니다.',tui:'이미 터미널에서 일하는 사용자에게 간결한 요약과 시작 동작이 적합합니다.'},
 {id:'W02',name:'환경 탐색·구성',role:'환경 관리',need:'우리 팀은 무엇을 함께 사용할까?',parts:['환경 목록','세 자료의 정확한 구성','초안 변경 → 검토'],next:'W05',req:'U01–U03 · U10',gui:'목록과 구성 차이를 함께 보며 원본과 환경을 구분합니다.',tui:'정확한 항목을 알고 바꾸는 작업에 적합합니다. 큰 구성은 검색·필터가 필요합니다.'},
 {id:'W03',name:'지식·근거·관계 편집',role:'지식 작성자',need:'어느 조건에서 맞는 지식인가?',parts:['개념·질문 찾기','본문·조건·예외','근거·연결·검증'],next:'W05',req:'U05–U06 · U09 · U14',gui:'긴 본문, 적용 조건, 근거와 연결을 동시에 비교할 수 있습니다.',tui:'한 항목의 폼과 관계 목록은 가능하지만 여러 근거를 번갈아 읽는 부담을 검증해야 합니다.'},
 {id:'W04',name:'여러 업무의 결정 흐름',role:'작업자·결정 작성자',need:'지금의 선택은 왜 이렇게 됐나?',parts:['현재 선택·미결정','업무별 시간축','정정·이유·대안'],next:'W05',req:'U07–U08 · U09',gui:'업무 흐름 사이의 정정·대체 관계를 연결해서 읽습니다.',tui:'현재 결정과 한 경로는 읽기 쉽습니다. 여러 경로 비교는 목록을 오가는 비용이 큽니다.'},
 {id:'W05',name:'변경 검토·승인',role:'검토자',need:'무엇이 바뀌고, 내 승인은 어디까지인가?',parts:['대상·정확한 변경','이전 / 제안 + 영향','승인 / 남은 실행'],next:'W02',req:'U10 · U12 · U14',gui:'원문·제안·영향을 함께 비교하는 검토에 유리한 후보입니다.',tui:'작은 텍스트 변경은 통합 diff와 명시적 대상·효과로 충분할 수 있습니다.'},
 {id:'W06',name:'팀 만들기',role:'새 팀 책임자',need:'누구와 어떤 방식으로 공유할까?',parts:['이름·초기 책임','P2P + GitHub 추천','초기 정책 / 남은 동의'],next:'W07',req:'U02 · U12–U13 · U15–U17',gui:'드문 설정 작업을 읽을 수 있는 선택지와 결과 요약으로 제공합니다.',tui:'키보드 폼도 가능하며 헤드리스 설치에 필요합니다. 용어 이해 부담은 별도 검증합니다.'},
 {id:'W07',name:'팀 조회·수정·종료',role:'팀 운영자',need:'이 동작은 팀 전체에 영향을 주나?',parts:['팀과 상태','구성원·설정·권한','탈퇴 / 보관 / 종료'],next:'W05',req:'U12–U14 · U18',gui:'드문 관리 동작과 영향 범위를 한 화면에서 구분합니다.',tui:'명시적 대상 확인과 권한 검토로 지원합니다. 파괴적 동작은 축약 키 하나로 실행하지 않습니다.'},
 {id:'W08',name:'동기화·사본 복구',role:'작업자·운영자',need:'무엇이 내 기기에 있고, 무엇이 공유 전인가?',parts:['사용 가능 / 교환 대기','보낼 것·받을 것','충돌·누락·사본'],next:'W01',req:'U14–U18',gui:'사용 가능 여부와 교환 상태, 사본의 실제 보유 범위를 비교합니다.',tui:'SSH·일괄 실행·진단 로그와 패키지 교환에 잘 맞습니다. GUI 없이 복구 가능해야 합니다.'},
 {id:'W09',name:'실제 수신자·인계 확인',role:'작업자·에이전트',need:'누가 어떤 기준을 실제로 받았나?',parts:['원래 작업 / 받을 작업','본문·권한·문맥','전달 / 결과·인계'],next:'W01',req:'U01 · U08–U09 · U11',gui:'받는 대상과 현재 문맥의 차이를 명시적으로 확인합니다.',tui:'터미널과 기존 호스트의 짧은 검사·실행 경로가 적합합니다. 부모의 기록을 자식에게 재사용하지 않습니다.'},
 {id:'W10',name:'검색·일괄 가져오기',role:'자료 관리자',need:'올바른 자료를 찾아 필요한 것만 옮길 수 있나?',parts:['범위·조건 검색','소유자·판·선택','항목별 결과·재개'],next:'W05',req:'U06 · U10 · U14–U17',gui:'여러 항목의 소유·판·오류를 고르며 비교하는 데 유리합니다.',tui:'반복·대량 처리와 재개는 적합합니다. 선택과 실패가 텍스트 결과로 명확해야 합니다.'}
];
const frame=()=>frames.find(x=>x.id===s.id)||frames[0];
let s={id:'W01',surface:'gui',overview:true,variant:'normal',message:'화면을 열어 GUI/TUI 대응안을 비교하세요. 버튼은 설계 설명을 열거나 다음 와이어프레임으로 이동합니다.',note:null,history:[],knowledge:'rule',memory:'D18',teamSection:'overview',teamName:'제품 개발팀',repo:'github',governance:'shared',search:'',newText:'같은 요청의 상태를 먼저 확인한다. 결과 미확정 거래는 별도로 표시한다.',lastClicked:null};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,action='inspect',primary=false,attrs='')=>`<button type="button" class="wf-button${primary?' wf-primary':''}" data-action="${action}" ${attrs}>${label}</button>`;
const L=(label,action='inspect',attrs='')=>`<button type="button" class="wf-link" data-action="${action}" ${attrs}>${label}</button>`;
const go=(label,id,primary=false)=>B(label,'open',primary,`data-id="${id}"`);
const inspect=(label,key,primary=false)=>B(label,'inspect',primary,`data-key="${key}"`);
const field=(label,key,value,textarea=false)=>`<label class="wf-field"><span>${label}</span>${textarea?`<textarea data-field="${key}">${esc(value)}</textarea>`:`<input data-field="${key}" value="${esc(value)}">`}</label>`;
const head=(title,sub,action='')=>`<div class="wf-head"><div><h1>${title}</h1><p class="wf-sub">${sub}</p></div>${action}</div>`;
const notes={start:{title:'작업 시작',body:'팀·환경·수신자를 고정하고 필요한 본문과 조건을 확인한 뒤 전달합니다. 미리보기·검증·전달이 내부에서 구분되며, 이 버튼을 누른 횟수로 완료를 판정하지 않습니다.',next:'W09'},missing:{title:'필수 자료 복구',body:'권한이 있는 사본에서 정확한 판의 본문과 관련 정정을 받습니다. 수신과 검증만 끝난 상태는 작업 시작이 아닙니다.',next:'W08'},source:{title:'원본 새 버전 제안',body:'소유자의 원본과 기준 판을 고정하고 수정 내용을 별도 후보로 만듭니다. 다른 소유자의 원본이면 허용된 파생본 경로를 사용합니다. 팀 환경과 진행 중인 작업은 그대로입니다.',next:'W05'},validate:{title:'지식 검증',body:'대상 판·문항·domain package·필요한 8+1 렌즈 범위를 고정합니다. 결과는 검토 근거이며 승인·현재 사실성의 자동 보증이 아닙니다.',next:'W05'},correction:{title:'기록 정정',body:'잘못 적힌 D-018의 특정 주장을 대상으로 정정 사건을 추가합니다. 실제 선택을 바꾸는 새 결정·철회와 구분하며, 원기록은 지우지 않습니다.',next:'W05'},approve:{title:'승인 기록',body:'이 가상 사용자는 정확한 요청의 검토 권한만 있습니다. 승인 후에도 담당자의 발행과 팀 채택은 별도 결과이며, 현재 작업이 자동 전환되지 않습니다.',next:'W05'},create:{title:'팀 생성의 결과',body:'새 팀 ID와 초기 제안, 이 기기의 제어 기록을 만듭니다. 공동 운영은 상대의 동의·초기 확정이 남을 수 있고, 첫 업무환경은 별도 구성입니다. GitHub 추천 선택만으로 연결·업로드하지 않습니다.',next:'W07'},invite:{title:'초대·기기 등록',body:'초대 대상이 신원을 확인하고 동의한 뒤 권한자의 등록 결과를 확인합니다. 새 기기는 사람 수나 독립 승인표를 늘리지 않습니다.',next:'W07'},archive:{title:'팀 보관',body:'팀 전체의 새 작업·일반 변경을 멈추고 허용된 기록을 보관합니다. 복원·종료·필요한 권한 복구는 남겨 둡니다. 이미 전달한 문맥은 지워지지 않습니다.',next:'W05'},close:{title:'팀 영구 종료',body:'팀 ID를 종료하는 승인된 작업입니다. 내 기기 제거·탈퇴·원본 삭제와 다릅니다. 보존·인계 계획과 권한을 확인하며, GitHub 저장소나 오프라인 사본의 즉시 삭제를 뜻하지 않습니다.',next:'W05'},forget:{title:'이 기기에서만 제거',body:'내 구성원 자격과 다른 기기의 팀 상태를 유지합니다. 고유 초안·대기함·활성 확정 담당 상태는 인계 또는 허용된 처분 없이 버리지 않습니다.',next:'W08'},sync:{title:'자료 교환',body:'정확한 목록 비교 → 누락 자료 수신 → 무결성·권한·제어 기록 검증 → 보관 확인 순서입니다. GitHub·P2P·파일 묶음 모두 같은 검증을 거칩니다.',next:'W08'},recover:{title:'불확실한 결과 확인',body:'같은 작업 ID의 확정 결과를 조회하거나 돌려받습니다. 응답 유실을 실패로 단정해 새 ID로 중복 실행하지 않습니다.',next:'W08'},deliver:{title:'수신자에게 전달',body:'선택한 수신자의 실제 권한·독립 문맥·읽기 경로를 확인합니다. 부모에게 전달된 기록이나 해시만으로 하위 작업이 본문을 받았다고 표시하지 않습니다.',next:'W09'},bulk:{title:'일괄 작업 검토',body:'항목별 소유자·판·권한·중복·실패를 확인합니다. 다른 저장소까지 하나의 원자적 작업으로 묶었다고 주장하지 않으며, 완료 항목과 실패 항목은 분리해 재개합니다.',next:'W05'},settings:{title:'팀 설정 변경',body:'이름·연결·권한·운영 정책은 서로 다른 변경입니다. 이름 변경은 팀 ID를 보존하며, 권한 확대·정책 변경은 기존 정책으로 검토합니다.',next:'W05'},environment:{title:'환경 구성 수정',body:'원본의 내용을 수정하는 것이 아니라, 환경이 참조하는 정확한 자료 판·필수 여부·결정 범위를 바꿉니다. 새 초안을 검토하고 발행·채택합니다.',next:'W05'}};
const checkState=()=>s.variant==='missing'?'필수 근거 없음 · 시작 보류':s.variant==='offline'?'로컬 자료로 작업 가능 · GitHub 교환 대기':'필수 범위 준비 가능 · 팀 채택 3판';
function overview(){return `<section class="wf-overview">${head('10개 작업 흐름의 와이어프레임','색상·장식보다 정보의 순서, 동작의 위치, 이동 경로를 비교합니다.')}<div class="wf-index">${frames.map(f=>`<button type="button" class="wf-tile" data-action="open" data-id="${f.id}"><span class="wf-kicker">${f.id} · ${f.role}</span><strong>${f.name}</strong><div class="wf-mini"><span>${f.parts[0]}</span><span>${f.parts[2]}</span><span style="grid-column:1/-1">${f.parts[1]}</span></div><span class="wf-small">${f.need}</span></button>`).join('')}</div><div class="wf-callout">GUI는 로컬에서 동작하는 Studio를 가정합니다. TUI는 현재 구현의 스크린샷이 아니라 같은 과업을 위한 확장 설계안입니다.</div></section>`;}
function chrome(){return `<div class="wf-chrome"><div><strong>agent-bios</strong> / ${esc(s.teamName)}<br><span class="wf-small">개발 점검 기본 · 선택한 환경 3판</span></div><div class="wf-actions">${go('작업 기준','W01')}${go('환경·자료','W02')}${go('팀 관리','W07')}</div></div>`;}
function w01(){return head('이어서 할 작업의 기준','거래 상태 점검 · 기존 작업 맥락에서 준비',go('다른 환경 선택','W02'))+`<div class="wf-callout">${checkState()}${s.variant==='offline'?'<br><span class="wf-small">9월 12일 확인한 기준 · 이후 새 변경은 아직 미확인</span>':''}</div><div class="wf-split"><div><div class="wf-row"><div><h3>일하는 방법</h3><p>확인된 사실과 아직 확인하지 못한 내용을 구분합니다.</p><small>Instructions 5판</small></div></div><div class="wf-row"><div><h3>판단에 필요한 지식</h3>${s.variant==='missing'?'<p>거래 확인 기준의 본문이 없습니다.</p>':'<p>같은 요청의 실제 거래 상태를 먼저 확인합니다.</p><p class="wf-small">조건·예외: 결과 미확정 거래는 중복 확정으로 분류하지 않습니다.</p>'}</div>${go('근거 펼치기','W03')}</div><div class="wf-row"><div><h3>현재 결정과 열린 질문</h3><p>중복 확정과 미확정을 구분해 보고합니다.</p><small>중간 안내 주기는 아직 미결정 · 관련 정정 포함</small></div>${go('왜 이렇게 정했나','W04')}</div></div><aside class="wf-box"><h3>이번에 사용할 환경</h3><p>${esc(s.teamName)}<br>개발 점검 기본 · 3판</p><p class="wf-small">대상 문맥: 새 작업<br>기존 작업의 환경은 자동 교체하지 않음</p><div class="wf-section">${s.variant==='missing'?inspect('부족한 자료 받기','missing',true):inspect('이 기준으로 작업 시작','start',true)}</div>${go('수신자·전달 내용','W09')}</aside></div>`;}
function w02(){return head('팀이 함께 쓰는 환경','환경과 원본 자료를 같은 객체처럼 편집하지 않습니다.',go('자료 찾기','W10'))+`<div class="wf-split"><div><div class="wf-box"><div class="wf-row"><div><h2>개발 점검 기본 · 3판</h2><p class="wf-small">팀 채택됨 · 작업자가 시작할 기준</p></div>${inspect('구성 수정','environment')}</div><table class="wf-table"><thead><tr><th>자료</th><th>선택한 판·범위</th><th>필요성</th></tr></thead><tbody><tr><td>작업 지침</td><td>5판</td><td>필수</td></tr><tr><td>결제 업무 원칙</td><td>7판</td><td>필수</td></tr><tr><td>결정 기억</td><td>결제 안정성 + 출시 운영</td><td>필수</td></tr><tr><td>배포 점검표</td><td>2판</td><td>선택</td></tr></tbody></table></div><div class="wf-row"><div><strong>검토 전용 환경 · 1판</strong><small>다른 목적의 환경 · 현재 선택되지 않음</small></div>${inspect('포함 범위 보기','environment')}</div></div><aside class="wf-box"><h3>누구의 자료인가?</h3><p>팀 원본과 허용된 공통 자료를 함께 참조합니다.</p><p class="wf-small">환경을 바꿔도 원본은 그대로입니다. 원본 수정은 소유자 권한을 확인합니다.</p><div class="wf-section wf-actions">${go('지식 원본','W03')}${go('결정 원본','W04')}</div></aside></div><div class="wf-bottom"><span class="wf-small">작성 중인 4판 초안과 채택된 3판은 별도 상태입니다.</span>${go('초안 변경 검토','W05',true)}</div>`;}
function w03(){return head('결제 확인 기준','업무 지식 7판 · 팀 소유 · 적용 범위와 근거를 함께 읽습니다.')+`<div class="wf-source-layout"><nav class="wf-selection" aria-label="지식의 보기">${[['rule','기준 본문'],['relations','개념·연결'],['questions','검증 문항']].map(([id,name])=>`<button type="button" data-action="knowledge" data-value="${id}" aria-pressed="${s.knowledge===id}">${name}</button>`).join('')}</nav><article class="wf-box">${s.knowledge==='rule'?`<h3>원칙</h3><p>같은 거래를 중복 처리하지 않습니다.</p>${field('현재 기준 · 수정 제안','newText',s.newText,true)}<dl class="wf-facts"><dt>시행 기간</dt><dd>9월 1일부터 · 종료일 미정</dd><dt>적용 조건</dt><dd>같은 요청의 거래 상태를 비교하는 경우</dd><dt>예외</dt><dd>미확정 거래를 확정된 중복으로 표시하지 않음</dd></dl>`:s.knowledge==='relations'?`<h3>선택한 개념 주변의 관계</h3><div class="wf-node">요청 식별자</div><div class="wf-edge">↓ 같은 요청에 속한</div><div class="wf-node">거래 상태</div><div class="wf-edge">↓ 확인 결과를 근거로</div><div class="wf-node">중복 여부 판단</div><p class="wf-small">전체 그래프를 한 번에 펼치지 않고 선택한 관계와 영향을 탐색합니다.</p>${inspect('관계 수정 제안','source')}`:`<h3>검증 문항</h3><div class="wf-row">Q-01 · 결과 미확정 거래를 중복 확정으로 분류할 수 있는가?</div><div class="wf-row">기대 답변 · 아니오. 미확정을 별도로 남긴다.</div><div class="wf-row">반례 · 지연 중인 결제를 실패로 단정함</div><p class="wf-small">문항·domain package·필요한 8+1 렌즈를 고정해 검토합니다.</p>${inspect('이 범위 검증','validate',true)}`}</article><aside class="wf-box"><h3>원문과 증거</h3><p>운영 원칙 §2<br>검토 기록 9월 12일</p><details open><summary>필수로 함께 읽을 것</summary><p>요청 식별자의 의미, 거래 상태 구분, 예외 조건</p></details><details><summary>참조·영향</summary><p>개발 점검 기본 3판이 참조합니다. 새 지식 판을 발행해도 이 환경의 참조는 자동 변경하지 않습니다.</p></details></aside></div><div class="wf-bottom"><span class="wf-small">의미 검증과 최신 사실 확인, 승인 여부는 다른 판단입니다.</span>${inspect('새 버전 제안 검토','source',true)}</div>`;}
function w04(){return head('현재 결정까지의 흐름','업무 흐름이 달라도 같은 결정을 정정할 수 있습니다.')+`<div class="wf-callout">현재 선택: 중복 확정과 미확정은 구분해 보고 · 중간 안내 주기는 미결정</div><div class="wf-lanes"><div class="wf-small">기록일</div><div><strong>결제 안정성</strong></div><div><strong>출시 운영</strong></div><div class="wf-small">09.06</div><div><button type="button" data-action="memory" data-value="Q12">Q-012 · 문제 제기<small>미확인 상태를 어떻게 분류할까?</small></button></div><div></div><div class="wf-small">09.08</div><div><button type="button" data-action="memory" data-value="D18">D-018 · 결정<small>구분해 보고하기로 함</small></button></div><div></div><div class="wf-small">09.10</div><div class="wf-small">← D-018의 잘못 적힌 표현을 정정</div><div><button type="button" data-action="memory" data-value="C21">C-021 · 기록 정정<small>실제 선택 변경과 구분</small></button></div></div><div class="wf-section wf-equal"><section class="wf-box"><h3>선택한 기록 · ${s.memory==='Q12'?'Q-012':s.memory==='C21'?'C-021':'D-018'}</h3><p>${s.memory==='Q12'?'결과를 확인하지 못한 거래를 보고에서 어떻게 다룰지 질문했습니다.':s.memory==='C21'?'D-018에 적힌 표현이 회의의 실제 선택과 달라 바로잡았습니다.':'불확실한 거래를 확정 사실로 취급하지 않기 위해 두 상태를 구분했습니다.'}</p><p class="wf-small">시간의 앞뒤만으로 원인을 추론하지 않습니다.</p></section><section class="wf-box"><h3>이유·대안·근거</h3><p>대안: 모든 의심 거래를 중복으로 보고<br>근거: 당시 운영 검토 기록</p><p class="wf-small">이유가 없는 기록은 없다고 표시합니다.</p>${inspect('이 기록 정정 제안','correction')}</section></div>`;}
function w05(){return head('변경의 의미와 영향을 검토합니다','Q-014 · 업무 지식 7판 → 8판 제안 · 현재 계정은 검토 권한만 있음.')+`<div class="wf-equal"><section class="wf-box"><h3>현재 7판</h3><p>같은 요청의 실제 거래 상태를 먼저 확인한다.</p><p class="wf-small">미확정 거래는 확정된 중복으로 분류하지 않는다.</p></section><section class="wf-box"><h3>제안 8판</h3><p>${esc(s.newText)}</p><p class="wf-small">수정한 내용과 기준 판을 고정한 요청</p></section></div><div class="wf-equal wf-section"><section><h3>이유와 근거</h3><p class="wf-sub">미확정 상태의 보고 방식을 더 명확히 합니다. 원문과 필요한 예외를 함께 검토합니다.</p>${go('원문과 연결 보기','W03')}</section><section><h3>이 요청을 승인하면</h3><p class="wf-sub">발행을 위한 승인이 기록됩니다. 팀의 환경 3판과 기존 작업은 그대로입니다.</p><p class="wf-small">남은 담당: 서준 · 원본 발행</p></section></div><div class="wf-bottom"><div class="wf-actions">${inspect('추가 검토 의견','approve')}${inspect('승인 기록','approve',true)}</div><span class="wf-small">승인 ≠ 발행 ≠ 팀 채택 ≠ 실제 사용</span></div>`;}

if(f.id==='W04')content=`[현재 상태] 확정·미확정 구분 보고\n[열린 질문] 중간 안내 주기\n\n09.06 | 결제 안정성 | Q-012 문제 제기\n09.08 | 결제 안정성 | D-018 결정\n09.10 | 출시 운영   | C-021 → D-018 표현 정정\n\n선택: ${s.memory}\n이유: 추정을 확정처럼 처리하지 않기 위해\n대안: 모든 의심 거래를 중복으로 보고\n근거: 당시 운영 회의 기록\n\n기록 순서만으로 인과관계를 만들지 않습니다.`;
if(f.id==='W05')content=`[Q-014] 지식 7판 → 8판 제안\n[권한] 지원 / 검토 가능 / 발행 권한 없음\n\n--- 현재\n- 같은 요청의 실제 거래 상태를 먼저 확인한다.\n+++ 제안\n+ ${s.newText}\n\n[효과] 이 요청의 승인만 기록\n[유지] 팀 환경 3판 / 기존 작업 문맥\n[다음 담당] 서준 — 원본 발행\n\n승인한 대상이 바뀌면 다시 검토합니다.`;
if(f.id==='W06')content=`[팀 생성 / 현재 입력]\n팀 이름: ${s.teamName}\n초기 책임자: 민지\n기본 보관: P2P\n연결 선택: ${s.repo==='github'?'(선택) GitHub 연결 추천':'(선택) P2P만 사용'}\n운영 방식: ${s.governance==='shared'?'공동 검토 / 지원 동의 대기':'1인 운영 / 직접 결정'}\n\n[생성 결과]\n팀 ID + 로컬 제어 기록 1곳\n업무환경은 아직 0개\n\n설정 상세: 폐쇄망·주간 교환 / 권한 / 복구\n추천 선택만으로 인증·업로드하지 않습니다.`;
if(f.id==='W07')content=`[팀] ${s.teamName} / T-product / 운영 중\n\n1. 팀 상태·환경 목록\n2. 구성원·기기와 권한\n3. 이름·연결·운영 정책 변경\n4. 소유·확정 담당 이전\n5. 팀 보관 / 복원\n6. 팀 영구 종료\n7. 탈퇴 / 이 기기에서만 제거\n\n[주의할 구분]\n로컬 제거 ≠ 탈퇴 ≠ 보관 ≠ 영구 종료\n활성 확정 담당과 유일한 책임은 인계 후 제거\n원격 저장소·원본 물리 삭제는 별도 작업`;
if(f.id==='W08')content=`[로컬 작업] 가능 / 9월 12일 확인 기준\n[GitHub] 교환 대기 — 작업 가능과 별개\n\n보낼 것:\n Q-014 지식 수정 제안 — 로컬 보존\n O-024 관측 기록 — 공유 전\n받을 것:\n 필수 본문 7판 — 지원의 사본에 보유\n결과 확인:\n OP-012 — 동일 ID로 결과 조회\n\n보관: 내 기기 P40 / 지원 P40(9/12 확인)\nGitHub 마지막 전송 P39\n\n중복 수신은 같은 기록으로 처리합니다.`;
if(f.id==='W09')content=`[기존 문맥] 제품 개발팀 / 환경3 / M-42\n[이번 수신자] 새 작업 또는 하위 작업\n\n확인할 것:\n [ ] 이 수신자의 원본 접근 권한\n [ ] 필요한 본문 또는 실제 읽기 경로\n [ ] 지침·문맥의 호환성\n [ ] 해당 수신자의 전달 결과\n\n넘길 것:\n 업무 목표·범위 / 현재 결정과 열린 질문\n 필요한 조건·예외 / 정확한 출처\n\n부모의 전달 기록만으로 완료 표시하지 않습니다.`;
if(f.id==='W10')content=`[범위] 제품 개발팀 + 허용된 공유 자료\n[검색] ${s.search||'(전체)'}\n\n항목 / 종류·판 / 소유·접근\n${searchItems().map(x=>x.join(' / ')).join('\n')||'이 범위에서 일치하는 항목 없음'}\n\n계획: 항목별 소유·판·권한·중복 확인\n결과: 완료 / 실패 / 미확인 따로 기록\n재개: 미확인 결과 조회 후 남은 항목만\n\nGUI가 없어도 범위·결과를 텍스트로 확인합니다.`;
const keys={W01:[['시작 의도 확인','start'],['필수 자료 복구','missing']],W02:[['구성 변경','environment']],W03:[['본문 수정 제안','source'],['문항·렌즈 검토','validate']],W04:[['정정 기록 제안','correction']],W05:[['승인 기록','approve']],W06:[['생성 결과 검토','create']],W07:[['팀 설정','settings'],['보관','archive'],['영구 종료','close'],['로컬 제거','forget']],W08:[['교환','sync'],['동일 작업 결과 확인','recover']],W09:[['수신자 확인·전달','deliver']],W10:[['가져오기 계획 검토','bulk']]};return `<section class="wf-terminal">${head(f.name,'텍스트 순서·목록·단축 동작의 대응안 · 실제 터미널 실행 아님')}<div class="wf-terminalbar">agent-bios | ${esc(s.teamName)} | ${f.id}</div><pre>${esc(content)}</pre><div class="wf-keyrow">${keys[f.id].map(([label,key],i)=>`<button type="button" data-action="inspect" data-key="${key}">[${i+1}] ${label}</button>`).join('')}${go('관련 다음 화면',f.next)}</div><p class="wf-small" style="margin-top:12px">숫자는 제안된 단축키 표기입니다. 이 HTML은 터미널 키 입력·한글 셀 폭·스크린리더 동작을 재현하지 않습니다.</p></section>`;}
function detail(){const f=frame();return `<div class="wf-meta"><div><span class="wf-kicker">${f.id} · ${f.role} · ${f.req}</span><h2>${f.need}</h2></div>${L('전체 화면 지도','overview')}</div><section class="wf-screen">${s.surface==='gui'?chrome()+({W01:w01,W02:w02,W03:w03,W04:w04,W05:w05,W06:w06,W07:w07,W08:w08,W09:w09,W10:w10}[f.id])():terminal()}</section>${design.notes?`<aside class="wf-annotation"><strong>이 과업의 인터페이스 판단</strong><p>GUI: ${f.gui}</p><p>TUI: ${f.tui}</p></aside>`:''}${s.note?`<aside class="wf-annotation" aria-live="polite"><div class="wf-head" style="margin-bottom:7px"><h3>동작 설명 · ${s.note.title}</h3>${L('설명 닫기','close-note')}</div><p>${s.note.body}</p><div class="wf-actions" style="margin-top:12px">${go('관련 와이어프레임 열기',s.note.next)}</div></aside>`:''}`;}
function render(){const active=document.activeElement;const focus=root.contains(active)?{field:active.dataset.field,action:active.dataset.action,key:active.dataset.key,id:active.dataset.id,value:active.dataset.value}:{};root.style.setProperty('--wf-pad',design.density==='compact'?'18px':'24px');root.innerHTML=`<div class="wf-toolbar"><div><strong>와이어프레임 모음</strong><div class="wf-small">정보·동작 배치 검토 · 모든 자료는 가상</div></div><label>화면<select data-field="screen" aria-label="화면 선택"><option value="all" ${s.overview?'selected':''}>전체 10개 한눈에</option>${frames.map(f=>`<option value="${f.id}" ${!s.overview&&s.id===f.id?'selected':''}>${f.id} ${f.name}</option>`).join('')}</select></label><div class="wf-toggle" aria-label="표현 방식"><button type="button" data-action="surface" data-value="gui" aria-pressed="${s.surface==='gui'}">GUI</button><button type="button" data-action="surface" data-value="tui" aria-pressed="${s.surface==='tui'}">TUI</button></div>${!s.overview&&s.id==='W01'?`<label>조건<select data-field="variant" aria-label="작업 조건"><option value="normal" ${s.variant==='normal'?'selected':''}>보통</option><option value="offline" ${s.variant==='offline'?'selected':''}>GitHub 연결 없음</option><option value="missing" ${s.variant==='missing'?'selected':''}>필수 근거 없음</option></select></label>`:''}</div>${s.overview?overview():detail()}<div class="wf-status" role="status" aria-live="polite">${esc(s.message)}</div>`;let target=focus.field?root.querySelector(`[data-field="${focus.field}"]`):focus.action?root.querySelector(`[data-action="${focus.action}"]${focus.key?`[data-key="${focus.key}"]`:''}${focus.id?`[data-id="${focus.id}"]`:''}${focus.value?`[data-value="${focus.value}"]`:''}`):null;if(!target&&focus.action)target=root.querySelector('.wf-screen button, .wf-overview button');target?.focus({preventScroll:true});}
function open(id){s.history.push(s.id);s.id=id;s.overview=false;s.note=null;s.message=`${id} ${frame().name} · 배치와 다음 행동을 검토합니다. 실제 변경을 실행하지 않았습니다.`;}
root.addEventListener('input',e=>{const k=e.target.dataset.field;if(['teamName','newText','search'].includes(k)){s[k]=e.target.value;if(k==='search')render();}});
root.addEventListener('change',e=>{const k=e.target.dataset.field;if(k==='screen'){if(e.target.value==='all')s.overview=true;else open(e.target.value);}else if(['variant','repo','governance'].includes(k))s[k]=e.target.value;else return;render();});
root.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='open')open(b.dataset.id);if(a==='overview'){s.overview=true;s.note=null;}if(a==='surface'){s.surface=b.dataset.value;s.message='같은 과업을 다른 표현으로 봅니다. 권한·자료·판은 바뀌지 않습니다.';}if(a==='inspect'){s.note=notes[b.dataset.key]||notes.settings;s.note={...s.note};if(b.dataset.key==='correction'){const target=s.memory==='Q12'?'Q-012':s.memory==='C21'?'C-021':'D-018';s.note.body=s.note.body.replace('D-018',target);}s.lastClicked=b.textContent;s.message='와이어프레임의 동작 설명을 열었습니다. 승인·생성·삭제를 수행하지 않았습니다.';}if(a==='close-note')s.note=null;if(a==='knowledge')s.knowledge=b.dataset.value;if(a==='memory')s.memory=b.dataset.value;if(a==='team-section')s.teamSection=b.dataset.value;render();});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'배치 간격',options:[{label:'기본',value:'comfortable'},{label:'밀도 높게',value:'compact'}]});tweak.addToggle(design,'notes',{label:'GUI·TUI 검토 메모 표시'});}
})();
</script>
